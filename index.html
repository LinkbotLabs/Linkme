<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="google-site-verification" content="ohpzxX7bmF1anP3RvE5v_2bzhepA0UJaCJ0jLzlJBNQ" />

<title>Free Affiliate Wall Builder – Create & Share Product Pages | Tagshop</title>
<meta name="description" content="Build a free affiliate wall in minutes. Add Amazon, DHgate or Temu products and share your custom storefront instantly." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://linkmetagshop.vercel.app" />

<link rel="stylesheet" href="uniform-dark-glass.css">

<style>
:root { --glass: rgba(0,0,0,0.35); --stroke: rgba(255,255,255,0.12); --text:#fff; --muted:#cfcfcf; --accent:#ffe169; }
body { font-family: system-ui; background:#000; color:#fff; padding:20px; }
h1 { text-align:center; margin-bottom:10px; }
button { cursor:pointer; border:none; border-radius:6px; padding:6px 10px; font-weight:700; background:#000; color:#fff; font-size:12px; }
.card { background: var(--glass); border:1px solid var(--stroke); border-radius:12px; padding:12px; margin-bottom:20px; }
.grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.product { border:1px solid var(--stroke); border-radius:10px; padding:10px; background:rgba(0,0,0,0.25); }
.product img { width:100%; border-radius:6px; cursor:pointer; }
.product-title { font-size:13px; margin-top:6px; font-weight:600; }
.product-btns { display:flex; justify-content:center; gap:6px; margin-top:6px; flex-wrap:wrap; }

.details {
  display:none;
  margin-top:8px;
  padding:8px;
  border-top:1px solid var(--stroke);
  font-size:12px;
  text-align:left;
  line-height:1.4;
}

.details strong { color: var(--accent); }

.unlimited-banner {
  background: linear-gradient(135deg, #1fc27e, #39ff14);
  color:#000;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  border-radius:12px;
  margin:10px 0 25px;
}
</style>
</head>
<body>

<h1>Free Affiliate Wall Builder</h1>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password on My Wall: <strong>tagshopme</strong></span>
</div>

<div class="card">
  <h2>Search Products to Add to Your Affiliate Wall</h2>
  <input type="text" id="search-query" placeholder="Search Amazon, DHgate, Temu products..." />
  <button id="search-run">Search</button>
  <div id="search-results"></div>
</div>

<button onclick="window.location.href='mywall.html'" 
style="position:fixed; bottom:20px; right:20px; background:#000; color:#ffe169; border-radius:16px; padding:10px 14px;">
My Wall
</button>

<script>

function log(msg){ console.log(msg); }

const searchResults = document.getElementById("search-results");

document.getElementById("search-run").addEventListener("click", async ()=>{
  const query = document.getElementById("search-query").value.trim();
  if(!query){
    searchResults.innerHTML = "Enter a search term.";
    return;
  }

  searchResults.innerHTML = "<strong>Loading results...</strong>";

  let allItems = [];

  try {
    for(let page=0; page<5; page++){
      const start = page*10+1;
      const res = await fetch("/api/search?q=" + encodeURIComponent(query) + "&start=" + start);
      const data = await res.json();
      if(data.items && data.items.length>0){
        allItems = allItems.concat(data.items);
      } else break;
    }

    if(allItems.length===0){
      searchResults.innerHTML = "No results found.";
      return;
    }

    searchResults.innerHTML="";
    const grid=document.createElement("div");
    grid.className="grid";

    allItems.forEach(item=>{
      const thumb=item.pagemap?.cse_image?.[0]?.src || "https://via.placeholder.com/200";

      const card=document.createElement("div");
      card.className="product";

      const img=document.createElement("img");
      img.src=thumb;
      img.onclick=()=>window.open(item.link,"_blank");

      const title=document.createElement("div");
      title.className="product-title";
      title.textContent=item.title;

      const btnWrap=document.createElement("div");
      btnWrap.className="product-btns";

      const details=document.createElement("div");
      details.className="details";
      details.innerHTML=`
        <strong>Why this product?</strong><br>
        Popular option in the "${query}" category with strong marketplace visibility.<br><br>
        <strong>Best for:</strong>
        <ul>
          <li>Budget buyers</li>
          <li>Everyday use</li>
          <li>Gift ideas</li>
        </ul>
        <strong>Buying Tips:</strong><br>
        ✔ Check recent reviews<br>
        ✔ Compare shipping times<br>
        ✔ Look for bundles or discounts<br><br>
      `;

      const viewBtn=document.createElement("button");
      viewBtn.textContent="View Details";
      viewBtn.onclick=()=>{
        details.style.display=
          details.style.display==="block"?"none":"block";
      };

      const addBtn=document.createElement("button");
      addBtn.textContent="Add To Wall";
      addBtn.onclick=()=>addToWall(item.title,thumb,item.link);

      btnWrap.appendChild(viewBtn);
      btnWrap.appendChild(addBtn);

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(btnWrap);
      card.appendChild(details);
      grid.appendChild(card);
    });

    searchResults.appendChild(grid);

  } catch(err){
    searchResults.innerHTML="Search error.";
  }
});

function addToWall(title,thumb,link){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.push({title,thumb,link});
  localStorage.setItem("productWall",JSON.stringify(wall));
  alert("Added to your wall!");
}

</script>

</body>
</html>
