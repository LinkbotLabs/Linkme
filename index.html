<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Affiliate */
#affiliateSection{
  width:100%;
  max-width:420px;
  margin-bottom:24px;
}

#affiliateConnected{
  display:none;
  padding:14px;
  border-radius:14px;
  background:#ecfdf3;
  color:#166534;
  font-size:14px;
  font-weight:500;
  text-align:center;
}

/* Card */
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>

<body>

<!-- Affiliate -->
<div id="affiliateSection">

  <div id="affiliateForm">
    <input 
      id="affiliateInput"
      placeholder="Enter your affiliate ID or full link"
      style="width:100%;padding:14px;border-radius:14px;border:1px solid #e5e7eb;font-size:14px;"
    />
    <button 
      onclick="saveAffiliate()" 
      style="margin-top:12px;width:100%;padding:14px;border-radius:14px;border:none;background:#1a1a1a;color:white;font-weight:500;cursor:pointer;">
      Connect Affiliate
    </button>
  </div>

  <div id="affiliateConnected">
    ✓ Affiliate Connected
  </div>

</div>

<!-- Product -->
<div class="card" id="card">
  <div class="loading">Loading curated product…</div>
</div>

<script>

/* ===============================
   AFFILIATE SYSTEM
=================================*/

let affiliateId = localStorage.getItem("affiliateId") || "";
if (affiliateId) showConnected();

function saveAffiliate() {
  const input = document.getElementById("affiliateInput").value.trim();
  if (!input) return alert("Enter valid affiliate details");

  localStorage.setItem("affiliateId", input);
  affiliateId = input;
  showConnected();
}

function showConnected() {
  document.getElementById("affiliateForm").style.display = "none";
  document.getElementById("affiliateConnected").style.display = "block";
}

/* ===============================
   ENGINE CONFIG
=================================*/

const categoryPool = [
  "viral gadgets",
  "tiktok beauty finds",
  "amazon fitness trending",
  "home improvement must have",
  "car accessories trending",
  "kitchen hacks viral",
  "tech under 50 dollars",
  "travel essentials trending"
];

const CACHE_KEY = "float_pool";
const CACHE_TIME_KEY = "float_time";
const ONE_DAY = 1000 * 60 * 60 * 24;

/* ===============================
   HELPERS
=================================*/

function getNumericPrice(price){
  if(!price) return 0;
  return Number(price.replace(/[^0-9.]/g,"")) || 0;
}

function appendAffiliate(url){
  if(!affiliateId) return url;
  if(affiliateId.startsWith("http")) return affiliateId;

  const joiner = url.includes("?") ? "&" : "?";
  return url + joiner + "affid=" + affiliateId;
}

function generateHook(title){
  const hooks = [
    "Amazon Can’t Keep This in Stock",
    "TikTok Made This Sell Out in 48 Hours",
    "The Upgrade Everyone’s Talking About",
    title + " Is Blowing Up Right Now"
  ];
  return hooks[Math.floor(Math.random() * hooks.length)];
}

/* ===============================
   SHARE + GROK
=================================*/

function shareProduct(){
  const code = Math.random().toString(36).substring(2,8);
  localStorage.setItem("shareCode", code);
  const shareUrl = window.location.origin + "?ref=" + code;
  navigator.clipboard.writeText(shareUrl);
  alert("Share link copied!");
}

function generateVideo(product){
  const shareCode = localStorage.getItem("shareCode") || "";
  const shareUrl = window.location.origin + "?ref=" + shareCode;

  const prompt = `
Create a 6 second viral product video.
Hook: "${product.title}"
Price: ${product.price}
Tone: Excited, viral, modern.
End with: Shop here ${shareUrl}
`;

  navigator.clipboard.writeText(prompt.trim());
  alert("Grok prompt copied!");
}

/* ===============================
   FETCH ENGINE (50 pool + 24h cache)
=================================*/

async function loadProducts(){

  const cached = localStorage.getItem(CACHE_KEY);
  const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

  if(cached && cachedTime && (Date.now() - cachedTime < ONE_DAY)){
    renderProduct(JSON.parse(cached));
    return;
  }

  const randomCategory = categoryPool[Math.floor(Math.random() * categoryPool.length)];

  try{
    const res = await fetch(`/api/search?q=${encodeURIComponent(randomCategory)}&num=50`);
    const data = await res.json();
    if(!data.products) throw new Error("No products");

    localStorage.setItem(CACHE_KEY, JSON.stringify(data.products));
    localStorage.setItem(CACHE_TIME_KEY, Date.now());

    renderProduct(data.products);

  }catch(err){
    document.getElementById("card").innerHTML =
      `<div class="loading">Waiting for API reset…</div>`;
  }
}

/* ===============================
   RENDER HIGHEST PRICE FEATURED
=================================*/

function renderProduct(products){

  products.sort((a,b)=>{
    return getNumericPrice(b.price) - getNumericPrice(a.price);
  });

  const product = products[0]; // highest price

  const hook = generateHook(product.title);

  document.getElementById("card").innerHTML = `
    <div style="font-family:Playfair Display,serif;font-size:26px;margin-bottom:20px;text-align:center;">
      ${hook}
    </div>

    <img src="${product.image}" style="width:100%;border-radius:18px;margin-bottom:20px;" />

    <div style="color:#6b7280;font-size:14px;margin-bottom:12px;">
      🔥 Trending Today
    </div>

    <div style="font-size:28px;font-weight:600;margin-bottom:20px;">
      ${product.price || "$29.99"}
    </div>

    <button onclick="window.open(appendAffiliate('${product.link}'),'_blank')" 
      style="width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#2e7d32,#3fa34d);color:white;font-weight:500;cursor:pointer;margin-bottom:12px;">
      🛒 Shop Now
    </button>

    <button onclick="shareProduct()" 
      style="width:100%;padding:14px;border-radius:14px;border:1px solid #e5e7eb;background:white;margin-bottom:12px;">
      🔗 Share
    </button>

    <button onclick='generateVideo(${JSON.stringify(product)})'
      style="width:100%;padding:14px;border-radius:14px;border:none;background:#e5e7eb;">
      🎬 Grok Video
    </button>
  `;
}

/* =============================== */

loadProducts();

</script>

</body>
</html>
