<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkme – Discover Viral Finds</title>

<style>
:root{
  --bg:#fafafa;
  --card:#ffffff;
  --text:#111;
  --muted:#6e6e73;
  --border:#ececec;
  --accent:#000;
  --success:#34c759;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.hero{
  text-align:center;
  padding:100px 20px 70px;
  background:linear-gradient(to bottom,#ffffff,#f5f5f7);
}

.hero h1{
  font-size:3.2rem;
  font-weight:800;
  letter-spacing:-1px;
  margin-bottom:20px;
}

.hero p{
  color:var(--muted);
  font-size:1.2rem;
  max-width:650px;
  margin:auto;
  margin-bottom:35px;
}

.hero-cta{
  display:inline-block;
  padding:14px 28px;
  background:black;
  color:white;
  border-radius:12px;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}
.hero-cta:hover{
  transform:translateY(-3px);
}

.section{
  max-width:1300px;
  margin:80px auto;
  padding:0 30px;
}

.section h2{
  font-size:1.9rem;
  margin-bottom:8px;
}

.section-sub{
  color:var(--muted);
  margin-bottom:35px;
}

.grid{
  display:grid;
  gap:30px;
}

@media (min-width:0px){ .grid{grid-template-columns:1fr;} }
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (min-width:1024px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:1400px){ .grid{grid-template-columns:repeat(4,1fr);} }

.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.04);
  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 18px 45px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.card-body{
  padding:20px;
}

.title{
  font-weight:700;
  font-size:1rem;
  margin-bottom:14px;
  line-height:1.4;
}

.buttons{
  display:flex;
  gap:10px;
}

.visit{
  flex:1;
  text-align:center;
  padding:11px;
  border-radius:10px;
  background:#f2f2f2;
  text-decoration:none;
  color:#000;
  font-weight:600;
}

.add{
  flex:1;
  padding:11px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.added{
  background:var(--success)!important;
}

#wallBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:black;
  color:white;
  padding:16px 28px;
  border-radius:50px;
  font-weight:700;
  border:none;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="hero">
  <h1>Discover Viral Internet Finds</h1>
  <p>Curated Amazon, Temu & DHgate products updated daily.</p>
  <a href="#sections" class="hero-cta">Explore Today’s Drops</a>
</div>

<div id="sections"></div>

<button id="wallBtn" onclick="location.href='mywall.html'">
→ My Curated Shop (0)
</button>

<script>

const groups=[
  {heading:"Hot Today 🔥",query:"tiktok viral products 2026"},
  {heading:"Glow Up Essentials ✨",query:"self care trending products"},
  {heading:"Aesthetic Tech 📱",query:"aesthetic tech gadgets"},
  {heading:"Travel Smart ✈️",query:"travel essentials trending"}
];

function updateCount(){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  document.getElementById("wallBtn").textContent=
    `→ My Curated Shop (${wall.length})`;
}

function addToWall(product){
  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(wall.some(p=>p.link===product.link)) return;

  wall.push(product);
  localStorage.setItem("productWall",JSON.stringify(wall));
  updateCount();
}

function createCard(item){
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
    <img src="${item.image}">
    <div class="card-body">
      <div class="title">${item.title}</div>
      <div class="buttons">
        <a href="${item.link}" target="_blank" class="visit">Visit</a>
        <button class="add">Add</button>
      </div>
    </div>
  `;

  card.querySelector(".add").onclick=()=>{
    addToWall(item);
    const btn=card.querySelector(".add");
    btn.textContent="Added ✓";
    btn.classList.add("added");
    btn.disabled=true;
  };

  return card;
}

async function render(){
  updateCount();
  const container=document.getElementById("sections");

  for(const group of groups){
    const section=document.createElement("div");
    section.className="section";
    section.innerHTML=`
      <h2>${group.heading}</h2>
      <div class="grid"></div>
    `;
    container.appendChild(section);

    const grid=section.querySelector(".grid");

    const res=await fetch(`/api/search?q=${encodeURIComponent(group.query)}`);
    const data=await res.json();

    data.items.slice(0,8).forEach(item=>{
      grid.appendChild(createCard(item));
    });
  }
}

window.onload=render;

</script>
</body>
</html>
