<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tagshop – The Simplest Affiliate Wall Builder</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<style>
:root {
  --glass: rgba(0,0,0,0.35);
  --stroke: rgba(255,255,255,0.12);
  --text:#fff;
  --muted:#cfcfcf;
  --accent:#ffe169;
}

body {
  font-family: system-ui;
  background:#000;
  color:#fff;
  padding:20px;
  max-width:900px;
  margin:auto;
}

h1 {
  text-align:center;
  font-size:32px;
  margin-bottom:8px;
}

.subhead {
  text-align:center;
  color:var(--muted);
  font-size:16px;
  margin-bottom:30px;
}

.card {
  background: var(--glass);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--stroke);
  background: rgba(255,255,255,0.06);
  color:#fff;
  margin-top:8px;
}

button {
  cursor:pointer;
  border:none;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  margin-top:12px;
  font-size:14px;
}

.primary {
  background:var(--accent);
  color:#000;
}

.secondary {
  background:#000;
  color:var(--accent);
  border:1px solid var(--accent);
}

.how {
  display:grid;
  gap:14px;
  margin-top:10px;
}

.step {
  background:rgba(255,255,255,0.05);
  padding:14px;
  border-radius:10px;
}
</style>
</head>
<body>

<h1>Tagshop</h1>
<div class="subhead">
  The simplest way to showcase your affiliate products.
</div>

<!-- HOW IT WORKS -->
<div class="card">
  <h2>How It Works</h2>
  <div class="how">
    <div class="step">1️⃣ Paste your product links</div>
    <div class="step">2️⃣ Add your affiliate IDs</div>
    <div class="step">3️⃣ Share one clean wall link</div>
  </div>
</div>

<!-- ADD PRODUCT -->
<div class="card">
  <h2>Add Product</h2>
  <input type="text" id="product-link" placeholder="Paste product URL (Amazon, Temu, DHGate, etc.)" />
  <input type="text" id="product-title" placeholder="Optional: Custom title" />
  <input type="text" id="product-image" placeholder="Optional: Image URL" />
  <button class="primary" onclick="addManualProduct()">Add to My Wall</button>
</div>

<!-- WALL BUTTON -->
<div class="card" style="text-align:center;">
  <h2>Your Wall</h2>
  <p style="color:var(--muted);">View, edit, and share your affiliate storefront.</p>
  <button class="secondary" onclick="window.location.href='mywall.html'">
    Open My Wall
  </button>
</div>

<script>
function addManualProduct(){
  const link = document.getElementById("product-link").value.trim();
  let title = document.getElementById("product-title").value.trim();
  let thumb = document.getElementById("product-image").value.trim();

  if(!link){
    alert("Please paste a product link.");
    return;
  }

  if(!title){
    try {
      const url = new URL(link);
      title = url.hostname.replace("www.","");
    } catch {
      title = "Product";
    }
  }

  if(!thumb){
    thumb = "https://via.placeholder.com/150";
  }

  const wall = JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.push({title, thumb, link});
  localStorage.setItem("productWall", JSON.stringify(wall));

  alert("Added to wall!");
  document.getElementById("product-link").value = "";
  document.getElementById("product-title").value = "";
  document.getElementById("product-image").value = "";
}
</script>

</body>
</html>
