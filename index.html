<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkme – Curated Affiliate Storefront</title>

<style>
:root{
  --bg:#f8f8f8;
  --card:#ffffff;
  --text:#111;
  --muted:#6e6e73;
  --border:#e8e8ed;
  --accent:#000;
  --success:#34c759;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.hero{
  text-align:center;
  padding:90px 20px 50px;
}
.hero h1{
  font-size:3rem;
  font-weight:700;
}
.hero p{
  color:var(--muted);
  font-size:1.1rem;
  max-width:600px;
  margin:auto;
}

.section{
  max-width:1300px;
  margin:70px auto;
  padding:0 30px;
}

.section h2{
  font-size:1.8rem;
  margin-bottom:30px;
  letter-spacing:-0.3px;
}

.grid{
  display:grid;
  gap:28px;
}

@media (min-width:0px){ .grid{grid-template-columns:1fr;} }
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (min-width:1024px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:1280px){ .grid{grid-template-columns:repeat(4,1fr);} }

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}
.card-body{
  padding:18px;
}
.platform{
  font-size:.75rem;
  color:var(--muted);
  margin-bottom:6px;
}
.title{
  font-weight:600;
  font-size:1rem;
  margin-bottom:8px;
}
.price{
  font-weight:700;
  margin-bottom:12px;
}
.buttons{
  display:flex;
  gap:10px;
}
.visit{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:10px;
  background:#f2f2f2;
  text-decoration:none;
  color:#000;
  font-weight:600;
}
.add{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  font-weight:600;
  cursor:pointer;
}
.added{
  background:var(--success)!important;
}

#wallBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:black;
  color:white;
  padding:16px 28px;
  border-radius:50px;
  font-weight:700;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Linkme</h1>
  <p>Carefully selected products worth sharing. Build your own curated storefront.</p>
</div>

<div id="sections"></div>

<button id="wallBtn" onclick="location.href='mywall.html'">
→ My Shop (0)
</button>

<script>
const groups=[
  {heading:"Hot Today 🔥",query:"tiktok viral products 2026"},
  {heading:"Glow Up Essentials ✨",queries:["LED face mask red light therapy","snail mucin serum","collagen sheet mask"]},
  {heading:"Aesthetic Tech 📱",queries:["wireless earbuds noise cancelling","solar power bank","magnetic car mount"]},
  {heading:"Travel Smart ✈️",queries:["anti theft crossbody bag","rfid wallet","hanging toiletry bag"]}
];

function updateCount(){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  document.getElementById("wallBtn").textContent=`→ My Shop (${wall.length})`;
}

function addToWall(product){
  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(wall.some(p=>p.link===product.link)){
    alert("Already added.");
    return;
  }
  wall.push(product);
  localStorage.setItem("productWall",JSON.stringify(wall));
  updateCount();
}

function getPlatform(link){
  if(link.includes("amazon")) return "Amazon";
  if(link.includes("temu")) return "Temu";
  if(link.includes("dhgate")) return "DHgate";
  return "Store";
}

function createCard(item){
  const img=item.pagemap?.cse_image?.[0]?.src;
  if(!img) return null;

  const price=item.pagemap?.metatags?.[0]?.["og:price:amount"]||"";
  const platform=getPlatform(item.link);

  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <img src="${img}">
    <div class="card-body">
      <div class="platform">${platform}</div>
      <div class="title">${item.title}</div>
      ${price?`<div class="price">$${price}</div>`:""}
      <div class="buttons">
        <a href="${item.link}" target="_blank" class="visit">Visit</a>
        <button class="add">Add</button>
      </div>
    </div>
  `;

  card.querySelector(".add").onclick=()=>{
    addToWall({title:item.title,thumb:img,link:item.link});
    const btn=card.querySelector(".add");
    btn.textContent="Added ✓";
    btn.classList.add("added");
    btn.disabled=true;
  };

  return card;
}

async function render(){
  updateCount();
  const container=document.getElementById("sections");

  for(const group of groups){
    const section=document.createElement("div");
    section.className="section";
    section.innerHTML=`<h2>${group.heading}</h2><div class="grid"></div>`;
    container.appendChild(section);

    const grid=section.querySelector(".grid");
    const query=group.query||group.queries[Math.floor(Math.random()*group.queries.length)];

    const res=await fetch(`/api/search?q=${encodeURIComponent(query)}&start=1`);
    const data=await res.json();

    data.items?.slice(0,8).forEach(item=>{
      const card=createCard(item);
      if(card) grid.appendChild(card);
    });
  }
}

window.onload=render;
</script>
</body>
</html>
