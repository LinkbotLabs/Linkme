<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FLOAT | Rising Products</title>

<style>
:root{
  --bg:#111315;
  --card:#1a1d21;
  --text:#f5f5f7;
  --muted:#9ca3af;
  --border:#2a2f36;
  --hover:#1f2328;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

header{
  padding:24px 32px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
}

header h1{
  font-size:22px;
  font-weight:600;
}

header p{
  font-size:14px;
  color:var(--muted);
  margin-top:4px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:50px 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
}

.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--border);
  transition:.3s ease;
  display:flex;
  flex-direction:column;
}

.card:hover{
  transform:translateY(-4px);
  background:var(--hover);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-body{
  padding:18px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card h3{
  font-size:15px;
  font-weight:600;
  margin-bottom:8px;
}

.price{
  font-size:13px;
  color:var(--muted);
  margin-bottom:8px;
}

.hook{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:16px;
}

.card-buttons{
  margin-top:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card-buttons button,
.card-buttons a{
  padding:10px;
  border-radius:12px;
  border:none;
  font-size:13px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.primary{
  background:#ffffff;
  color:#000;
}

.secondary{
  background:#2a2f36;
  color:#fff;
}

.secondary:hover{
  background:#3a3f47;
}
</style>
</head>
<body>

<header>
  <h1>🌊 FLOAT</h1>
  <p>What’s floating right now.</p>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>

async function loadFloat(){

  const grid = document.getElementById("grid");

  try {

    const res = await fetch("/api/float");
    const products = await res.json();

    if(!Array.isArray(products)){
      grid.innerHTML = "<p>Unable to load products.</p>";
      return;
    }

    products.slice(0,24).forEach(product => {

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${product.image || 'https://via.placeholder.com/600'}">
        <div class="card-body">
          <h3>${product.title}</h3>
          <div class="price">${product.price || ""}</div>
          <div class="hook">
            ${product.hook1}<br>
            ${product.hook2}
          </div>
          <div class="card-buttons">
            <a href="${product.link}" target="_blank" class="primary">
              Shop
            </a>
            <button onclick='shareLink(${JSON.stringify(product)})' class="secondary">
              Share Link
            </button>
            <button onclick='createVideo(${JSON.stringify(product)})' class="secondary">
              Create 6s Video
            </button>
          </div>
        </div>
      `;

      grid.appendChild(card);

    });

  } catch (err){
    grid.innerHTML = "<p>Engine temporarily offline.</p>";
  }
}

async function shareLink(product){

  const res = await fetch("/api/share", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(product)
  });

  const data = await res.json();

  if(data.id){
    const url = `${window.location.origin}/p?id=${data.id}`;

    if(navigator.share){
      navigator.share({
        title: product.title,
        text: product.hook1 + " " + product.hook2,
        url: url
      });
    } else {
      await navigator.clipboard.writeText(url);
      alert("Share link copied!");
    }
  }
}

async function createVideo(product){

  const res = await fetch("/api/share", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(product)
  });

  const data = await res.json();

  if(data.id){

    const prompt = `
Create a 6 second vertical product promo video.

Use this product image:
${product.image}

Product:
${product.title}

Hook:
${product.hook1}
${product.hook2}

Style:
Dark floating aesthetic.
Soft dramatic lighting.
Minimal modern typography.
Vertical 9:16 format.
TikTok style pacing.
Do not show price.

End frame text:
Shop Now
`;

    await navigator.clipboard.writeText(prompt);

    window.open("https://grok.com/imagine", "_blank");

    alert("Prompt copied. Paste into Grok Imagine to generate video.");
  }
}

loadFloat();

</script>

</body>
</html>
