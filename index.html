<script>
let products=[],currentIndex=0;

const DEFAULT_AFFILIATE_ID="davidshort-20";
let affiliateId=localStorage.getItem("affiliateId")||"";
let creatorUnlocked=localStorage.getItem("creatorUnlocked")==="true";

/* STATUS */
function updateStatus(){
const el=document.getElementById("affiliateStatus");
if(creatorUnlocked){
el.innerHTML="🟢 Creator Mode Active";
el.style.color="green";
}else{
el.innerHTML="🔒 Free Mode (Float Rising Affiliate)";
el.style.color="#b45309";
}}
updateStatus();
if(creatorUnlocked){
document.getElementById("supportCard").style.display="none";
}

/* UNLOCK */
function openUnlock(){
document.getElementById("unlockModal").style.display="flex";
}
function closeModal(){
document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}
function activateCreator(){
const code=document.getElementById("unlockCodeInput").value.trim();
if(code==="CREATOR19"){
localStorage.setItem("creatorUnlocked","true");
alert("Creator Mode Activated ✅");
location.reload();
}else alert("Invalid Code");
}

/* AFFILIATE */
function saveAffiliate(){
if(!creatorUnlocked){
alert("Please unlock Creator Mode first.");
return;
}
const val=affiliateInput.value.trim();
if(!val.includes("-")){
affiliateError.innerText="Format example: yourname-20";
return;
}
affiliateId=val;
localStorage.setItem("affiliateId",val);
closeModal();
updateStatus();
renderProduct();
}
function appendAffiliate(url){
const activeId=affiliateId||DEFAULT_AFFILIATE_ID;
if(url.includes("tag="))return url;
return url+(url.includes("?")?"&":"?")+"tag="+activeId;
}

/* LOAD PRODUCTS */
async function loadProducts(q=""){
card.innerHTML="Loading...";
const res=await fetch("/api/search"+(q?"?q="+q:""));
const data=await res.json();
products=(data.products||[]).filter(p=>p.link);
currentIndex=0;
renderProduct();
}

function generateHook(title){
return `This ${title.split(" ")[0]} Is Going Viral 🔥`;
}

/* RENDER */
function renderProduct(){
if(!products.length){
card.innerHTML="No products found.";
return;
}
const p=products[currentIndex];

p.rating=(4.6+Math.random()*0.3).toFixed(1);
p.reviews=Math.floor(Math.random()*800+200);
p.sold=Math.floor(Math.random()*1200+300);
p.urgency=Math.floor(Math.random()*10+3);

card.innerHTML=`
${creatorUnlocked?`
<div class="creator-badge">
<div class="mini-wave"></div>
<span>Float Rising</span>
</div>`:``}

<img src="${p.image}">
<div class="product-title">${p.title}</div>
<div class="hook">${generateHook(p.title)}</div>
<div class="stars">⭐ ${p.rating} • ${p.reviews}+ reviews</div>

<div class="rich">
✨ Why You’ll Love It:
<br>✔ ${p.sold}+ sold
<br>✔ Only ${p.urgency} left in stock
<br>✔ Viral trending gadget
</div>

<div class="cta-box">LIMITED STOCK — SHOP NOW</div>

<button class="btn btn-primary" onclick="window.open('${appendAffiliate(p.link)}','_blank')">Shop Now</button>
<button class="btn" onclick="shareLink()">Share Link</button>
<button class="btn" onclick="sharePinterest()">Share to Pinterest</button>
<button class="btn" onclick="shareCard()">Share Full Card</button>
<button class="btn btn-primary" onclick="createGrokVideoPrompt()">🎥 Generate 6s Video Prompt</button>
`;
}

/* SHARE LINK */
async function shareLink(){
if(!products.length)return;
const p=products[currentIndex];

const res=await fetch("/api/share",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...p,link:appendAffiliate(p.link)})
});
const data=await res.json();
const smallLink=window.location.origin+"/s.html?id="+data.id;

if(navigator.share){
navigator.share({title:p.title,text:smallLink});
}else alert("Copy this link:\n"+smallLink);
}

/* SHARE PINTEREST */
async function sharePinterest(){
if(!products.length)return;
const p=products[currentIndex];

const res=await fetch("/api/share",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...p,link:appendAffiliate(p.link)})
});
const data=await res.json();
const smallLink=window.location.origin+"/api/share-page?id="+data.id;

const description=`${p.title} 🔥
⭐ ${p.rating} stars
Trending gadget.
Shop here → ${smallLink}`;

const pinterestUrl=
"https://www.pinterest.com/pin/create/button/?" +
"url="+encodeURIComponent(smallLink) +
"&media="+encodeURIComponent(p.image) +
"&description="+encodeURIComponent(description);

window.open(pinterestUrl,"_blank");
}

/* SHARE CARD */
async function shareCard(){
if(!products.length)return;
const p=products[currentIndex];
const template=document.getElementById("squareTemplate");

template.innerHTML=`
<div style="padding:120px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center;">
<h1 style="font-family:Playfair Display;font-size:70px;">${p.title}</h1>
<img src="${p.image}" style="width:70%;margin:40px auto;border-radius:20px;">
<div style="margin-top:40px;font-size:42px;font-weight:700;">TAP TO SHOP</div>
<div class="watermark">Float Rising</div>
</div>`;

await new Promise(r=>setTimeout(r,400));
const canvas=await html2canvas(template,{useCORS:true,scale:2});
const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));

if(navigator.canShare&&navigator.canShare({files:[new File([blob],"card.png",{type:"image/png"})]})){
await navigator.share({files:[new File([blob],"card.png",{type:"image/png"})],title:p.title});
}else{
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="float-card.png";a.click();
}
}

/* GROK – SIMPLE 6s VIDEO PROMPT */
function createGrokVideoPrompt(){
if(!products.length)return;
const p=products[currentIndex];

grokText.value=`
Create a 6-second vertical 9:16 product video using the uploaded product card image.

Structure:
- Start with the full product card centered.
- Slow cinematic zoom in.
- The product image pops slightly forward in soft 3D depth.
- Add subtle floating shadow.
- Cut to 2–3 quick lifestyle shots showing real use.
- End back on the product card with smooth zoom.

Style:
Clean, modern, premium.
Soft natural lighting.
No text overlays.
No added logos.

Energy:
Pinterest-ready.
Under 6 seconds.
Designed to drive clicks.
`;

document.querySelector("#grokModal h3").innerText="6s Product Video Prompt";
document.getElementById("grokModal").style.display="flex";
}

function copyGrok(){
navigator.clipboard.writeText(grokText.value);
alert("Copied ✅");
}
function openGrok(){
copyGrok();
window.open("https://x.ai/grok","_blank");
}

/* SWIPE */
function nextProduct(){
if(!products.length)return;
currentIndex=(currentIndex+1)%products.length;
renderProduct();
}
function prevProduct(){
if(!products.length)return;
currentIndex=(currentIndex-1+products.length)%products.length;
renderProduct();
}

const cardElement=document.getElementById("card");
let startX=0,endX=0;

cardElement.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});
cardElement.addEventListener("touchend",e=>{
endX=e.changedTouches[0].clientX;
const diff=startX-endX;
if(Math.abs(diff)>60){
if(diff>0)nextProduct();
else prevProduct();
}
});

loadProducts();
</script>
