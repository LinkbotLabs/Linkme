<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquareBox IPTV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0a0f1f;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Background logo */
body::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("squarebox.PNG") center center no-repeat;
  background-size: 60%;
  opacity: 0.08;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: 90%;
  max-width: 900px;
  text-align: center;
}

h1 {
  margin-bottom: 20px;
  color: #4da3ff;
  letter-spacing: 2px;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 6px;
  outline: none;
}

button {
  padding: 12px 20px;
  background: #4da3ff;
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #1f7de0;
}

video {
  width: 100%;
  max-height: 500px;
  background: black;
  border-radius: 10px;
  margin-top: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.note {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>SQUAREBOX IPTV</h1>

  <div class="input-box">
    <input type="text" id="m3uUrl" placeholder="Paste your .m3u8 stream URL here">
    <button onclick="playStream()">PLAY</button>
  </div>

  <video id="video" controls></video>

  <div class="note">
    Supports HLS (.m3u8) streams via HLS.js
  </div>
</div>

<script>
function playStream() {
  const video = document.getElementById('video');
  const url = document.getElementById('m3uUrl').value;

  if (!url) {
    alert("Please enter a stream URL");
    return;
  }

  // If HLS supported
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play();
    });
  }
  // Native support (Safari)
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', function () {
      video.play();
    });
  } else {
    alert("Your browser does not support HLS playback");
  }
}
</script>

</body>
</html>
