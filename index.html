<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:30px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.header{width:100%;max-width:420px;margin-bottom:20px;}
.header h1{
  font-family:'Playfair Display',serif;
  font-size:26px;
  margin-bottom:12px;
}
.header input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-bottom:6px;
}
.small-note{font-size:12px;color:var(--muted);margin-bottom:6px;}
.status{font-size:12px;font-weight:600;margin-bottom:8px;}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
  position:relative;
}
.card-brand{
  position:absolute;
  bottom:18px;
  right:20px;
  font-family:'Playfair Display',serif;
  font-size:14px;
  opacity:0.5;
}
.counter{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;}

.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  margin-bottom:12px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:white;
}
.btn-outline{
  background:white;
  border:1px solid var(--border);
}

.nav{
  display:flex;
  justify-content:space-between;
  width:100%;
  max-width:420px;
  margin-top:20px;
}
.nav button{
  padding:10px 20px;
  border-radius:12px;
  border:1px solid var(--border);
  background:white;
  cursor:pointer;
}

/* Modals */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-content{
  background:white;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
}
.modal textarea{
  width:100%;
  height:180px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-bottom:10px;
  resize:none;
  font-size:13px;
}
.modal input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  margin:12px 0;
}
.error{color:red;font-size:12px;margin-top:6px;}

.share-template{
  position:absolute;
  left:-9999px;
  background:white;
  font-family:'Inter',sans-serif;
}
.branding{
  position:absolute;
  bottom:40px;
  right:40px;
  font-size:24px;
  font-weight:700;
  font-family:'Playfair Display',serif;
  opacity:0.6;
}
.footer-aff{
  position:absolute;
  bottom:40px;
  left:40px;
  font-size:18px;
  opacity:0.7;
}
</style>
</head>
<body>

<div class="header">
<h1>Float Rising Products</h1>

<input id="affiliateInput" placeholder="Enter your Affiliate ID"/>
<div id="affiliateStatus" class="status"></div>

<div id="premiumStatus" class="status"></div>
<div class="small-note">Affiliate required for premium downloads.</div>
</div>

<div class="card" id="card">Loading…</div>

<div class="nav">
<button onclick="prevProduct()">← Prev</button>
<button onclick="nextProduct()">Next →</button>
</div>

<!-- Premium Modal -->
<div class="modal" id="premiumModal">
<div class="modal-content">
<h3>Unlock Premium</h3>
<input type="password" id="premiumPassword" placeholder="Enter password"/>
<button class="btn btn-primary" onclick="validatePassword()">Unlock</button>
<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
<div id="passwordError" class="error"></div>
</div>
</div>

<!-- Format Modal -->
<div class="modal" id="formatModal">
<div class="modal-content">
<h3>Choose Format</h3>
<button class="btn btn-primary" onclick="generateImage('square')">Instagram 1:1</button>
<button class="btn btn-primary" onclick="generateImage('vertical')">TikTok 9:16</button>
<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
</div>
</div>

<!-- Grok Modal -->
<div class="modal" id="grokModal">
<div class="modal-content">
<h3>6-Second Video Script</h3>
<textarea id="grokText"></textarea>
<button class="btn btn-outline" onclick="copyGrok()">Copy</button>
<button class="btn btn-primary" onclick="openGrok()">Copy & Open Grok</button>
<button class="btn btn-outline" onclick="closeModal()">Close</button>
</div>
</div>

<!-- Share Templates -->
<div id="squareTemplate" class="share-template" style="width:1080px;height:1080px;">
<div id="squareContent"></div>
<div class="branding">Float Rising</div>
<div class="footer-aff" id="squareAff"></div>
</div>

<div id="verticalTemplate" class="share-template" style="width:1080px;height:1920px;">
<div id="verticalContent"></div>
<div class="branding">Float Rising</div>
<div class="footer-aff" id="verticalAff"></div>
</div>

<script>
let products=[],currentIndex=0;
let affiliateId=localStorage.getItem("affiliateId")||"";

function isPremium(){return localStorage.getItem("premiumUser")==="true";}

/* Affiliate */
const affiliateInput=document.getElementById("affiliateInput");
affiliateInput.value=affiliateId;
affiliateInput.addEventListener("input",()=>{
affiliateId=affiliateInput.value.trim();
localStorage.setItem("affiliateId",affiliateId);
updateAffiliateStatus();
});

function updateAffiliateStatus(){
const el=document.getElementById("affiliateStatus");
if(affiliateId){
el.innerHTML="✅ Affiliate Saved: "+affiliateId;
el.style.color="#2e7d32";
}else{
el.innerHTML="⚠ Affiliate required for premium.";
el.style.color="#b45309";
}
}
function updatePremiumStatus(){
const el=document.getElementById("premiumStatus");
if(isPremium()){
el.innerHTML="💎 Premium Active";
el.style.color="#2e7d32";
}else{
el.innerHTML="🔒 Premium Locked";
el.style.color="#6b7280";
}
}
updateAffiliateStatus();
updatePremiumStatus();

/* Hooks */
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function hook1(){return rand(["This Is Going Everywhere","TikTok Can't Stop Talking","Nobody Expected This"])}
function hook2(){return rand(["And The Price Is Wild","It Actually Lives Up To The Hype","It Feels Premium"])}
function why(){return rand(["Clean design. Zero gimmicks.","High ratings and repeat buyers.","Simple. Smart. Useful."])}

function appendAffiliate(url){
if(!affiliateId)return url;
return url+(url.includes("?")?"&":"?")+"affid="+affiliateId;
}

/* Load */
async function loadProducts(){
const res=await fetch(`/api/search`);
const data=await res.json();
products=data.products||[];
renderProduct();
}
function renderProduct(){
const p=products[currentIndex];
if(!p)return;

const rating=(4.5+Math.random()*0.4).toFixed(1);
const views=Math.floor(Math.random()*50+10)+"K";

document.getElementById("card").innerHTML=`
<div class="counter">${currentIndex+1} / ${products.length}</div>

<div style="font-family:Playfair Display,serif;font-size:22px;text-align:center;margin-bottom:14px;">
${hook1()}<br>
<span style="color:#6b7280;font-weight:500;">${hook2()}</span>
</div>

<img src="${p.image}" style="width:100%;border-radius:18px;margin-bottom:14px;"/>

<div style="text-align:center;font-size:13px;color:#6b7280;margin-bottom:8px;">
⭐ ${rating} • 👁 ${views}
</div>

<div style="font-size:28px;font-weight:700;margin-bottom:10px;text-align:center;">
${p.price||"$29.99"}
</div>

<div style="color:#6b7280;font-size:14px;margin-bottom:18px;text-align:center;">
${why()}
</div>

<div style="font-size:11px;color:#6b7280;text-align:center;margin-bottom:10px;">
${appendAffiliate(p.link)}
</div>

<button class="btn btn-primary" onclick="window.open('${appendAffiliate(p.link)}','_blank')">🛒 Shop Now</button>
<button class="btn btn-outline" onclick="shareProduct()">🔗 Share</button>
<button class="btn btn-outline" onclick="createGrokVideo()">🎬 Create 6s Video</button>

<div class="card-brand">Float Rising</div>
`;
}


/* Navigation */
function nextProduct(){currentIndex=(currentIndex+1)%products.length;renderProduct();}
function prevProduct(){currentIndex=(currentIndex-1+products.length)%products.length;renderProduct();}

/* Share */
function shareProduct(){
if(!isPremium()){
document.getElementById("premiumModal").style.display="flex";
return;
}
document.getElementById("formatModal").style.display="flex";
}

function validatePassword(){
if(document.getElementById("premiumPassword").value==="Floaton"){
localStorage.setItem("premiumUser","true");
updatePremiumStatus();
closeModal();
document.getElementById("formatModal").style.display="flex";
}else{
document.getElementById("passwordError").innerText="Incorrect password";
}
}

async function generateImage(type){
closeModal();
if(!affiliateId){alert("Enter Affiliate ID first.");return;}

const p=products[currentIndex];
const template=type==="square"?squareTemplate:verticalTemplate;
const content=type==="square"?squareContent:verticalContent;
const aff=type==="square"?squareAff:verticalAff;

aff.innerText="affid="+affiliateId;

content.innerHTML=`
<div style="padding:100px;text-align:center;">
<img src="${p.image}" style="width:70%;border-radius:30px;margin-bottom:40px;"/>
<h1 style="font-family:Playfair Display,serif;font-size:64px;margin-bottom:20px;">
${hook1()}
</h1>
<h2 style="font-size:48px;color:#444;margin-bottom:30px;">
${p.price||"$29.99"}
</h2>
<p style="font-size:32px;color:#666;">${why()}</p>
</div>`;

await new Promise(r=>setTimeout(r,300));
const canvas=await html2canvas(template,{useCORS:true});
const link=document.createElement("a");
link.download="float-rising-share.png";
link.href=canvas.toDataURL();
link.click();
}

/* Grok */
function createGrokVideo(){
const p=products[currentIndex];
const prompt=`Create a cinematic 6 second vertical product video.

Product: ${p.title}
Hook: ${hook1()} ${hook2()}
Why: ${why()}

Fast TikTok pacing.
Modern aesthetic.
Text overlay hook.
End with: Shop Now.`;

grokText.value=prompt;
grokModal.style.display="flex";
}
function copyGrok(){navigator.clipboard.writeText(grokText.value);}
function openGrok(){
navigator.clipboard.writeText(grokText.value).then(()=>{
window.open("https://grok.com/?prompt="+encodeURIComponent(grokText.value),"_blank");
});
}

function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none");}

loadProducts();
</script>
</body>
</html>
