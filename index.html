<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Float Rising</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f4f4f2;
  --card:#f9f9f7;
  --muted:#6b7280;
  --accent:#1f2937;
  --border:#e5e7eb;
  --gold:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#111;
}
.brand{text-align:center;margin-bottom:30px;}
.wave{width:120px;height:20px;margin:0 auto 10px;border-top:2px solid #111;border-radius:100% 100% 0 0;}
.brand h1{font-family:'Playfair Display';font-size:32px;letter-spacing:1.5px;}

.header{width:100%;max-width:420px;margin-bottom:24px;}
.header input,.header button{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
  margin-bottom:8px;font-size:15px;
}
.header button{background:#111;color:white;border:none;font-weight:600;cursor:pointer;}

.status{text-align:center;font-size:13px;margin:6px 0;}
.small-note{text-align:center;font-size:12px;color:var(--muted);}

.card{
  width:100%;max-width:420px;background:var(--card);
  border-radius:24px;padding:28px 24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  margin-bottom:24px;
}
.card img{
  width:100%;border-radius:16px;margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.product-title{
  font-family:'Playfair Display';
  font-size:24px;text-align:center;margin-bottom:12px;
}
.hook{text-align:center;color:var(--muted);margin-bottom:16px;}
.price{text-align:center;font-size:30px;font-weight:700;margin:14px 0;}
.btn{
  width:100%;padding:14px;border-radius:14px;
  border:1px solid var(--border);
  background:white;margin-bottom:10px;font-weight:600;cursor:pointer;
}
.btn-primary{background:#111;color:white;border:none;}

.nav{display:flex;justify-content:space-between;width:100%;max-width:420px;}
.nav button{padding:12px 24px;border-radius:12px;border:1px solid var(--border);background:white;cursor:pointer;}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;
}
.modal-content{
  background:white;padding:28px;border-radius:20px;
  width:90%;max-width:420px;text-align:center;
}
.modal textarea{width:100%;height:160px;margin:12px 0;padding:12px;border-radius:12px;border:1px solid var(--border);}
.error{color:red;font-size:13px;margin-top:6px;}

.share-template{
  position:absolute;left:-9999px;background:white;
}
.watermark{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:18px;color:#9ca3af;opacity:.7;
}
</style>
</head>
<body>

<div class="brand">
  <div class="wave"></div>
  <h1>Float Rising</h1>
</div>

<div class="header">
  <button onclick="openAffiliate()">Set Your Affiliate ID</button>
  <div id="affiliateStatus" class="status"></div>
  <div id="premiumStatus" class="status"></div>
  <input id="searchInput" placeholder="Search trending gadgets..."/>
  <div class="small-note">Premium required for magazine downloads.</div>
</div>

<div class="card" id="card">Loading...</div>

<div class="nav">
  <button onclick="prevProduct()">← Prev</button>
  <button onclick="nextProduct()">Next →</button>
</div>

<!-- Modals -->
<div class="modal" id="affiliateModal">
<div class="modal-content">
<h3>Amazon Affiliate ID</h3>
<input id="affiliateInput" placeholder="yourname-20"/>
<div id="affiliateError" class="error"></div>
<button class="btn btn-primary" onclick="saveAffiliate()">Save</button>
<button class="btn" onclick="closeModal()">Cancel</button>
</div>
</div>

<div class="modal" id="premiumModal">
<div class="modal-content">
<h3>Unlock Premium</h3>
<input type="password" id="premiumPassword"/>
<div id="passwordError" class="error"></div>
<button class="btn btn-primary" onclick="validatePassword()">Unlock</button>
<button class="btn" onclick="closeModal()">Cancel</button>
</div>
</div>

<div class="modal" id="formatModal">
<div class="modal-content">
<h3>Choose Format</h3>
<button class="btn btn-primary" onclick="generateImage('square')">Square</button>
<button class="btn btn-primary" onclick="generateImage('vertical')">Vertical</button>
<button class="btn" onclick="closeModal()">Cancel</button>
</div>
</div>

<div class="modal" id="grokModal">
<div class="modal-content">
<h3>Adaptive 6s Video Script</h3>
<textarea id="grokText"></textarea>
<button class="btn" onclick="copyGrok()">Copy</button>
<button class="btn btn-primary" onclick="openGrok()">Copy & Open Grok</button>
<button class="btn" onclick="closeModal()">Close</button>
</div>
</div>

<div id="squareTemplate" class="share-template" style="width:1080px;height:1080px;"></div>
<div id="verticalTemplate" class="share-template" style="width:1080px;height:1920px;"></div>

<script>
let products=[],currentIndex=0;
let affiliateId=localStorage.getItem("affiliateId")||"";
let isPremiumUser=localStorage.getItem("premiumUser")==="true";

function updateStatus(){
affiliateStatus.innerHTML=affiliateId?"Affiliate: "+affiliateId:"Affiliate Required";
affiliateStatus.style.color=affiliateId?"green":"#b45309";
premiumStatus.innerHTML=isPremiumUser?"Premium Active ✓":"Premium Locked";
}
updateStatus();

function openAffiliate(){affiliateModal.style.display="flex";}
function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none");}

function saveAffiliate(){
const val=affiliateInput.value.trim();
if(!val.includes("-")){affiliateError.innerText="Format example: yourname-20";return;}
affiliateId=val;
localStorage.setItem("affiliateId",val);
closeModal();updateStatus();renderProduct();
}

function validatePassword(){
if(premiumPassword.value==="Floaton"){
localStorage.setItem("premiumUser","true");
isPremiumUser=true;closeModal();updateStatus();
formatModal.style.display="flex";
}else{passwordError.innerText="Incorrect password";}
}

function appendAffiliate(url){
if(!affiliateId)return url;
return url+(url.includes("?")?"&":"?")+"tag="+affiliateId;
}

async function loadProducts(q=""){
card.innerHTML="Loading...";
const res=await fetch("/api/search"+(q?"?q="+q:""));
const data=await res.json();
products=(data.products||[]).filter(p=>p.link);
currentIndex=0;renderProduct();
}

function renderProduct(){
if(!products.length){card.innerHTML="No products found.";return;}
const p=products[currentIndex];
p.rating=(4.6+Math.random()*0.3).toFixed(1);
p.reviews=Math.floor(Math.random()*800+200);
p.sold=Math.floor(Math.random()*1200+300);
p.urgency=Math.floor(Math.random()*10+3);

card.innerHTML=`
<img src="${p.image}">
<div class="product-title">${p.title}</div>
<div class="hook">Curated Luxury Pick</div>
<div style="text-align:center;font-size:14px;margin:10px 0;">
⭐ ${p.rating} • ${p.reviews}+ reviews
</div>
<div style="text-align:center;font-size:14px;color:#6b7280;">
${p.sold}+ sold • Only ${p.urgency} left
</div>
<div class="price">${p.price||"$39.99"}</div>
<button class="btn btn-primary" onclick="window.open('${appendAffiliate(p.link)}','_blank')">Shop Now</button>
<button class="btn" onclick="shareProduct()">${isPremiumUser?"Download Magazine":"Unlock Premium"}</button>
<button class="btn" onclick="createGrokVideo()">Create 6s AI Video</button>
`;
}

function nextProduct(){currentIndex=(currentIndex+1)%products.length;renderProduct();}
function prevProduct(){currentIndex=(currentIndex-1+products.length)%products.length;renderProduct();}

function shareProduct(){
if(!affiliateId){alert("Affiliate ID required.");return;}
if(!isPremiumUser){premiumModal.style.display="flex";return;}
formatModal.style.display="flex";
}

async function generateImage(type){
closeModal();
const p=products[currentIndex];
const template=type==="square"?squareTemplate:verticalTemplate;

template.innerHTML=`
<div style="padding:120px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center;">
<h1 style="font-family:Playfair Display;font-size:80px;">${p.title}</h1>
<img src="${p.image}" style="width:70%;margin:40px auto;border-radius:20px;">
<div style="font-size:60px;font-weight:700;">${p.price}</div>
<div style="margin-top:20px;">Shop → ${appendAffiliate(p.link)}</div>
<div class="watermark">Float Rising</div>
</div>`;

await new Promise(r=>setTimeout(r,400));
const canvas = await html2canvas(template, {
  useCORS: true,
  scale: 2
});

const blob = await new Promise(resolve =>
  canvas.toBlob(resolve, "image/png")
);

const file = new File(
  [blob],
  `float-rising-${type}.png`,
  { type: "image/png" }
);

const shareData = {
  files: [file],
  title: "Float Rising Pick",
  text: `Luxury find from Float Rising ✨\n\nShop here:\n${appendAffiliate(p.link)}`
};

// HYBRID FLOW
if (navigator.canShare && navigator.canShare({ files: [file] })) {
  await navigator.share(shareData);
} else {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  a.click();
}
}

function detectCategory(title=""){
title=title.toLowerCase();
if(title.includes("light")||title.includes("lamp"))return"home";
if(title.includes("fitness")||title.includes("gym"))return"fitness";
if(title.includes("beauty")||title.includes("skin"))return"beauty";
return"general";
}

function createGrokVideo(){
if(!affiliateId){alert("Affiliate ID required.");return;}
const p=products[currentIndex];
const category=detectCategory(p.title);
const link=appendAffiliate(p.link);

let angle="";
if(category==="fitness"){
angle="Focus on transformation and energy. Show before/after motion.";
}else if(category==="beauty"){
angle="Focus on glow, close-up skin shots, soft lighting.";
}else if(category==="home"){
angle="Show aesthetic room upgrade transformation.";
}else{
angle="Highlight problem → solution quickly.";
}

const prompt=`
Create a HIGH-CONVERTING 6-second vertical TikTok ad.

Product: ${p.title}
Price: ${p.price}
Rating: ${p.rating} (${p.reviews}+ reviews)
${angle}

STRUCTURE:
0-1s: Bold hook text.
1-3s: Show product in action.
3-5s: Close-up detail.
5-6s: CTA screen "SHOP NOW"

Final screen URL:
${link}

Style: premium, fast-paced, viral, mobile-optimized.
`;

grokText.value=prompt;
grokModal.style.display="flex";
}

function copyGrok(){navigator.clipboard.writeText(grokText.value);}
function openGrok(){copyGrok();window.open("https://grok.x.ai/","_blank");}

searchInput.addEventListener("keypress",e=>{if(e.key==="Enter")loadProducts(searchInput.value);});

if(!affiliateId)affiliateModal.style.display="flex";
loadProducts();
</script>
</body>
</html>
