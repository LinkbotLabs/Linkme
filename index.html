<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Float Rising</title>
<meta name="google-site-verification" content="ohpzxX7bmF1anP3RvE5v_2bzhepA0UJaCJ0jLzlJBNQ" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f4f4f2;
  --card:#f9f9f7;
  --muted:#6b7280;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#111;
}
.brand{text-align:center;margin-bottom:30px;}
.wave{width:120px;height:20px;margin:0 auto 10px;border-top:2px solid #111;border-radius:100% 100% 0 0;}
.brand h1{font-family:'Playfair Display';font-size:32px;letter-spacing:1.5px;}

.header{width:100%;max-width:420px;margin-bottom:24px;}
.header input,.header button{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
  margin-bottom:8px;font-size:15px;
}
.header button{background:#111;color:white;border:none;font-weight:600;cursor:pointer;}

.status{text-align:center;font-size:13px;margin:6px 0;}

.card{
  width:100%;max-width:420px;background:var(--card);
  border-radius:24px;padding:28px 24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  margin-bottom:24px;
}
.card img{
  width:100%;border-radius:16px;margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.product-title{
  font-family:'Playfair Display';
  font-size:22px;text-align:center;margin-bottom:12px;
}
.hook{text-align:center;color:var(--muted);margin-bottom:16px;}
.rich{font-size:14px;line-height:1.6;margin:12px 0;}
.stars{text-align:center;font-size:14px;margin:10px 0;}
.cta-box{
  background:#111;color:white;
  padding:14px;border-radius:14px;
  text-align:center;margin:16px 0;
  font-weight:600;
}
.btn{
  width:100%;padding:14px;border-radius:14px;
  border:1px solid var(--border);
  background:white;margin-bottom:10px;font-weight:600;cursor:pointer;
}
.btn-primary{background:#111;color:white;border:none;}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;
}
.modal-content{
  background:white;padding:28px;border-radius:20px;
  width:90%;max-width:420px;text-align:center;
}
.modal textarea{
  width:100%;height:180px;margin:12px 0;padding:12px;
  border-radius:12px;border:1px solid var(--border);
}
.error{color:red;font-size:13px;margin-top:6px;}

.share-template{position:absolute;left:-9999px;background:white;}
.watermark{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:18px;color:#9ca3af;opacity:.7;
}
</style>
</head>
<body>

<div class="brand">
  <div class="wave"></div>
  <h1>Float Rising</h1>
</div>

<div class="header">
  <button onclick="openAffiliate()">Set Your Affiliate ID</button>
  <div id="affiliateStatus" class="status"></div>
  <input id="searchInput" placeholder="Search trending gadgets..."/>
</div>

<div class="card" id="card">Loading...</div>

<!-- Affiliate Modal -->
<div class="modal" id="affiliateModal">
<div class="modal-content">
<h3>Amazon Affiliate ID</h3>
<input id="affiliateInput" placeholder="yourname-20"/>
<div id="affiliateError" class="error"></div>
<button class="btn btn-primary" onclick="saveAffiliate()">Save</button>
</div>
</div>

<!-- Grok Modal -->
<div class="modal" id="grokModal">
<div class="modal-content">
<h3>6s Viral Video Script</h3>
<textarea id="grokText"></textarea>
<button class="btn" onclick="copyGrok()">Copy</button>
<button class="btn btn-primary" onclick="openGrok()">Copy & Open Grok</button>
<button class="btn" onclick="closeModal()">Close</button>
</div>
</div>

<div id="squareTemplate" class="share-template" style="width:1080px;height:1080px;"></div>

<script>
let products=[],currentIndex=0;
let affiliateId=localStorage.getItem("affiliateId")||"";

/* STATUS */
function updateStatus(){
affiliateStatus.innerHTML=affiliateId?"Affiliate: "+affiliateId:"Affiliate Required";
affiliateStatus.style.color=affiliateId?"green":"#b45309";
}
updateStatus();

/* AFFILIATE */
function openAffiliate(){affiliateModal.style.display="flex";}
function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none");}

function saveAffiliate(){
const val=affiliateInput.value.trim();
if(!val.includes("-")){affiliateError.innerText="Format example: yourname-20";return;}
affiliateId=val;
localStorage.setItem("affiliateId",val);
closeModal();updateStatus();renderProduct();
}

function appendAffiliate(url){
if(!affiliateId)return url;
if(url.includes("tag="+affiliateId))return url;
return url+(url.includes("?")?"&":"?")+"tag="+affiliateId;
}

/* LOAD PRODUCTS */
async function loadProducts(q=""){
card.innerHTML="Loading...";
const res=await fetch("/api/search"+(q?"?q="+q:""));
const data=await res.json();
products=(data.products||[]).filter(p=>p.link);
currentIndex=0;
renderProduct();
}

function generateHook(title){
return `This ${title.split(" ")[0]} Is Going Viral 🔥`;
}

/* RENDER */
function renderProduct(){
if(!products.length){card.innerHTML="No products found.";return;}
const p=products[currentIndex];

p.rating=(4.6+Math.random()*0.3).toFixed(1);
p.reviews=Math.floor(Math.random()*800+200);
p.sold=Math.floor(Math.random()*1200+300);
p.urgency=Math.floor(Math.random()*10+3);

card.innerHTML=`
<img src="${p.image}">
<div class="product-title">${p.title}</div>
<div class="hook">${generateHook(p.title)}</div>
<div class="stars">⭐ ${p.rating} • ${p.reviews}+ reviews</div>

<div class="rich">
✨ Why You’ll Love It:
<br>✔ ${p.sold}+ sold
<br>✔ Only ${p.urgency} left in stock
<br>✔ Viral trending gadget
</div>

<div class="cta-box">LIMITED STOCK — SHOP NOW</div>

<button class="btn btn-primary" onclick="window.open('${appendAffiliate(p.link)}','_blank')">Shop Now</button>
<button class="btn" onclick="shareLink()">Share Link</button>
<button class="btn" onclick="sharePinterest()">Share to Pinterest</button>
<button class="btn" onclick="shareCard()">Share Full Card</button>
<button class="btn" onclick="createGrokHook()">🎥 Generate Hook</button>
<button class="btn btn-primary" onclick="createGrokSolution()">✨ Generate Solution</button>
`;
}
/* SHARE LINK */
async function shareLink(){
if(!affiliateId){alert("Affiliate ID required.");return;}
if(!products.length)return;

const p=products[currentIndex];

const res=await fetch("/api/share",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...p,link:appendAffiliate(p.link)})
});
const data=await res.json();
const smallLink=window.location.origin+"/s.html?id="+data.id;

if(navigator.share){
navigator.share({title:p.title,text:smallLink});
}else{
alert("Copy this link:\n"+smallLink);
}
}

/* SHARE PINTEREST */
async function sharePinterest(){
if(!affiliateId){alert("Affiliate ID required.");return;}
if(!products.length)return;

const p=products[currentIndex];

const res=await fetch("/api/share",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...p,link:appendAffiliate(p.link)})
});
const data=await res.json();
const smallLink=window.location.origin+"/s.html?id="+data.id;

const description=`${p.title} 🔥
⭐ ${p.rating} stars
Trending gadget.
Shop here → ${smallLink}`;

const pinterestUrl=
"https://www.pinterest.com/pin/create/button/?" +
"url="+encodeURIComponent(smallLink) +
"&media="+encodeURIComponent(p.image) +
"&description="+encodeURIComponent(description);

window.open(pinterestUrl,"_blank");
}

/* SHARE CARD */
async function shareCard(){
if(!affiliateId){alert("Affiliate ID required.");return;}
if(!products.length)return;

const p=products[currentIndex];
const template=document.getElementById("squareTemplate");

template.innerHTML=`
<div style="padding:120px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center;">
<h1 style="font-family:Playfair Display;font-size:70px;">${p.title}</h1>
<img src="${p.image}" style="width:70%;margin:40px auto;border-radius:20px;">
<div style="margin-top:40px;font-size:42px;font-weight:700;">TAP TO SHOP</div>
<div class="watermark">Float Rising</div>
</div>`;

await new Promise(r=>setTimeout(r,400));
const canvas=await html2canvas(template,{useCORS:true,scale:2});
const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));

if(navigator.canShare && navigator.canShare({files:[new File([blob],"card.png",{type:"image/png"})]})){
await navigator.share({files:[new File([blob],"card.png",{type:"image/png"})],title:p.title});
}else{
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="float-card.png";a.click();
}
}

/* ===============================
   GROK – SMART VIDEO ENGINE (FIXED)
   =============================== */


/* ===============================
   SMART PRODUCT INTELLIGENCE
   =============================== */

function buildMasterPrompt(p){
  const title = (p.title || "").toLowerCase();

  let categoryHint = "a better way to handle everyday tasks";
  let outcome = "a smoother, more enjoyable routine";

  const rules = [
    {
      keywords:["glasses","blue light","screen","monitor"],
      categoryHint:"a better way to handle long screen time",
      outcome:"clearer, more comfortable vision"
    },
    {
      keywords:["vacuum","mop","clean","floor"],
      categoryHint:"a better way to clean your space",
      outcome:"faster, easier cleaning"
    },
    {
      keywords:["camera","instax","polaroid","photo"],
      categoryHint:"a better way to capture moments",
      outcome:"memories you can actually hold"
    },
    {
      keywords:["posture","back","chair","lumbar"],
      categoryHint:"a better way to sit and work",
      outcome:"more natural posture and comfort"
    },
    {
      keywords:["skin","face","beauty","serum"],
      categoryHint:"a better way to care for your skin",
      outcome:"a naturally refreshed look"
    },
    {
      keywords:["kitchen","cook","knife","food"],
      categoryHint:"a better way to prep meals",
      outcome:"faster, smoother cooking"
    }
  ];

  rules.forEach(rule=>{
    if(rule.keywords.some(k=>title.includes(k))){
      categoryHint = rule.categoryHint;
      outcome = rule.outcome;
    }
  });

  return {
    name: p.title,
    categoryHint,
    outcome
  };
}


/* ===============================
   HOOK TEMPLATES (FUNCTION BASED)
   =============================== */

const hookTemplates = [
  m => `I didn’t think I needed ${m.categoryHint}… but now I use it every day.`,
  m => `I wasn’t looking for ${m.categoryHint}… and now it’s part of my routine.`,
  m => `I almost skipped ${m.categoryHint}… now I wouldn’t.`,
  m => `I didn’t expect much from ${m.categoryHint}… but it made a difference.`,
  m => `I didn’t plan on upgrading to ${m.categoryHint}… now I’m glad I did.`,
  m => `It turns out ${m.categoryHint} changes more than you think.`,
  m => `I didn’t realize ${m.categoryHint} could feel this simple.`,
  m => `Sometimes ${m.categoryHint} is all it takes.`,
  m => `I didn’t think about ${m.categoryHint}… until I tried it.`,
  m => `I didn’t know I needed ${m.categoryHint}… but now I reach for it daily.`
];


/* ===============================
   SOLUTION TEMPLATES (FUNCTION BASED)
   =============================== */

const solutionTemplates = [
  m => `Meet the ${m.name}. Designed for ${m.outcome}.`,
  m => `${m.name}. Built for ${m.outcome}.`,
  m => `${m.name}. A smarter way to experience ${m.categoryHint.replace("a better way to ","")}.`,
  m => `${m.name}. Simple. Practical. Effective.`,
  m => `Now I use the ${m.name}. And it shows.`,
  m => `${m.name}. One small upgrade — real impact.`,
  m => `${m.name}. It just fits into the routine.`,
  m => `${m.name}. Less effort. Better results.`,
  m => `${m.name}. Thoughtfully made for ${m.outcome}.`,
  m => `It’s the ${m.name}. And honestly, it just works.`
];


/* ===============================
   VIDEO STYLE ROTATION
   =============================== */

const videoStyles = [
`Natural documentary-style footage.
Real home environment.
Soft window light.
Slight handheld movement.`,

`Slow living aesthetic.
Morning routine setting.
Warm sunlight.
Intentional slow movements.`,

`Bright minimal modern home.
Airy daylight.
Clean composition.`,

`Casual vertical social style.
Authentic and natural lighting.`,

`Golden hour warmth.
Soft shadows.
Relaxed atmosphere.`,

`First-person POV routine moment.
Quiet ambient sound.`,

`Cozy domestic setting.
Muted earthy tones.`,

`Clean kitchen or workspace scene.
Natural side lighting.`,

`Close-up detail shots.
Hands interacting naturally.`,

`Everyday unpolished home moment.
Natural light only.`
];


/* ===============================
   HOOK GENERATOR
   =============================== */

function createGrokHook(){
  if(!affiliateId){ alert("Affiliate ID required."); return; }
  if(!products.length) return;

  const p = products[currentIndex];
  const m = buildMasterPrompt(p);

  const style = videoStyles[Math.floor(Math.random()*videoStyles.length)];
  const template = hookTemplates[Math.floor(Math.random()*hookTemplates.length)];
  const hook = template(m);

  grokText.value = `
Create a 6-second vertical lifestyle video.

${style}

Do not clearly show the product yet.
Focus on natural routine moments.

Voiceover:
Softly speaking American narrator.
Warm, calm, relaxed pacing.

${hook}

No text on screen.
Under 6 seconds.
`;

  grokModal.style.display = "flex";
}


/* ===============================
   SOLUTION GENERATOR
   =============================== */

function createGrokSolution(){
  if(!affiliateId){ alert("Affiliate ID required."); return; }
  if(!products.length) return;

  const p = products[currentIndex];
  const m = buildMasterPrompt(p);

  const style = videoStyles[Math.floor(Math.random()*videoStyles.length)];
  const template = solutionTemplates[Math.floor(Math.random()*solutionTemplates.length)];
  const solution = template(m);

  grokText.value = `
Create a 6-second vertical lifestyle product reveal.

${style}

Show the product naturally in use.

Voiceover:
Softly speaking American narrator.
Calm and confident tone.

${solution}

No text on screen.
Under 6 seconds.
`;

  grokModal.style.display = "flex";
}



/* ===============================
   COPY + OPEN GROK
   =============================== */

function copyGrok(){
  navigator.clipboard.writeText(grokText.value);
  alert("Copied ✅");
}

function openGrok(){
  copyGrok();
  window.open("https://x.ai/grok","_blank");
}

searchInput.addEventListener("keypress",e=>{
if(e.key==="Enter")loadProducts(searchInput.value);
});
  function nextProduct(){
  if(!products.length) return;
  currentIndex = (currentIndex + 1) % products.length;
  renderProduct();
}

function prevProduct(){
  if(!products.length) return;
  currentIndex = (currentIndex - 1 + products.length) % products.length;
  renderProduct();
}
/* SWIPE SUPPORT */
const cardElement = document.getElementById("card");

let startX = 0;
let endX = 0;

cardElement.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
});

cardElement.addEventListener("touchend", (e) => {
  endX = e.changedTouches[0].clientX;

  const diff = startX - endX;

  if (Math.abs(diff) > 60) {
    if (diff > 0) {
      nextProduct(); // swipe left
    } else {
      prevProduct(); // swipe right
    }
  }
});
loadProducts();
</script>

</body>
</html>
