<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkme – Discover Viral Finds</title>

<style>
:root{
  --bg:#fafafa;
  --card:#ffffff;
  --text:#111;
  --muted:#6e6e73;
  --border:#ececec;
  --accent:#000;
  --success:#34c759;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:100px 20px 70px;
  background:linear-gradient(to bottom,#ffffff,#f5f5f7);
}

.hero h1{
  font-size:3.2rem;
  font-weight:800;
  letter-spacing:-1px;
  margin-bottom:20px;
}

.hero p{
  color:var(--muted);
  font-size:1.2rem;
  max-width:650px;
  margin:auto;
  margin-bottom:35px;
}

.hero-cta{
  display:inline-block;
  padding:14px 28px;
  background:black;
  color:white;
  border-radius:12px;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}
.hero-cta:hover{
  transform:translateY(-3px);
}

/* ================= SECTIONS ================= */

.section{
  max-width:1300px;
  margin:80px auto;
  padding:0 30px;
}

.section h2{
  font-size:1.9rem;
  margin-bottom:8px;
  letter-spacing:-0.4px;
}

.section-sub{
  color:var(--muted);
  margin-bottom:35px;
}

/* ================= GRID ================= */

.grid{
  display:grid;
  gap:30px;
}

@media (min-width:0px){ .grid{grid-template-columns:1fr;} }
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (min-width:1024px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:1400px){ .grid{grid-template-columns:repeat(4,1fr);} }

/* ================= CARD ================= */

.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.04);
  transition:.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 18px 45px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.card-body{
  padding:20px;
}

.badge{
  position:absolute;
  top:14px;
  left:14px;
  background:black;
  color:white;
  font-size:.7rem;
  font-weight:700;
  padding:6px 10px;
  border-radius:10px;
}

.platform{
  display:inline-block;
  font-size:.75rem;
  background:#f3f3f3;
  padding:6px 10px;
  border-radius:8px;
  margin-bottom:10px;
}

.title{
  font-weight:700;
  font-size:1rem;
  margin-bottom:10px;
  line-height:1.4;
}

.price{
  font-weight:800;
  margin-bottom:16px;
}

.buttons{
  display:flex;
  gap:10px;
}

.visit{
  flex:1;
  text-align:center;
  padding:11px;
  border-radius:10px;
  background:#f2f2f2;
  text-decoration:none;
  color:#000;
  font-weight:600;
}

.add{
  flex:1;
  padding:11px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.added{
  background:var(--success)!important;
}

/* ================= FLOAT BUTTON ================= */

#wallBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:black;
  color:white;
  padding:16px 28px;
  border-radius:50px;
  font-weight:700;
  border:none;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="hero">
  <h1>Discover Viral Internet Finds</h1>
  <p>Curated Amazon, Temu & DHgate products updated daily. No clutter. Just what’s trending.</p>
  <a href="#sections" class="hero-cta">Explore Today’s Drops</a>
</div>

<div id="sections"></div>

<button id="wallBtn" onclick="location.href='mywall.html'">
→ My Curated Shop (0)
</button>

<script>

const groups=[
  {heading:"Hot Today 🔥",sub:"What’s blowing up right now.",query:"tiktok viral products 2026",hot:true},
  {heading:"Glow Up Essentials ✨",sub:"Self-care products people swear by.",queries:["LED face mask red light therapy","snail mucin serum","collagen sheet mask"]},
  {heading:"Aesthetic Tech 📱",sub:"Tech that looks good and works better.",queries:["wireless earbuds noise cancelling","solar power bank","magnetic car mount"]},
  {heading:"Travel Smart ✈️",sub:"Essentials that make travel effortless.",queries:["anti theft crossbody bag","rfid wallet","hanging toiletry bag"]}
];

function updateCount(){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  document.getElementById("wallBtn").textContent=`→ My Curated Shop (${wall.length})`;
}

function addToWall(product){
  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(wall.some(p=>p.link===product.link)){
    alert("Already added.");
    return;
  }
  wall.push(product);
  localStorage.setItem("productWall",JSON.stringify(wall));
  updateCount();
}

function getPlatform(link){
  if(link.includes("amazon")) return "Amazon";
  if(link.includes("temu")) return "Temu";
  if(link.includes("dhgate")) return "DHgate";
  return "Store";
}

function createCard(item,hot=false,index=0){
  const img=item.pagemap?.cse_image?.[0]?.src;
  if(!img) return null;

  const price=item.pagemap?.metatags?.[0]?.["og:price:amount"]||"";
  const platform=getPlatform(item.link);

  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
    ${hot && index<2?`<div class="badge">🔥 Trending</div>`:""}
    <img src="${img}">
    <div class="card-body">
      <div class="platform">${platform}</div>
      <div class="title">${item.title}</div>
      ${price?`<div class="price">$${price}</div>`:""}
      <div class="buttons">
        <a href="${item.link}" target="_blank" class="visit">Visit Store</a>
        <button class="add">Add to Shop</button>
      </div>
    </div>
  `;

  card.querySelector(".add").onclick=()=>{
    addToWall({title:item.title,thumb:img,link:item.link});
    const btn=card.querySelector(".add");
    btn.textContent="Added ✓";
    btn.classList.add("added");
    btn.disabled=true;
  };

  return card;
}

async function render(){
  updateCount();
  const container=document.getElementById("sections");

  for(const group of groups){
    const section=document.createElement("div");
    section.className="section";
    section.innerHTML=`
      <h2>${group.heading}</h2>
      <div class="section-sub">${group.sub}</div>
      <div class="grid"></div>
    `;
    container.appendChild(section);

    const grid=section.querySelector(".grid");
    const query=group.query||group.queries[Math.floor(Math.random()*group.queries.length)];

    const res=await fetch(`/api/search?q=${encodeURIComponent(query)}&start=1`);
    const data=await res.json();

    data.items?.slice(0,8).forEach((item,i)=>{
      const card=createCard(item,group.hot,i);
      if(card) grid.appendChild(card);
    });
  }
}

window.onload=render;
</script>
</body>
</html>
