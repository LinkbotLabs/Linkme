<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="9Z0AqsKQpCxYk815nzq_RHJbBepD_axjrEMI12UuLUU" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tagshop - Free Affiliate Wall Builder</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<style>
:root { --glass: rgba(0,0,0,0.35); --stroke: rgba(255,255,255,0.12); --text:#fff; --muted:#cfcfcf; --accent:#ffe169; }
body { font-family: system-ui; background:#000; color:#fff; padding:20px; transition: background 0.3s, color 0.3s;}
body.light { background:#f0f0f0; color:#000; }
h1 { text-align:center; margin-bottom:10px; }
button { cursor:pointer; border:none; border-radius:6px; padding:8px 12px; font-weight:700; background:#000; color:#fff; margin-top:6px; font-size:12px; }
.card { background: var(--glass); border:1px solid var(--stroke); border-radius:12px; padding:12px; margin-bottom:20px; }
.output { background: rgba(255,255,255,0.04); border:1px solid var(--stroke); border-radius:10px; padding:10px; max-height:400px; overflow-y:auto; margin-top:10px; white-space:pre-wrap; }
.hint { font-size:12px; color:var(--muted); margin-top:6px; }
.grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap:12px; }
.product { border:1px solid var(--stroke); border-radius:8px; padding:6px; text-align:center; background:rgba(0,0,0,0.25); }
.product img { max-width:100%; border-radius:6px; cursor:pointer; }
input, select, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid var(--stroke); background: rgba(255,255,255,0.06); color: var(--text); margin-top:6px; }
.product-btns { display:flex; justify-content:center; gap:4px; margin-top:4px; }
.product-btns button { padding:4px 6px; border-radius:12px; font-size:11px; }

.unlimited-banner {
  background: linear-gradient(135deg, #1fc27e, #39ff14);
  color:#000;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  border-radius:12px;
  margin:10px 0 25px;
}
</style>
</head>
<body>

<h1>Tagshop</h1>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password on My Wall: <strong>tagshopme</strong></span>
</div>

<button id="toggle-theme">Toggle Light/Dark</button>

<div class="card">
  <h2>Product Search</h2>
  <div class="hint">Up to 50 results</div>
  <input type="text" id="search-query" placeholder="Search products..." />
  <button id="search-run">Search</button>
  <button id="toggle-search">Collapse/Expand</button>
  <div class="output" id="search-results"></div>
</div>

<div class="card">
  <h2>Console Logs</h2>
  <button id="toggle-log">Toggle Logs</button>
  <div class="output" id="console-log" style="display:none;"></div>
</div>

<button onclick="window.location.href='mywall.html'" 
style="position:fixed; bottom:20px; right:20px; background:#000; color:#ffe169; border-radius:16px; padding:10px 14px; font-weight:700;">
My Wall
</button>

<script>
/* ---------- LOG HELPER ---------- */
function log(msg){
  console.log(msg);
  const box = document.getElementById("console-log");
  if(box){
    box.innerHTML += "[" + new Date().toLocaleTimeString() + "] " + msg + "<br>";
  }
}

/* ---------- THEME TOGGLE ---------- */
document.getElementById("toggle-theme").addEventListener("click", ()=>{
  document.body.classList.toggle("light");
  log("Theme toggled.");
});

/* ---------- SEARCH ---------- */
const searchResults = document.getElementById("search-results");

document.getElementById("search-run").addEventListener("click", async ()=>{
  const query = document.getElementById("search-query").value.trim();
  if(!query){
    searchResults.innerHTML = "Enter a search term.";
    return;
  }

  searchResults.innerHTML = "<strong>Loading results...</strong>";
  log("Searching: " + query);

  let allItems = [];

  try {
    for(let page=0; page<5; page++){
      const start = page*10+1;

      const res = await fetch("/api/search?q=" + encodeURIComponent(query) + "&start=" + start);
      const data = await res.json();

      if(data.items && data.items.length>0){
        allItems = allItems.concat(data.items);
      } else {
        break;
      }
    }

    if(allItems.length===0){
      searchResults.innerHTML = "No results found.";
      return;
    }

    searchResults.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";

    allItems.forEach(item=>{
      const thumb = item.pagemap?.cse_image?.[0]?.src || "https://via.placeholder.com/100";

      const card = document.createElement("div");
      card.className = "product";

      const img = document.createElement("img");
      img.src = thumb;
      img.onclick = ()=>window.open(item.link,"_blank");

      const title = document.createElement("div");
      title.textContent = item.title;
      title.style.fontSize="12px";
      title.style.marginTop="4px";

      const btnWrap = document.createElement("div");
      btnWrap.className="product-btns";

      const addBtn = document.createElement("button");
      addBtn.textContent="Add to Wall";
      addBtn.onclick=()=>addToWall(item.title,thumb,item.link);

      const viewBtn = document.createElement("button");
      viewBtn.textContent="View Wall";
      viewBtn.onclick=()=>window.location.href="mywall.html";

      btnWrap.appendChild(addBtn);
      btnWrap.appendChild(viewBtn);

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(btnWrap);
      grid.appendChild(card);
    });

    searchResults.appendChild(grid);
    log("Loaded "+allItems.length+" results.");

  } catch(err){
    searchResults.innerHTML="Search error.";
    log("Error: "+err.message);
  }
});

/* ---------- TOGGLES ---------- */
document.getElementById("toggle-search").addEventListener("click", ()=>{
  searchResults.style.display =
    searchResults.style.display==="none" ? "block":"none";
});

document.getElementById("toggle-log").addEventListener("click", ()=>{
  const box=document.getElementById("console-log");
  box.style.display = box.style.display==="none"?"block":"none";
});

/* ---------- WALL ---------- */
function addToWall(title,thumb,link){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.push({title,thumb,link});
  localStorage.setItem("productWall",JSON.stringify(wall));
  log("Added to wall: "+title);
}
</script>

</body>
</html>
