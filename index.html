<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Float Rising – Curated Product Cards</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
.glow { box-shadow: 0 0 25px rgba(34,211,238,0.4); }
</style>
</head>

<body class="bg-gray-950 text-white">

<!-- ================= STATE ================= -->
<script>
const state = {
  products: [],
  index: 0,
  affiliateId: localStorage.getItem("affiliateId") || "davidshort-21",
  creatorUnlocked: localStorage.getItem("creatorUnlocked") === "true",
  points: Number(localStorage.getItem("creatorPoints") || 0),
  autoTimer: null
};
</script>

<!-- ================= FLOATING TOOLBAR ================= -->
<div class="fixed right-4 bottom-24 z-50 flex flex-col gap-2">
  <button onclick="sharePinterest()">📌</button>
  <button onclick="copyPinterest()">📋</button>
  <button onclick="shareLink()">🔗</button>
  <button onclick="openGrok()">🎥</button>
</div>

<!-- ================= HERO ================= -->
<section class="text-center py-20 bg-gradient-to-br from-gray-900 to-black">
  <h1 class="text-5xl font-bold">Float Rising</h1>
  <p class="text-gray-400 mt-3">Create viral product cards that circulate automatically</p>

  <button onclick="switchTab('discover')" class="mt-8 px-8 py-4 bg-cyan-500 rounded-xl glow">
    Start Building
  </button>
</section>

<!-- ================= TABS ================= -->
<nav class="flex justify-center gap-4 py-4 bg-black/50 sticky top-0 z-40">
  <button onclick="switchTab('discover')" id="tabBtn-discover">Discover</button>
  <button onclick="switchTab('how')" id="tabBtn-how">How</button>
  <button onclick="switchTab('unlock')" id="tabBtn-unlock">Unlock</button>
</nav>

<main class="max-w-4xl mx-auto p-4">

<!-- ================= DISCOVER ================= -->
<section id="tab-discover">
  <div class="bg-gray-900 p-4 rounded-xl mb-4">
    Points: <span id="pointsUI"></span>
    <div class="h-2 bg-gray-700 mt-2 rounded">
      <div id="barUI" class="h-2 bg-cyan-400 w-0"></div>
    </div>
  </div>

  <div id="card" class="bg-gray-900 rounded-xl p-6 min-h-[500px]">
    Loading...
  </div>

  <button onclick="nextProduct()" class="mt-4 w-full py-3 bg-cyan-500 rounded-xl">
    Next Product
  </button>
</section>

<!-- ================= HOW ================= -->
<section id="tab-how" class="hidden">
  <div class="bg-gray-900 p-6 rounded-xl">
    <h2 class="text-2xl font-bold mb-4">How It Works</h2>
    <p>1. Discover products</p>
    <p>2. Share cards</p>
    <p>3. Earn traffic</p>
  </div>
</section>

<!-- ================= UNLOCK ================= -->
<section id="tab-unlock" class="hidden">
  <div class="bg-gray-900 p-6 rounded-xl">
    <h2 class="text-xl font-bold mb-4">Unlock Creator Mode</h2>

    <button onclick="openUnlock()" class="bg-indigo-500 px-6 py-3 rounded-xl">
      Unlock $19
    </button>

    <p id="status" class="mt-4"></p>
  </div>
</section>

</main>

<!-- ================= MODALS ================= -->
<div id="unlockModal" class="hidden fixed inset-0 bg-black/70 p-6">
  <div class="bg-gray-900 max-w-md mx-auto mt-40 p-6 rounded-xl">
    <input id="codeInput" placeholder="Enter code" class="w-full p-3 text-black"/>
    <button onclick="activateCreator()" class="mt-4 w-full bg-cyan-500 py-3">Activate</button>
  </div>
</div>

<div id="affiliateModal" class="hidden fixed inset-0 bg-black/70 p-6">
  <div class="bg-gray-900 max-w-md mx-auto mt-40 p-6 rounded-xl">
    <input id="affInput" placeholder="yourname-20" class="w-full p-3 text-black"/>
    <button onclick="saveAffiliate()" class="mt-4 w-full bg-cyan-500 py-3">Save</button>
  </div>
</div>

<div id="grokModal" class="hidden fixed inset-0 bg-black/70 p-6">
  <div class="bg-gray-900 max-w-md mx-auto mt-40 p-6 rounded-xl">
    <textarea id="grokText" class="w-full h-40 text-black"></textarea>
    <button onclick="copyGrok()" class="mt-2 bg-cyan-500 w-full py-2">Copy</button>
  </div>
</div>

<!-- ================= CORE LOGIC ================= -->
<script>

function updateUI(){
  document.getElementById("pointsUI").innerText =
    `${state.points} / 200`;

  document.getElementById("barUI").style.width =
    Math.min(100, (state.points/200)*100) + "%";

  localStorage.setItem("creatorPoints", state.points);
}

function addPoints(n){
  state.points += n;
  updateUI();
}

function switchTab(tab){
  document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
  document.getElementById("tab-"+tab).classList.remove("hidden");
}

function openUnlock(){
  document.getElementById("unlockModal").classList.remove("hidden");
}

function activateCreator(){
  localStorage.setItem("creatorUnlocked","true");
  state.creatorUnlocked = true;
  document.getElementById("unlockModal").classList.add("hidden");
  document.getElementById("affiliateModal").classList.remove("hidden");
}

function saveAffiliate(){
  const val = document.getElementById("affInput").value;
  state.affiliateId = val;
  localStorage.setItem("affiliateId",val);
  document.getElementById("affiliateModal").classList.add("hidden");
}

function affiliate(url){
  return url.includes("tag=") ? url :
    url + (url.includes("?") ? "&" : "?") + "tag=" + state.affiliateId;
}

async function loadProducts(){
  try{
    const res = await fetch("/api/search");
    const data = await res.json();

    state.products = (data.products || data || []).filter(p=>p.link && p.image);

    shuffle(state.products);
    state.index = 0;
    render();
    startAuto();
  } catch(e){
    document.getElementById("card").innerHTML =
      "API offline — refresh later";
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*i);
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function render(){
  const p = state.products[state.index];
  if(!p) return;

  document.getElementById("card").innerHTML = `
    <img src="${p.image}" class="w-full h-64 object-cover rounded-xl"/>
    <h2 class="text-xl mt-4">${p.title}</h2>

    <button onclick="window.open('${affiliate(p.link)}')"
      class="mt-4 w-full bg-cyan-500 py-3 rounded-xl">
      View Product
    </button>
  `;
}

function nextProduct(){
  state.index = (state.index+1) % state.products.length;
  render();
  addPoints(1);
}

function startAuto(){
  clearInterval(state.autoTimer);
  state.autoTimer = setInterval(nextProduct,8000);
}

function shareLink(){
  const p = state.products[state.index];
  navigator.share?.({title:p.title,url:p.link});
  addPoints(1);
}

function sharePinterest(){
  const p = state.products[state.index];
  window.open("https://pinterest.com/pin/create/button/?url="+encodeURIComponent(p.link));
  addPoints(1);
}

function copyPinterest(){
  const p = state.products[state.index];
  navigator.clipboard.writeText(p.title + " " + p.link);
}

function openGrok(){
  document.getElementById("grokText").value =
    "Create viral product video from this product card";
  document.getElementById("grokModal").classList.remove("hidden");
}

function copyGrok(){
  navigator.clipboard.writeText(
    document.getElementById("grokText").value
  );
  addPoints(10);
}

function updateStatus(){
  document.getElementById("status").innerText =
    state.creatorUnlocked ? "Creator Active" : "Free Mode";
}

updateUI();
updateStatus();
loadProducts();

</script>
</body>
</html>
