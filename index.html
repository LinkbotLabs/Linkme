<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Float Rising</title>
<meta name="google-site-verification" content="ohpzxX7bmF1anP3RvE5v_2bzhepA0UJaCJ0jLzlJBNQ" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f4f2;
  --muted:#6b7280;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(to bottom,#f8f8f8,#ececec);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#111;
}

/* BRAND */
.brand{text-align:center;margin-bottom:30px;}
.wave{
  width:120px;height:20px;
  margin:0 auto 10px;
  border-top:2px solid #111;
  border-radius:100% 100% 0 0;
}
.brand h1{
  font-family:'Playfair Display';
  font-size:32px;
  letter-spacing:1.5px;
}

/* HEADER */
.header{width:100%;max-width:420px;margin-bottom:20px;}
.header button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#111;
  color:white;
  font-weight:600;
  cursor:pointer;
}
.status{text-align:center;font-size:13px;margin-top:6px;}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.12);
  margin-bottom:30px;
  position:relative;
}

/* IMAGE AREA */
.image-wrap{
  position:relative;
}
.image-wrap img{
  width:100%;
  display:block;
}
.image-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,transparent 60%,rgba(0,0,0,.65));
}

/* BADGES */
.viral-badge{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:white;
  padding:8px 16px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:2;
}
.creator-badge{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(6px);
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  z-index:2;
}

/* CONTENT */
.content{
  padding:26px 22px 30px;
}
.hook{
  font-family:'Playfair Display';
  font-size:24px;
  line-height:1.2;
  margin-bottom:14px;
}
.product-title{
  font-size:14px;
  color:var(--muted);
  margin-bottom:14px;
}
.stars{
  font-size:14px;
  margin-bottom:16px;
}
.rich{
  font-size:14px;
  line-height:1.6;
  margin-bottom:18px;
}
.cta-box{
  background:#111;
  color:white;
  padding:16px;
  border-radius:18px;
  text-align:center;
  margin-bottom:18px;
  font-weight:700;
  letter-spacing:1px;
}
.btn{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-weight:600;
  margin-bottom:10px;
  cursor:pointer;
}
.btn-primary{background:#111;color:white;}
.btn-secondary{background:#f3f4f6;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:white;
  padding:28px;
  border-radius:22px;
  width:90%;
  max-width:420px;
  text-align:center;
}
.modal input,.modal textarea{
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:12px;
  border:1px solid var(--border);
}
</style>
</head>
<body>

<div class="brand">
  <div class="wave"></div>
  <h1>Float Rising</h1>
</div>

<div class="header">
  <button onclick="creatorUnlocked ? document.getElementById('affiliateModal').style.display='flex' : openUnlock()">
    Creator Mode
  </button>
  <div id="affiliateStatus" class="status"></div>
</div>

<div class="card" id="card">Loading...</div>

<!-- Unlock Modal -->
<div class="modal" id="unlockModal">
  <div class="modal-content">
    <h3>🔓 Unlock Creator Mode</h3>
    <p><strong>$19 USD – One Time</strong></p>
    <input id="unlockCodeInput" placeholder="Enter unlock code"/>
    <button class="btn btn-primary" onclick="activateCreator()">Activate</button>
    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Affiliate Modal -->
<div class="modal" id="affiliateModal">
  <div class="modal-content">
    <h3>Amazon Affiliate ID</h3>
    <input id="affiliateInput" placeholder="yourname-20"/>
    <button class="btn btn-primary" onclick="saveAffiliate()">Save</button>
  </div>
</div>

<script>
let products=[],currentIndex=0;

const DEFAULT_AFFILIATE_ID="davidshort-20";
let affiliateId=localStorage.getItem("affiliateId")||"";
let creatorUnlocked=localStorage.getItem("creatorUnlocked")==="true";

/* STATUS */
function updateStatus(){
const el=document.getElementById("affiliateStatus");
if(creatorUnlocked){
el.innerHTML="🟢 Creator Mode Active";
el.style.color="green";
}else{
el.innerHTML="🔒 Free Mode (Float Rising Affiliate)";
el.style.color="#b45309";
}}
updateStatus();

/* UNLOCK */
function openUnlock(){
document.getElementById("unlockModal").style.display="flex";
}
function closeModal(){
document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}
function activateCreator(){
const code=document.getElementById("unlockCodeInput").value.trim();
if(code==="CREATOR19"){
localStorage.setItem("creatorUnlocked","true");
alert("Creator Mode Activated ✅");
location.reload();
}else alert("Invalid Code");
}

/* AFFILIATE */
function saveAffiliate(){
const val=affiliateInput.value.trim();
if(!val.includes("-")){
alert("Format example: yourname-20");
return;
}
affiliateId=val;
localStorage.setItem("affiliateId",val);
closeModal();
updateStatus();
}

/* HELPERS */
function appendAffiliate(url){
const id=affiliateId||DEFAULT_AFFILIATE_ID;
if(url.includes("tag="))return url;
return url+(url.includes("?")?"&":"?")+"tag="+id;
}
function cleanTitle(t){
return t.replace("Amazon.com: ","").replace(/\|.*$/,"").substring(0,120);
}
function generateHook(title){
return `This ${title.split(" ")[0]} Is Blowing Up On Pinterest 🔥`;
}

/* LOAD PRODUCTS */
async function loadProducts(){
card.innerHTML="Loading...";
const res=await fetch("/api/search");
const data=await res.json();
products=(data.products||[]).filter(p=>p.link);
renderProduct();
}

/* RENDER */
function renderProduct(){
if(!products.length){
card.innerHTML="No products found.";
return;
}
const p=products[currentIndex];
p.rating=(4.6+Math.random()*0.3).toFixed(1);
p.reviews=Math.floor(Math.random()*800+200);
p.sold=Math.floor(Math.random()*1200+300);
p.urgency=Math.floor(Math.random()*10+3);

card.innerHTML=`
<div class="image-wrap">
<div class="viral-badge">🔥 VIRAL FIND</div>
${creatorUnlocked?`<div class="creator-badge">Creator</div>`:""}
<img src="${p.image}">
<div class="image-overlay"></div>
</div>

<div class="content">
<div class="hook">${generateHook(cleanTitle(p.title))}</div>
<div class="product-title">${cleanTitle(p.title)}</div>
<div class="stars">⭐ ${p.rating} • ${p.reviews}+ reviews</div>

<div class="rich">
✔ ${p.sold}+ sold this month<br>
✔ Only ${p.urgency} left in stock<br>
✔ Trending must-have gadget
</div>

<div class="cta-box">LIMITED STOCK — SHOP NOW</div>

<button class="btn btn-primary"
onclick="window.open('${appendAffiliate(p.link)}','_blank')">
Shop Now
</button>

<button class="btn btn-secondary"
onclick="alert('Take a screenshot 📸')">
📸 Take Screenshot
</button>
</div>
`;
}

/* SWIPE */
const cardElement=document.getElementById("card");
let startX=0;
cardElement.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});
cardElement.addEventListener("touchend",e=>{
let endX=e.changedTouches[0].clientX;
if(Math.abs(startX-endX)>60){
if(startX>endX){
currentIndex=(currentIndex+1)%products.length;
}else{
currentIndex=(currentIndex-1+products.length)%products.length;
}
renderProduct();
}
});

loadProducts();
</script>
</body>
</html>
