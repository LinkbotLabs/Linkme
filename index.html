<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Card */
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
  position:relative;
  transition:0.3s ease;
}
.card-brand{
  position:absolute;
  bottom:18px;
  right:20px;
  font-family:'Playfair Display',serif;
  font-size:16px;
  opacity:0.6;
}
.counter{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

/* Buttons */
.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:500;
  font-size:14px;
  margin-bottom:12px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:white;
}
.btn-outline{
  background:white;
  border:1px solid var(--border);
}

/* Nav */
.nav{
  display:flex;
  justify-content:space-between;
  width:100%;
  max-width:420px;
  margin-top:20px;
}
.nav button{
  padding:10px 20px;
  border-radius:12px;
  border:1px solid var(--border);
  background:white;
  cursor:pointer;
}

/* Modals */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-content{
  background:white;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
}

/* Hidden share templates */
.share-template{
  position:absolute;
  left:-9999px;
  background:white;
  font-family:'Inter',sans-serif;
}
.branding{
  position:absolute;
  bottom:40px;
  right:40px;
  font-size:22px;
  font-weight:600;
  font-family:'Playfair Display',serif;
}
</style>
</head>
<body>

<div class="card" id="card">
Loading curated product…
</div>

<div class="nav">
<button onclick="prevProduct()">← Prev</button>
<button onclick="nextProduct()">Next →</button>
</div>

<!-- Premium Modal -->
<div class="modal" id="freeModal">
  <div class="modal-content">
    <h3>Unlock Premium</h3>
    <p style="color:#6b7280;margin:15px 0;">
      Download branded Instagram & TikTok share cards.
    </p>
    <button class="btn btn-primary" onclick="unlockPremium()">Unlock Premium</button>
    <button class="btn btn-outline" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Format Modal -->
<div class="modal" id="formatModal">
  <div class="modal-content">
    <h3>Choose Format</h3>
    <button class="btn btn-primary" onclick="generateImage('square')">Instagram 1:1</button>
    <button class="btn btn-primary" onclick="generateImage('vertical')">TikTok 9:16</button>
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div id="squareTemplate" class="share-template" style="width:1080px;height:1080px;">
<div id="squareContent"></div>
<div class="branding">Float Rising</div>
</div>

<div id="verticalTemplate" class="share-template" style="width:1080px;height:1920px;">
<div id="verticalContent"></div>
<div class="branding">Float Rising</div>
</div>

<script>

/* STATE */
let products=[];
let currentIndex=0;
let affiliateId=localStorage.getItem("affiliateId")||"";
let premiumUser=localStorage.getItem("premiumUser")==="true";

const CACHE_PRODUCTS="float_products_pool";
const CACHE_TIME="float_products_time";
const ONE_DAY=86400000;

/* UTIL */
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

/* HOOKS */
function hook1(){return rand([
"This Is Going Everywhere Right Now",
"TikTok Can’t Stop Talking About This",
"Nobody Expected This To Blow Up",
"This Quietly Became A Bestseller",
"One Of The Smartest Buys This Month"
])}
function hook2(){return rand([
"And The Price Makes It Even Better",
"It Looks Premium Without The Price Tag",
"And It Actually Lives Up To The Hype"
])}
function why(){return rand([
"Clean design. Smart functionality. Zero gimmicks.",
"High ratings and strong repeat buyers.",
"Feels premium without premium price."
])}

/* Affiliate */
function appendAffiliate(url){
if(!affiliateId) return url;
const sep=url.includes("?")?"&":"?";
return url+sep+"affid="+affiliateId;
}

/* Load */
async function loadProducts(){

const cached=localStorage.getItem(CACHE_PRODUCTS);
const time=localStorage.getItem(CACHE_TIME);

if(cached && time && (Date.now()-Number(time))<ONE_DAY){
products=JSON.parse(cached);
renderProduct();
return;
}

const res=await fetch(`/api/search`,{cache:"no-store"});
const data=await res.json();
products=data.products||[];

localStorage.setItem(CACHE_PRODUCTS,JSON.stringify(products));
localStorage.setItem(CACHE_TIME,Date.now());

renderProduct();
}

/* Render */
function renderProduct(){
const p=products[currentIndex];
if(!p) return;

document.getElementById("card").innerHTML=`
<div class="counter">${currentIndex+1} / ${products.length}</div>

<div style="font-family:Playfair Display,serif;font-size:22px;text-align:center;margin-bottom:18px;">
${hook1()}<br>
<span style="color:#6b7280;font-weight:500;">${hook2()}</span>
</div>

<img src="${p.image}" style="width:100%;border-radius:18px;margin-bottom:20px;" />

<div style="font-size:28px;font-weight:600;margin-bottom:12px;text-align:center;">
${p.price||"$29.99"}
</div>

<div style="color:#6b7280;font-size:14px;margin-bottom:20px;text-align:center;">
${why()}
</div>

<button class="btn btn-primary" onclick="window.open('${appendAffiliate(p.link)}','_blank')">
🛒 Shop Now
</button>

<button class="btn btn-outline" onclick="shareProduct()">🔗 Share</button>
<button class="btn btn-outline" onclick="createGrokVideo()">🎬 Create 6s Video</button>

<div class="card-brand">Float Rising</div>
`;
}

/* Carousel */
function nextProduct(){
currentIndex=(currentIndex+1)%products.length;
renderProduct();
}
function prevProduct(){
currentIndex=(currentIndex-1+products.length)%products.length;
renderProduct();
}

/* Swipe */
let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;
if(diff>50) prevProduct();
if(diff<-50) nextProduct();
});

/* Share */
function shareProduct(){
if(!premiumUser){
document.getElementById("freeModal").style.display="flex";
return;
}
document.getElementById("formatModal").style.display="flex";
}
function unlockPremium(){
localStorage.setItem("premiumUser","true");
premiumUser=true;
closeModal();
}
function closeModal(){
document.getElementById("freeModal").style.display="none";
document.getElementById("formatModal").style.display="none";
}

/* Image */
async function generateImage(type){
closeModal();
const template=type==="square"
?document.getElementById("squareTemplate")
:document.getElementById("verticalTemplate");

const content=type==="square"
?document.getElementById("squareContent")
:document.getElementById("verticalContent");

const p=products[currentIndex];

content.innerHTML=`
<div style="padding:100px;text-align:center;">
<img src="${p.image}" style="width:80%;border-radius:30px;margin-bottom:40px;" />
<h1 style="font-family:Playfair Display,serif;font-size:64px;">
${p.price||"$29.99"}
</h1>
</div>
`;

const canvas=await html2canvas(template);
const link=document.createElement("a");
link.download="float-rising-share.png";
link.href=canvas.toDataURL();
link.click();
}

/* Grok */
function createGrokVideo(){
const p=products[currentIndex];
const prompt=encodeURIComponent(`
Create a 6 second cinematic vertical product video.

Product: ${p.title}
Hook: ${hook1()} ${hook2()}
Why people love it: ${why()}

Style:
Fast TikTok pacing
Soft lighting
Close up shots
Modern aesthetic
Text overlay hook
End with "Shop Now"
`);

window.open(`https://grok.com/?prompt=${prompt}`,"_blank");
}

loadProducts();

</script>
</body>
</html>
