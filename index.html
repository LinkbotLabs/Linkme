<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#affiliateSection{width:100%;max-width:420px;margin-bottom:24px;}
#affiliateConnected{
  display:none;padding:14px;border-radius:14px;
  background:#ecfdf3;color:#166534;font-size:14px;
  font-weight:500;text-align:center;
}
.card{
  width:100%;max-width:420px;background:var(--card);
  border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
  position:relative;
}
.card-brand{
  position:absolute;
  bottom:18px;
  right:20px;
  font-family:'Playfair Display',serif;
  font-size:16px;
  opacity:0.6;
}
.loading{text-align:center;color:var(--muted);font-size:14px;}
.btn{
  width:100%;padding:14px;border-radius:14px;
  border:none;cursor:pointer;font-weight:500;
  font-size:14px;margin-bottom:12px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:white;
}
.btn-outline{
  background:white;border:1px solid var(--border);
}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal-content{
  background:white;padding:30px;border-radius:20px;
  width:90%;max-width:420px;text-align:center;
}
.share-template{
  position:absolute;left:-9999px;background:white;
  padding:80px;font-family:'Inter',sans-serif;
}
.branding{
  position:absolute;bottom:40px;right:40px;
  font-size:22px;font-weight:600;
  font-family:'Playfair Display',serif;
}
</style>
</head>
<body>

<div id="affiliateSection">
  <div id="affiliateForm">
    <input id="affiliateInput"
      placeholder="Enter affiliate ID or full link"
      style="width:100%;padding:14px;border-radius:14px;border:1px solid #e5e7eb;font-size:14px;" />
    <button onclick="saveAffiliate()"
      style="margin-top:12px;width:100%;padding:14px;border-radius:14px;border:none;background:#1a1a1a;color:white;font-weight:500;cursor:pointer;">
      Connect Affiliate
    </button>
  </div>
  <div id="affiliateConnected">✓ Affiliate Connected</div>
</div>

<div class="card" id="card">
  <div class="loading">Loading curated product…</div>
</div>

<div class="modal" id="freeModal">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">Unlock Premium</h3>
    <p style="color:#6b7280;margin-bottom:20px;">
      Download branded Instagram & TikTok share cards.
    </p>
    <button class="btn btn-primary" onclick="unlockPremium()">Unlock Premium</button>
    <button class="btn btn-outline" onclick="closeModal()">Close</button>
  </div>
</div>

<div class="modal" id="formatModal">
  <div class="modal-content">
    <h3 style="margin-bottom:20px;">Choose Format</h3>
    <button class="btn btn-primary" onclick="generateImage('square')">Instagram 1:1</button>
    <button class="btn btn-primary" onclick="generateImage('vertical')">TikTok 9:16</button>
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div id="squareTemplate" class="share-template" style="width:1080px;height:1080px;">
  <div id="squareContent"></div>
  <div class="branding">Float Rising</div>
</div>

<div id="verticalTemplate" class="share-template" style="width:1080px;height:1920px;">
  <div id="verticalContent"></div>
  <div class="branding">Float Rising</div>
</div>

<script>

/* ============================
   HOOK ENGINE
============================ */

let currentHook1="";
let currentHook2="";
let currentWhy="";
let currentProduct=null;

function generateHookLine1(){
  const patterns=[
    "This Is Going Everywhere Right Now",
    "TikTok Can’t Stop Talking About This",
    "Nobody Expected This To Blow Up",
    "This Quietly Became A Bestseller",
    "One Of The Smartest Buys This Month",
    "The Internet Found Another Winner"
  ];
  return patterns[Math.floor(Math.random()*patterns.length)];
}

function generateHookLine2(title){
  const lower=title.toLowerCase();

  if(lower.includes("fitness")||lower.includes("gym"))
    return "And It Actually Makes Workouts Easier";

  if(lower.includes("beauty")||lower.includes("skin"))
    return "And It’s Surprisingly Affordable";

  if(lower.includes("car"))
    return "Drivers Didn’t Know They Needed This";

  if(lower.includes("home"))
    return "It Instantly Upgrades Any Space";

  const generic=[
    "And The Price Makes It Even Better",
    "It Looks Premium Without The Price Tag",
    "And It Actually Lives Up To The Hype",
    "It’s More Useful Than You Think"
  ];
  return generic[Math.floor(Math.random()*generic.length)];
}

function generateWhyWeLike(){
  const lines=[
    "Clean design. Smart functionality. Zero gimmicks.",
    "High ratings and strong repeat buyers.",
    "It feels premium without the premium price.",
    "Practical, trending, and easy to recommend.",
    "One of the most shared finds this week."
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}

/* ============================
   GROK VIDEO (NEW)
============================ */

function buildGrokVideoPrompt(){
  return `
Create a 6 second vertical cinematic product video (9:16).

Opening text:
"${currentHook1}"

Second line:
"${currentHook2}"

Show the product in motion.
Modern lifestyle setting.
Soft dramatic lighting.
Premium aesthetic.
Quick close-up cuts.
Smooth transitions.

End frame:
"${currentProduct.price || "$29.99"}"
Brand: Float Rising

Optimized for TikTok engagement.
`;
}

function createGrokVideo(){
  const prompt=encodeURIComponent(buildGrokVideoPrompt());
  window.open("https://grok.com/imagine?prompt="+prompt,"_blank");
}

/* ============================
   EVERYTHING BELOW IS YOUR ORIGINAL LOGIC
============================ */

/* AFFILIATE */
let affiliateId = localStorage.getItem("affiliateId") || "";
if(affiliateId) showConnected();

function saveAffiliate(){
  const val=document.getElementById("affiliateInput").value.trim();
  if(!val) return alert("Enter valid affiliate");
  localStorage.setItem("affiliateId",val);
  affiliateId=val;
  showConnected();
}
function showConnected(){
  document.getElementById("affiliateForm").style.display="none";
  document.getElementById("affiliateConnected").style.display="block";
}

/* PREMIUM */
let premiumUser=localStorage.getItem("premiumUser")==="true";
function unlockPremium(){
  localStorage.setItem("premiumUser","true");
  premiumUser=true;
  alert("Premium Activated (Demo)");
  closeModal();
}

/* ENGINE CONFIG */
const categoryPool=[
"viral gadgets","tiktok beauty finds",
"amazon fitness trending",
"home improvement must have",
"car accessories trending"
];

const CACHE_PRODUCTS="float_products_pool";
const CACHE_TIME="float_products_time";
const CACHE_INDEX="float_products_index";
const ONE_DAY=86400000;

/* HELPERS */
function getNumericPrice(p){
  return Number((p||"").replace(/[^0-9.]/g,""))||0;
}
function appendAffiliate(url){
  if(!affiliateId) return url;
  if(affiliateId.startsWith("http")) return affiliateId;
  const separator=url.includes("?")?"&":"?";
  return url+separator+"affid="+affiliateId;
}
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

/* LOAD PRODUCTS */
async function loadProducts(){

  const cached=localStorage.getItem(CACHE_PRODUCTS);
  const time=localStorage.getItem(CACHE_TIME);

  if(cached && time && (Date.now()-time)<ONE_DAY){

    let pool=JSON.parse(cached);
    let index=parseInt(localStorage.getItem(CACHE_INDEX)||"0");

    if(index>=pool.length) index=0;

    currentProduct=pool[index];
    localStorage.setItem(CACHE_INDEX,index+1);

    renderProduct(currentProduct);
    return;
  }

  const cat=categoryPool[Math.floor(Math.random()*categoryPool.length)];

  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(cat)}&num=50`);
    const data=await res.json();
    if(!data.products||!data.products.length) throw new Error();

    let pool=data.products.sort(
      (a,b)=>getNumericPrice(b.price)-getNumericPrice(a.price)
    );

    pool=shuffleArray(pool);

    localStorage.setItem(CACHE_PRODUCTS,JSON.stringify(pool));
    localStorage.setItem(CACHE_TIME,Date.now());
    localStorage.setItem(CACHE_INDEX,1);

    currentProduct=pool[0];
    renderProduct(currentProduct);

  }catch{
    document.getElementById("card").innerHTML=
      "<div class='loading'>Waiting for API reset…</div>";
  }
}

/* RENDER */
function renderProduct(product){

  currentProduct=product;

  currentHook1=generateHookLine1();
  currentHook2=generateHookLine2(product.title);
  currentWhy=generateWhyWeLike();

  document.getElementById("card").innerHTML=`

    <div style="font-family:Playfair Display,serif;font-size:22px;line-height:1.3;margin-bottom:18px;text-align:center;">
      ${currentHook1}<br>
      <span style="color:#6b7280;font-weight:500;">
        ${currentHook2}
      </span>
    </div>

    <img src="${product.image}" style="width:100%;border-radius:18px;margin-bottom:20px;" />

    <div style="font-size:28px;font-weight:600;margin-bottom:12px;text-align:center;">
      ${product.price||"$29.99"}
    </div>

    <div style="color:#6b7280;font-size:14px;margin-bottom:20px;text-align:center;">
      ${currentWhy}
    </div>

    <button class="btn btn-primary" onclick="window.open(appendAffiliate('${product.link}'),'_blank')">
      🛒 Shop Now
    </button>

    <button class="btn btn-outline" onclick="shareProduct()">
      🔗 Share
    </button>

    <button class="btn btn-outline" onclick="createGrokVideo()">
      🎬 Create 6s Video
    </button>

    <div class="card-brand">
      Float Rising
    </div>
  `;
}

/* SHARE */
function shareProduct(){
  const code=Math.random().toString(36).substring(2,8);
  const link=window.location.origin+"?ref="+code;
  navigator.clipboard.writeText(link);

  if(!premiumUser){
    document.getElementById("freeModal").style.display="flex";
    return;
  }
  document.getElementById("formatModal").style.display="flex";
}

function generateImage(type){

  closeModal();

  const template=type==="square"
    ?document.getElementById("squareTemplate")
    :document.getElementById("verticalTemplate");

  const content=type==="square"
    ?document.getElementById("squareContent")
    :document.getElementById("verticalContent");

  const hook1 = currentHook1;
const hook2 = currentHook2;

  content.innerHTML = `
  <div style="
    background:#f4efe8;
    padding:80px;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-sizing:border-box;
  ">

    <!-- Top Badge -->
    <div style="text-align:center;">
      <div style="
        display:inline-block;
        padding:12px 28px;
        border-radius:40px;
        background:rgba(0,0,0,0.06);
        font-size:28px;
        letter-spacing:1px;
      ">
        Today’s Pick
      </div>
    </div>

    <!-- Hook -->
    <div style="text-align:center;margin-top:40px;">
      <h1 style="
        font-family:Playfair Display,serif;
        font-size:${type==="square"?"76px":"96px"};
        line-height:1.15;
        margin-bottom:30px;
      ">
        ${currentHook1}<br>
        <span style="
          font-size:0.65em;
          color:#6b7280;
          font-weight:500;
        ">
          ${currentHook2}
        </span>
      </h1>
    </div>

    <!-- Product Image -->
    <div style="text-align:center;margin:60px 0;">
      <img src="${currentProduct.image}"
        style="
          width:80%;
          border-radius:30px;
          box-shadow:0 40px 80px rgba(0,0,0,0.08);
        "
      />
    </div>

    <!-- Price -->
    <div style="text-align:center;">
      <div style="
        font-size:64px;
        font-weight:600;
        margin-bottom:20px;
      ">
        ${currentProduct.price || "$29.99"}
      </div>
    </div>

    <!-- Subline -->
    <div style="
      text-align:center;
      font-size:34px;
      color:#6b7280;
      margin-bottom:40px;
    ">
      Shop via link in bio
    </div>

  </div>
`;

  html2canvas(template,{scale:2}).then(canvas=>{
    const a=document.createElement("a");
    a.download="float-rising-share.png";
    a.href=canvas.toDataURL();
    a.click();
  });
}

function closeModal(){
  document.getElementById("freeModal").style.display="none";
  document.getElementById("formatModal").style.display="none";
}

/* INIT */
loadProducts();

</script>
</body>
</html>
