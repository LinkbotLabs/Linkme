<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkMe | Curated Finds</title>

<style>
:root{
  --bg:#111315;
  --card:#1a1d21;
  --text:#f5f5f7;
  --muted:#9ca3af;
  --border:#2a2f36;
  --hover:#1f2328;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{background:var(--bg);color:var(--text);}

header{
  padding:24px 32px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
}

header h1{font-size:20px;font-weight:600;}

.nav-btn{
  background:#2a2f36;
  color:white;
  padding:10px 16px;
  border-radius:12px;
  text-decoration:none;
  font-size:14px;
}

.container{max-width:1200px;margin:auto;padding:50px 20px;}

.category{margin-bottom:80px;}
.category h2{font-size:32px;margin-bottom:28px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:24px;
}

.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--border);
  transition:.3s ease;
  display:flex;
  flex-direction:column;
}

.card:hover{transform:translateY(-4px);background:var(--hover);}

.card img{width:100%;height:220px;object-fit:cover;}

.card-body{padding:18px;display:flex;flex-direction:column;flex:1;}

.card h3{font-size:15px;margin-bottom:6px;}

.badge{font-size:12px;color:var(--muted);margin-bottom:6px;}
.rating{font-size:13px;margin-bottom:10px;}
.why{font-size:13px;color:var(--muted);margin-bottom:16px;}

.card-buttons{margin-top:auto;display:flex;flex-direction:column;gap:8px;}

.primary{
  background:#fff;
  color:#000;
  padding:10px;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
}

.secondary{
  background:#2a2f36;
  color:#fff;
  padding:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <h1>LinkMe</h1>
  <a href="/mywall.html" class="nav-btn">My Shop</a>
</header>

<div class="container" id="content"></div>

<script>

/* -------- HOT POOL -------- */

const hotPool = [
{title:"Jellycat Plush Keychain 🧸",query:"jellycat plush keychain phone charm"},
{title:"Magnetic Phone Mount 📱",query:"magnetic phone mount car desk holder"},
{title:"Collagen Peptide Face Mask ✨",query:"collagen mask peptide sheet mask hydrogel mask"},
{title:"Solar Power Bank ☀️",query:"solar power bank portable charger foldable solar"},
{title:"Back Stretcher & Yoga Wheel 🧘‍♀️",query:"back stretcher spine decompressor yoga wheel"},
{title:"Fusion Dumpling Maker 🍳",query:"dumpling maker sushi roller scallion pancake maker"},
{title:"ASMR Slime Kit 🌈",query:"slime kit kinetic sand jellyfish lamp"},
{title:"Long Distance Touch Bracelet 💞",query:"long distance touch bracelet couple lamp"},
{title:"Mini Hydroponic Planter 🌱",query:"self watering planter led grow light hydroponic kit"},
{title:"RFID Blocking Wallet ✈️",query:"rfid blocking wallet anti theft wallet"},
{title:"LED Nail Lamp 💅",query:"led nail lamp uv gel dryer"},
{title:"Portable Espresso Maker ☕",query:"portable espresso maker manual coffee grinder"},
{title:"Smart Ring Fitness Tracker 💍",query:"smart ring fitness tracker sleep monitor"},
{title:"Holographic Projector 🚀",query:"holographic projector fan display"},
{title:"NMN Longevity Supplement 🧬",query:"nmn supplement resveratrol longevity"},
{title:"Portable Sauna Blanket 🔥",query:"infrared sauna blanket portable detox"},
{title:"AR Makeup Mirror 💄",query:"smart makeup mirror ar virtual try on"}
];

/* -------- DAILY ROTATION -------- */

function seededShuffle(array, seed){
  let result=[...array];
  let random=mulberry32(seed);
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function mulberry32(a){
  return function(){
    var t=a+=0x6D2B79F5;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  }
}

const todaySeed=parseInt(new Date().toISOString().slice(0,10).replace(/-/g,''),10);
const rotatedPool=seededShuffle(hotPool,todaySeed);

let usedTitles=new Set();

function getItems(count){
  const items=[];
  for(let item of rotatedPool){
    if(!usedTitles.has(item.title)){
      items.push(item);
      usedTitles.add(item.title);
    }
    if(items.length===count) break;
  }
  return items;
}

/* -------- IMAGE CACHE (FRONTEND) -------- */

async function fetchImage(query){

  const cacheKey="img_"+query;
  const cached=localStorage.getItem(cacheKey);

  if(cached) return cached;

  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if(!res.ok) return null;

    const data=await res.json();
    const image=data.items?.[0]?.image;

    if(image){
      localStorage.setItem(cacheKey,image);
      return image;
    }

    return null;

  }catch(err){
    return null;
  }
}

/* -------- RENDER -------- */

async function render(){

  const container=document.getElementById("content");
  container.innerHTML="";

  const categories = [

{ heading:"🔥 Hot Today", count:6 },

{ heading:"🚀 Viral Game Changers", count:4 },
{ heading:"✨ Glow Up Factory", count:4 },
{ heading:"💄 Beauty Lab Essentials", count:3 },
{ heading:"🧴 Skincare Obsessions", count:3 },

{ heading:"🔥 Cozy Girl Winter Haven", count:3 },
{ heading:"🕯️ Soft Life Aesthetic", count:3 },
{ heading:"🏡 Home Reset Energy", count:3 },

{ heading:"🍳 TikTok Kitchen Chaos", count:3 },
{ heading:"☕ Café Core Finds", count:3 },
{ heading:"🥗 Wellness Kitchen", count:3 },

{ heading:"🧘‍♀️ Soft Life Wellness", count:3 },
{ heading:"🏋️ Strong Girl Era", count:3 },
{ heading:"🧠 Biohacker Mode", count:3 },

{ heading:"📱 Aesthetic Tech Setup", count:3 },
{ heading:"🎮 Creator Desk Setup", count:3 },
{ heading:"💻 Work From Anywhere", count:3 },

{ heading:"✈️ Travel Main Character", count:3 },
{ heading:"🎒 Smart Travel Hacks", count:3 },

{ heading:"🐾 Pet Bestie Club", count:3 },
{ heading:"🎁 Giftable Finds", count:3 },

{ heading:"🛍️ Under $25 Finds", count:3 },
{ heading:"💎 Luxury Energy Picks", count:3 }

];

  for(const cat of categories){

    const section=document.createElement("div");
    section.className="category";
    section.innerHTML=`<h2>${cat.heading}</h2>`;

    const grid=document.createElement("div");
    grid.className="grid";

    const items=getItems(cat.count);

    for(const item of items){

      const image=await fetchImage(item.query);

      const product={
        title:item.title,
        link:"https://www.amazon.com/s?k="+encodeURIComponent(item.query),
        thumb:image || "https://via.placeholder.com/600x600?text=LinkMe",
        rating:(Math.random()*1+4).toFixed(1)
      };

      const card=document.createElement("div");
      card.className="card";

      card.innerHTML=`
        <img src="${product.thumb}">
        <div class="card-body">
          <h3>${product.title}</h3>
          <div class="badge">Amazon</div>
          <div class="rating">⭐ ${product.rating}</div>
          <div class="card-buttons">
            <a href="${product.link}" target="_blank" class="primary">Visit Store</a>
          </div>
        </div>
      `;

      grid.appendChild(card);
    }

    section.appendChild(grid);
    container.appendChild(section);
  }
}

render();

</script>
</body>
</html>
