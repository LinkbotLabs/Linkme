<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkme – Free Affiliate Storefront Builder</title>

<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --border:#e5e5e7;
  --accent:#111;
  --success:#34c759;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px 40px;
}

.hero h1{
  font-size:3rem;
  margin-bottom:10px;
}

.hero p{
  color:var(--muted);
  font-size:1.2rem;
}

/* GRID */
.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px 100px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:24px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.card-body{
  padding:16px;
}

.title{
  font-weight:600;
  font-size:1rem;
  margin-bottom:6px;
}

.snippet{
  font-size:.9rem;
  color:var(--muted);
  margin-bottom:12px;
}

.add-btn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.added{
  background:var(--success)!important;
}

#myWallBtn{
  position:fixed;
  bottom:24px;
  right:24px;
  background:black;
  color:white;
  padding:16px 28px;
  border-radius:50px;
  font-weight:700;
  border:none;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<div class="hero">
  <h1>Linkme</h1>
  <p>Instant affiliate storefronts. Amazon • Temu • DHgate</p>
</div>

<div class="container">
  <div class="grid" id="productGrid"></div>
</div>

<button id="myWallBtn" onclick="location.href='mywall.html'">
→ My Shop (0)
</button>

<script>
function getPlatform(link){
  if(link.includes("amazon")) return "Amazon";
  if(link.includes("temu")) return "Temu";
  if(link.includes("dhgate")) return "DHgate";
  return "Store";
}

function updateWallCount(){
  const wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  document.getElementById("myWallBtn").textContent =
    `→ My Shop (${wall.length})`;
}

function addToWall(product){
  let wall = JSON.parse(localStorage.getItem("productWall") || "[]");

  if(wall.length >= 50 && !localStorage.getItem("wallUnlocked")){
    alert("50 item limit. Unlock inside My Shop with password: linkme");
    return;
  }

  wall.push(product);
  localStorage.setItem("productWall", JSON.stringify(wall));
  updateWallCount();
}

function createCard(item){
  const thumb = item.pagemap?.cse_image?.[0]?.src;
  if(!thumb) return null;

  const card = document.createElement("div");
  card.className="card";

  card.innerHTML=`
    <img src="${thumb}">
    <div class="card-body">
      <div class="title">${item.title}</div>
      <div class="snippet">${item.snippet || ""}</div>
      <button class="add-btn">Add to Shop</button>
    </div>
  `;

  card.querySelector("button").onclick=()=>{
    addToWall({
      title:item.title,
      thumb,
      link:item.link,
      snippet:item.snippet
    });

    const btn=card.querySelector("button");
    btn.textContent="Added ✓";
    btn.disabled=true;
    btn.classList.add("added");
  };

  return card;
}

async function loadProducts(){
  const res=await fetch("/api/search?q=viral amazon finds 2026&start=1");
  const data=await res.json();

  const grid=document.getElementById("productGrid");

  data.items?.slice(0,12).forEach(item=>{
    const card=createCard(item);
    if(card) grid.appendChild(card);
  });
}

window.onload=()=>{
  updateWallCount();
  loadProducts();
};
</script>
</body>
</html>
