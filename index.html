<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkme – Free Unlimited Affiliate Storefront Builder</title>

<style>
:root{
  --bg:#e6e7eb;
  --glass:rgba(255,255,255,0.6);
  --stroke:rgba(255,255,255,0.5);
  --text:#1c1c1c;
  --muted:#6e6e73;
}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
}

.hero{
  text-align:center;
  padding:60px 20px 30px;
}

.hero h1{
  font-size:3rem;
  margin:0 0 10px;
}

.hero p{
  font-size:1.2rem;
  color:var(--muted);
}

.categories-container{
  max-width:1200px;
  margin:40px auto 80px;
  padding:0 20px;
}

.category-section{
  margin-bottom:80px;
}

.category-section h2{
  text-align:center;
  margin-bottom:30px;
}

.category-grid{
  column-count:2;
  column-gap:20px;
}

@media (min-width:768px){
  .category-grid{column-count:3;}
}

.product-card{
  break-inside:avoid;
  margin-bottom:20px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.product-card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-content{
  padding:16px;
}

.card-title{
  font-weight:700;
  margin-bottom:8px;
}

.why-buy{
  font-size:0.9rem;
  color:var(--muted);
  margin-bottom:12px;
}

.add-btn{
  display:block;
  width:100%;
  padding:10px;
  background:var(--text);
  color:white;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

.platform-badge{
  position:absolute;
  top:10px;
  right:10px;
  background:white;
  padding:5px 10px;
  border-radius:10px;
  font-size:0.8rem;
  font-weight:600;
}

.product-card{position:relative;}
</style>
</head>

<body>

<div class="hero">
  <h1>Linkme</h1>
  <p>Instant affiliate storefronts • Amazon • Temu • DHgate</p>
</div>

<div id="categories-container" class="categories-container"></div>

<script>

// ================= GROUPS =================
const allGroups = [
  { heading: "Hot Today 🔥", query: "tiktok viral products 2026" },
  { heading: "Viral Amazon Finds 🚀", query: "viral amazon finds 2026" },
  { heading: "Glow Up ✨", queries: ["LED face mask red light therapy", "snail mucin serum", "collagen mask"] },
  { heading: "Kitchen Finds 🍳", queries: ["mini waffle maker viral", "portable blender usb", "egg bite maker"] },
  { heading: "Tech Setup 📱", queries: ["wireless earbuds", "solar power bank", "magnetic car mount"] }
];

function getDailyGroups(){
  const day = new Date().getDate();
  const start = (day - 1) % allGroups.length;
  const selected = [];
  for(let i=0;i<allGroups.length;i++){
    selected.push(allGroups[(start + i) % allGroups.length]);
  }
  return selected;
}

// ================= PLATFORM =================
function getPlatform(link){
  if(!link) return "Shop";
  if(link.includes("amazon")) return "Amazon";
  if(link.includes("temu")) return "Temu";
  if(link.includes("dhgate")) return "DHgate";
  return "Shop";
}

// ================= CARD =================
function createProductCard(item){
  try{
    const thumb = item.pagemap?.cse_image?.[0]?.src || "";
    const title = item.title || "Untitled Product";
    const link = item.link || "#";
    const snippet = item.snippet || "Trending product";
    const platform = getPlatform(link);

    const card = document.createElement("div");
    card.className = "product-card";

    let html = "";

    if(thumb && !thumb.includes("gstatic")){
      html += `<img src="${thumb}" alt="${title}" loading="lazy">`;
    }else{
      html += `<div style="height:250px;display:flex;align-items:center;justify-content:center;background:#f2f2f2;color:#999;">No Image</div>`;
    }

    html += `<div class="platform-badge">${platform}</div>`;

    html += `
      <div class="card-content">
        <div class="card-title">${title}</div>
        <div class="why-buy">${snippet.substring(0,100)}${snippet.length>100?'...':''}</div>
        <a href="${link}" target="_blank">
          <button class="add-btn">View Product</button>
        </a>
      </div>
    `;

    card.innerHTML = html;
    return card;

  }catch(err){
    console.error("Card error:",err);
    return null;
  }
}

// ================= RENDER =================
async function renderGroup(group, container){
  const section = document.createElement("div");
  section.className = "category-section";
  section.innerHTML = `<h2>${group.heading}</h2><div class="category-grid"></div>`;
  container.appendChild(section);

  const grid = section.querySelector(".category-grid");

  try{
    const query = group.query || group.queries[Math.floor(Math.random()*group.queries.length)];
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&start=1`);
    const data = await res.json();

    if(!data.items || data.items.length===0){
      grid.innerHTML = `<p style="text-align:center;color:#999;">No products found.</p>`;
      return;
    }

    data.items.slice(0,12).forEach(item=>{
      const card = createProductCard(item);
      if(card) grid.appendChild(card);
    });

  }catch(err){
    console.error("Fetch error:",err);
    grid.innerHTML = `<p style="text-align:center;color:#ff6b6b;">Failed to load products.</p>`;
  }
}

// ================= INIT =================
window.addEventListener("load", async ()=>{
  const container = document.getElementById("categories-container");
  const groups = getDailyGroups();
  for(const group of groups){
    await renderGroup(group, container);
  }
});

</script>

</body>
</html>
