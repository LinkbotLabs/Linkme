<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google-site-verification" content="ohpzxX7bmF1anP3RvE5v_2bzhepA0UJaCJ0jLzlJBNQ" />
<title>LinkMe – We Source Daily</title>

<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --text: #0f0f11;
  --muted: #6b7280;
  --accent: #0066ff;
  --accent-soft: #3b82f6;
  --border: #e2e8f0;
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
  --radius: 20px;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  color: var(--text);
  line-height: 1.5;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 28px;
  background: white;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
}

header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  margin: 0;
}

header button {
  background: var(--accent);
  border: none;
  padding: 12px 24px;
  border-radius: 14px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

header button:hover {
  background: var(--accent-soft);
}

/* CATEGORY TABS (visual only for now) */
.category-tabs {
  display: flex;
  overflow-x: auto;
  padding: 16px 28px;
  gap: 12px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.category-tab {
  padding: 10px 20px;
  background: #f1f5f9;
  border-radius: 50px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}

.category-tab.active,
.category-tab:hover {
  background: var(--accent);
  color: white;
}

/* SECTIONS */
.section {
  padding: 40px 24px 20px;
}

.section h2 {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 32px;
  color: var(--text);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 32px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
}

/* CARD – matched to mywall.html */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all 0.35s ease;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: var(--shadow-md);
}

.card img {
  width: 100%;
  aspect-ratio: 4 / 3.2;
  object-fit: cover;
  background: #f8fafc;
}

.card-content {
  padding: 20px;
}

.card h3 {
  font-size: 1.25rem;
  font-weight: 600;
  margin: 0 0 12px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card button {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 12px;
}

.card button:hover {
  background: var(--accent-soft);
}

.card button.saved {
  background: #10b981;
}

/* FLOAT BUTTON */
#wallBtn {
  position: fixed;
  bottom: 32px;
  right: 32px;
  background: var(--accent);
  color: white;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  box-shadow: 0 12px 32px rgba(0,102,255,0.25);
  transition: all 0.3s;
  z-index: 999;
}

#wallBtn:hover {
  transform: translateY(-4px);
}

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-size: 1.1rem;
}

/* Mobile */
@media (max-width: 768px) {
  .grid { gap: 24px; padding: 0 16px; }
  .section { padding: 32px 16px 16px; }
}
</style>
</head>

<body>

<header>
  <h1>We Source Daily – Create Your Shop</h1>
  <button onclick="location.href='mywall.html'">My Wall</button>
</header>

<div class="category-tabs">
  <div class="category-tab active">Hot Picks 🔥</div>
  <div class="category-tab">TikTok Viral</div>
  <div class="category-tab">New Niche Finds</div>
  <div class="category-tab">Glow Up Essentials</div>
  <div class="category-tab">Tech Gadgets</div>
</div>

<div id="sections"></div>

<button id="wallBtn" onclick="location.href='mywall.html'">
  View My Wall (0)
</button>

<script>
const groups = [
  { heading: "🔥 Hot Picks", query: "hot viral products tiktok" },
  { heading: "TikTok Viral", query: "tiktok viral products 2026" },
  { heading: "New Niche Finds", query: "emerging niche products trending" },
  { heading: "Glow Up Essentials", query: "self care glow up trending" },
  { heading: "Tech Gadgets", query: "aesthetic tech gadgets viral" }
];

let seenLinks = new Set();
let seenImages = new Set();
let seenTitles = new Set();

function normalize(text) {
  return text?.toLowerCase().replace(/[^a-z0-9]/g, "") || "";
}

function updateCount() {
  const wall = JSON.parse(localStorage.getItem("linkme_wall") || "[]");
  document.getElementById("wallBtn").textContent = `View My Wall (${wall.length})`;
}

function getPlatform(link) {
  if (!link) return "other";
  if (link.includes("amazon")) return "amazon";
  if (link.includes("dhgate")) return "dhgate";
  if (link.includes("temu")) return "temu";
  return "other";
}

function addToWall(product) {
  let wall = JSON.parse(localStorage.getItem("linkme_wall") || "[]");
  if (wall.some(p => p.link === product.link)) return;
  wall.push(product);
  localStorage.setItem("linkme_wall", JSON.stringify(wall));
  updateCount();
}

function createCard(item) {
  if (!item?.title || !item?.image || !item?.link) return null;

  const cleanTitle = normalize(item.title);
  if (seenLinks.has(item.link) || seenImages.has(item.image) || seenTitles.has(cleanTitle)) {
    return null;
  }

  seenLinks.add(item.link);
  seenImages.add(item.image);
  seenTitles.add(cleanTitle);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${item.image}" loading="lazy" alt="${item.title}">
    <div class="card-content">
      <h3>${item.title}</h3>
      <button class="save-btn">Save to Wall</button>
    </div>
  `;

  const btn = card.querySelector(".save-btn");
  btn.onclick = () => {
    addToWall({
      title: item.title,
      image: item.image,
      link: item.link,
      platform: getPlatform(item.link)
    });
    btn.textContent = "Saved ✓";
    btn.classList.add("saved");
    btn.disabled = true;
  };

  return card;
}

async function render() {
  updateCount();
  const container = document.getElementById("sections");
  container.innerHTML = "";

  const today = new Date();
  const daySeed = today.getDate() + today.getMonth() * 31 + today.getFullYear() * 365;

  for (const group of groups) {
    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${group.heading}</h2>`;
    container.appendChild(section);

    const grid = document.createElement("div");
    grid.className = "grid";
    section.appendChild(grid);

    const loading = document.createElement("div");
    loading.className = "loading";
    loading.textContent = "Sourcing today's fresh finds...";
    grid.appendChild(loading);

    try {
      // Try to fetch a larger set so we can pick ~50 daily
      const res = await fetch(`/api/search?q=${encodeURIComponent(group.query)}&limit=300`);
      const data = await res.json();

      grid.removeChild(loading);

      let items = data.items || [];
      if (items.length > 50) {
        // Simple daily rotation: seeded shuffle + slice first 50
        const seeded = items.map((item, i) => ({ item, sort: Math.sin(daySeed + i) }));
        seeded.sort((a, b) => a.sort - b.sort);
        items = seeded.map(s => s.item).slice(0, 50);
      }

      items.forEach(item => {
        const card = createCard(item);
        if (card) grid.appendChild(card);
      });

      if (!grid.children.length) {
        grid.innerHTML = '<p style="text-align:center; color:var(--muted);">No new finds today – check back tomorrow!</p>';
      }
    } catch (err) {
      console.error("Fetch error:", err);
      loading.textContent = "Couldn't load today's picks – try refreshing.";
    }
  }
}

window.onload = render;
</script>
</body>
</html>
