<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  justify-content:center;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
  transition:0.3s ease;
}

.hook{
  font-family:'Playfair Display',serif;
  font-size:26px;
  font-weight:600;
  text-align:center;
  margin-bottom:20px;
}

.product-image{
  width:100%;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.08);
}

.social-proof{
  font-size:14px;
  color:var(--muted);
  margin-bottom:16px;
}

.divider{
  height:1px;
  background:var(--border);
  margin:16px 0;
}

.micro-copy{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
}

.price{
  font-size:28px;
  font-weight:600;
}

.old-price{
  font-size:16px;
  text-decoration:line-through;
  color:var(--muted);
  margin-left:8px;
}

.discount{
  display:inline-block;
  background:var(--accent);
  color:white;
  padding:6px 14px;
  border-radius:30px;
  font-size:13px;
  margin-top:10px;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:24px;
}

.btn{
  flex:1;
  padding:14px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:500;
  font-size:14px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:white;
}

.btn-secondary{
  background:#f3f4f6;
}

.grok-btn{
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#e5e7eb;
  cursor:pointer;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="loading">Waiting for PSE reset…</div>
</div>

<script>
const affiliateId = "YOUR_AFFILIATE_ID";
const searchQuery = "viral gadgets"; // Predefined search pool

// Generate viral hook dynamically
function generateHook(title){
  const hooks = [
    "Amazon Can’t Keep This in Stock",
    "The $19 Fix Nobody Told You About",
    "TikTok Made This Sell Out in 48 Hours",
    title + " Is Blowing Up Right Now"
  ];
  return hooks[Math.floor(Math.random() * hooks.length)];
}

// Fetch once only
async function loadProduct(){
  try{
    const res = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}&start=1`);
    if(!res.ok) throw new Error("API error");

    const data = await res.json();
    if(!data.items || !data.items.length) throw new Error("No items");

    const product = data.items[0];

    renderCard(product);

  }catch(err){
    document.getElementById("card").innerHTML =
      `<div class="loading">API quota waiting. Will work after reset.</div>`;
  }
}

function renderCard(product){

  const hook = generateHook(product.title);
  const price = product.price || "$29.99";
  const oldPrice = product.old_price || "$39.99";

  document.getElementById("card").innerHTML = `
    <div class="hook">${hook}</div>

    <img class="product-image" src="${product.image}" />

    <div class="social-proof">
      🔥 4.8 (1,342 reviews)<br/>
      🚀 Trending Now
    </div>

    <div class="divider"></div>

    <div class="micro-copy">
      Solves a problem you didn’t know had a fix.
    </div>

    <div class="price">
      ${price}
      <span class="old-price">${oldPrice}</span>
    </div>

    <div class="discount">20% OFF</div>

    <div class="button-row">
      <button class="btn btn-primary" onclick="shopNow('${product.link}')">🛒 Shop Now</button>
      <button class="btn btn-secondary" onclick="shareProduct()">🔗 Share</button>
    </div>

    <button class="grok-btn" onclick="generateVideo()">
      🎬 Grok Video
    </button>
  `;
}

function shopNow(link){
  const shareCode = localStorage.getItem("shareCode") || "";
  const finalUrl = `${link}&affid=${affiliateId}&share=${shareCode}`;
  window.open(finalUrl, "_blank");
}

function shareProduct(){
  const code = Math.random().toString(36).substring(2,8);
  localStorage.setItem("shareCode", code);
  const shareUrl = window.location.href + "?ref=" + code;
  navigator.clipboard.writeText(shareUrl);
  alert("Share link copied!");
}

function generateVideo(){
  alert("Grok video trigger placeholder.");
}

// Run once
loadProduct();

</script>

</body>
</html>
