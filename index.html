<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Float Rising Products</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#6b7280;
  --accent:#2e7d32;
  --accent-light:#3fa34d;
  --border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  padding:40px 20px;
  display:flex;
  justify-content:center;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.06);
  padding:30px;
  transition:0.3s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 25px 50px rgba(0,0,0,0.08);
}

.hook{
  font-family:'Playfair Display',serif;
  font-size:28px;
  font-weight:600;
  color:var(--text);
  text-align:center;
  margin-bottom:24px;
  line-height:1.2;
}

.product-image{
  width:100%;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.08);
}

.social-proof{
  font-size:14px;
  color:var(--muted);
  margin-bottom:16px;
}

.divider{
  height:1px;
  background:var(--border);
  margin:16px 0;
}

.micro-copy{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
}

.price{
  font-size:28px;
  font-weight:600;
  color:var(--text);
}

.old-price{
  font-size:16px;
  text-decoration:line-through;
  color:var(--muted);
  margin-left:10px;
}

.discount{
  display:inline-block;
  background:var(--accent);
  color:white;
  padding:6px 14px;
  border-radius:30px;
  font-size:13px;
  margin-top:10px;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:24px;
}

.btn{
  flex:1;
  padding:14px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:500;
  font-size:14px;
  transition:0.2s ease;
}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:white;
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.btn-secondary{
  background:#f3f4f6;
  color:var(--text);
}

.grok-btn{
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#e5e7eb;
  cursor:pointer;
  font-weight:500;
}
</style>
</head>

<body>

<div class="card">

  <div class="hook">
    Amazon Can’t Keep This in Stock
  </div>

  <img class="product-image" 
       src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba4" 
       alt="Product Image" />

  <div class="social-proof">
    🔥 4.8 (1,342 reviews) <br/>
    🚀 16K sold this week
  </div>

  <div class="divider"></div>

  <div class="micro-copy">
    Solves a problem you didn’t know had a fix.
  </div>

  <div class="price">
    $29.99 
    <span class="old-price">$39.99</span>
  </div>

  <div class="discount">
    20% OFF
  </div>

  <div class="button-row">
    <button class="btn btn-primary" onclick="shopNow()">🛒 Shop Now</button>
    <button class="btn btn-secondary" onclick="shareProduct()">🔗 Share</button>
  </div>

  <button class="grok-btn" onclick="generateVideo()">
    🎬 Grok Video
  </button>

</div>

<script>
const affiliateId = "YOUR_AFFILIATE_ID";

function shopNow(){
  const baseUrl = "https://example.com/product";
  const shareCode = localStorage.getItem("shareCode") || "";
  const finalUrl = `${baseUrl}?affid=${affiliateId}&share=${shareCode}`;
  window.open(finalUrl, "_blank");
}

function shareProduct(){
  const code = Math.random().toString(36).substring(2,8);
  localStorage.setItem("shareCode", code);
  const shareUrl = window.location.href + "?ref=" + code;
  navigator.clipboard.writeText(shareUrl);
  alert("Share link copied!");
}

function generateVideo(){
  alert("Trigger Grok video generation here.");
}
</script>

</body>
</html>
