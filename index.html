<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float Rising</title>

<style>
:root{
 --bg:#0c0f14;
 --card:#141923;
 --accent:#00e6ff;
 --gold:#d4af37;
 --text:#f5f5f7;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
 overflow-x:hidden;
 animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}

header{
 text-align:center;
 padding:40px 20px 10px;
}

.logo{
 font-size:34px;
 font-weight:700;
 letter-spacing:6px;
 background:linear-gradient(90deg,#00e6ff,#7afcff);
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

.subtitle{
 font-size:12px;
 letter-spacing:3px;
 opacity:.6;
 margin-top:6px;
}

.controls{
 text-align:center;
 margin:25px;
}

input{
 padding:10px;
 border-radius:6px;
 border:none;
 width:220px;
}

button{
 padding:10px 14px;
 margin:6px;
 border:none;
 border-radius:6px;
 cursor:pointer;
 font-weight:600;
}

.primary{background:var(--accent);color:#000;}
.gold{background:var(--gold);color:#000;}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
 gap:28px;
 padding:20px;
}

.card{
 background:var(--card);
 border-radius:18px;
 overflow:hidden;
 position:relative;
 box-shadow:0 20px 50px rgba(0,0,0,.6);
 transition:.4s;
}

.card:hover{
 transform:translateY(-10px);
 box-shadow:0 30px 70px rgba(0,230,255,.15);
}

.card img{
 width:100%;
 height:340px;
 object-fit:cover;
}

.badge{
 position:absolute;
 top:15px;
 left:15px;
 background:var(--gold);
 color:#000;
 padding:6px 10px;
 font-size:11px;
 font-weight:700;
 border-radius:4px;
}

.vertical-b{
 position:absolute;
 right:0;
 top:0;
 bottom:0;
 width:30px;
 background:linear-gradient(180deg,#00e6ff,#004d66);
 writing-mode:vertical-rl;
 text-orientation:upright;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:700;
}

.content{padding:22px;}

.hook{
 font-size:21px;
 font-weight:700;
 margin-bottom:8px;
}

.reason{
 font-size:14px;
 opacity:.75;
 margin-bottom:15px;
}

.footer{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.85);
 display:none;
 align-items:center;
 justify-content:center;
}

.modal-content{
 background:var(--card);
 padding:30px;
 border-radius:14px;
 text-align:center;
}

.premium-badge{
 position:fixed;
 bottom:15px;
 right:15px;
 background:var(--gold);
 color:#000;
 padding:8px 12px;
 border-radius:20px;
 font-size:12px;
 display:none;
}
</style>
</head>
<body>

<header>
 <div class="logo">FLOAT RISING</div>
 <div class="subtitle">GLOBAL EDITORIAL LUXURY DISCOVERY</div>
</header>

<div class="controls">
 <input id="affInput" placeholder="Enter Affiliate Tag">
 <button class="primary" onclick="saveAff()">Activate</button>
 <button class="gold" onclick="openPremium()">Premium</button>
 <div id="status" style="margin-top:8px;color:#00ff9d;font-size:13px;"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="premiumModal">
 <div class="modal-content">
  <h3>Premium Access</h3>
  <input type="password" id="premiumPass" placeholder="Password">
  <br><br>
  <button class="gold" onclick="unlockPremium()">Unlock</button>
 </div>
</div>

<div class="premium-badge" id="premiumBadge">PREMIUM ACTIVE</div>

<script>

/* ===========================
   REGION DETECTION
=========================== */

function getAmazonBase(){
 const lang=navigator.language||"en-US";
 if(lang.includes("GB")) return "https://www.amazon.co.uk";
 if(lang.includes("DE")) return "https://www.amazon.de";
 if(lang.includes("CA")) return "https://www.amazon.ca";
 if(lang.includes("AU")) return "https://www.amazon.com.au";
 return "https://www.amazon.com";
}

/* ===========================
   50 CURATED PRODUCTS
=========================== */

const base=getAmazonBase();

const pool=[
{t:"Minimalist Leather Travel Backpack",h:"Airport Energy. Zero Noise.",r:"Understated power piece for global movement.",d:"B07Y2X5S6M",i:"https://m.media-amazon.com/images/I/81G9z0c4+KL._AC_SL1500_.jpg"},
{t:"Ninja Professional Blender",h:"Kitchen Status Upgrade",r:"Power meets sculpted design.",d:"B002JM202I",i:"https://m.media-amazon.com/images/I/71KlybE3uLL._AC_SL1500_.jpg"},
{t:"Premium Blue Light Glasses",h:"Desk Aura Essential",r:"Sharper focus. Cleaner aesthetic.",d:"B07W781XWF",i:"https://m.media-amazon.com/images/I/61k7X5c9YyL._AC_SL1500_.jpg"},
{t:"Portable Espresso Machine",h:"Luxury Caffeine Anywhere",r:"Barista-level extraction on the move.",d:"B07D5KRQL7",i:"https://m.media-amazon.com/images/I/71X5Y6p3LkL._AC_SL1500_.jpg"},
{t:"Noise Cancelling Headphones",h:"Silence As A Statement",r:"Focus becomes fashion.",d:"B08N5WRWNW",i:"https://m.media-amazon.com/images/I/71o8Q5XJS5L._AC_SL1500_.jpg"},
{t:"Glass Standing Desk Converter",h:"Executive Workflow Reset",r:"Health meets editorial workspace.",d:"B07D2P8B9C",i:"https://m.media-amazon.com/images/I/71GvBszY-XL._AC_SL1500_.jpg"},
{t:"Magnetic Wireless Power Bank",h:"Energy Without Wires",r:"Pocket-sized luxury tech.",d:"B09G3HRMVB",i:"https://m.media-amazon.com/images/I/61S9aVnRzDL._AC_SL1500_.jpg"},
{t:"Luxury Ceramic Knife Set",h:"Precision With Presence",r:"Minimalist kitchen dominance.",d:"B08K2GWK8M",i:"https://m.media-amazon.com/images/I/81qE6G6t1xL._AC_SL1500_.jpg"}
];

/* Expand to 50 unique variations */
while(pool.length<50){
 const p=pool[pool.length%8];
 pool.push({...p,t:p.t+" Edition "+pool.length});
}

/* ===========================
   DAILY ROTATION
=========================== */

function dailySeed(){
 const today=new Date().toISOString().slice(0,10);
 return today.split("").reduce((a,b)=>a+b.charCodeAt(0),0);
}

function getDailyProducts(){
 const seed=dailySeed();
 const shuffled=[...pool].sort(()=>0.5-Math.sin(seed++));
 return shuffled.slice(0,12);
}

/* ===========================
   RENDER
=========================== */

function render(){
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 getDailyProducts().forEach(p=>{
  const link=base+"/dp/"+p.d;
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   <div class="badge">TRENDING</div>
   <div class="vertical-b">B</div>
   <img src="${p.i}">
   <div class="content">
    <div class="hook">${p.h}</div>
    <div class="reason">${p.r}</div>
    <div class="footer">
     <button class="primary" onclick='shop("${link}")'>Shop</button>
     <button onclick='grok("${p.t}")'>6s Video</button>
     <button onclick='downloadCard("${p.t}","${p.h}","${link}")'>Download</button>
     <button onclick='copyLink("${link}")'>Copy Link</button>
    </div>
   </div>`;
  grid.appendChild(card);
 });
}

/* ===========================
   AFFILIATE
=========================== */

function saveAff(){
 const v=document.getElementById("affInput").value.trim();
 if(!v) return alert("Enter Affiliate Tag");
 localStorage.setItem("affid",v);
 document.getElementById("status").innerText="Affiliate Active ✓";
}

function requireAff(){
 const aff=localStorage.getItem("affid");
 if(!aff){alert("Enter Affiliate Tag first");return null;}
 return aff;
}

function shop(link){
 const aff=requireAff();
 if(!aff)return;
 window.open(link+"?tag="+aff,"_blank");
}

function copyLink(link){
 const aff=requireAff();
 if(!aff)return;
 navigator.clipboard.writeText(link+"?tag="+aff);
 alert("Affiliate Link Copied");
}

/* ===========================
   GROK
=========================== */

function grok(title){
 navigator.clipboard.writeText(
 `Create a cinematic 6 second vertical luxury product video for ${title}.
 Hook in 2 seconds.
 Show transformation.
 Editorial aesthetic.
 End with confident call to action.`
 );
 window.open("https://grok.x.ai","_blank");
}

/* ===========================
   PREMIUM
=========================== */

function openPremium(){
 document.getElementById("premiumModal").style.display="flex";
}

function unlockPremium(){
 if(document.getElementById("premiumPass").value==="Floaton"){
  localStorage.setItem("premium","true");
  document.getElementById("premiumModal").style.display="none";
  document.getElementById("premiumBadge").style.display="block";
 }else alert("Incorrect Password");
}

/* ===========================
   DOWNLOAD PREMIUM CARD
=========================== */

function downloadCard(title,hook,link){
 if(localStorage.getItem("premium")!=="true")
  return alert("Premium Required");

 const aff=requireAff();
 if(!aff)return;

 const canvas=document.createElement("canvas");
 canvas.width=1080;
 canvas.height=1350;
 const ctx=canvas.getContext("2d");

 ctx.fillStyle="#0c0f14";
 ctx.fillRect(0,0,1080,1350);

 ctx.fillStyle="#ffffff";
 ctx.font="bold 70px sans-serif";
 ctx.fillText("FLOAT RISING",100,140);

 ctx.font="bold 80px sans-serif";
 ctx.fillText(hook,100,400);

 ctx.font="50px sans-serif";
 ctx.fillText(title,100,500);

 ctx.font="30px sans-serif";
 ctx.fillText(link+"?tag="+aff,100,1150);

 const a=document.createElement("a");
 a.download="FloatRisingEditorial.png";
 a.href=canvas.toDataURL();
 a.click();
}

/* INIT */
if(localStorage.getItem("premium")==="true")
 document.getElementById("premiumBadge").style.display="block";

render();

</script>

</body>
</html>
