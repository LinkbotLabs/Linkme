<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop</title>

<style>
:root {
  --bg: #0f0f10;
  --card: #1a1a1c;
  --accent: #ffa500;
  --text: #ffffff;
  --muted: #a0a0a0;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  font-weight: 600;
}

.category {
  padding: 20px;
}

.category h2 {
  margin-bottom: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  transition: transform .2s ease;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-4px);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 12px;
  flex-grow: 1;
}

.card h3 {
  font-size: 14px;
  margin: 0 0 6px;
}

.snippet {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}

.rating {
  font-size: 12px;
  margin-bottom: 10px;
}

.buttons {
  display: flex;
  gap: 8px;
}

button {
  flex: 1;
  border: none;
  padding: 8px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

.visit {
  background: var(--accent);
  color: #000;
}

.add {
  background: #2a2a2c;
  color: #fff;
}

.added {
  background: #1e4620;
  color: #7CFC00;
}

/* Slide Up Sheet */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: flex-end;
}

.sheet {
  background: #1c1c1e;
  width: 100%;
  max-height: 80%;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  transform: translateY(100%);
  transition: transform .3s ease;
}

.sheet.open {
  transform: translateY(0);
}

.sheet input, .sheet textarea {
  width: 100%;
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #2a2a2c;
  color: white;
}

.sheet button {
  background: var(--accent);
  color: black;
  font-weight: bold;
}

</style>
</head>

<body>

<header>My Shop</header>

<div id="categories"></div>

<!-- Slide Up Sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <h3>Edit Before Adding</h3>
    <input type="text" id="editTitle">
    <textarea id="editWhy" rows="3"></textarea>
    <textarea id="editNote" rows="2" placeholder="Personal note (optional)"></textarea>
    <button id="saveProduct">Save to Shop</button>
  </div>
</div>

<script>

/* ========== DAILY SEED ========== */
function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

const todaySeed = new Date().toISOString().slice(0,10);
const rng = mulberry32(todaySeed.split('-').join(''));

/* ========== CATEGORIES ========== */
const categoryPool = [

  /* Core Discovery */

  { name: "🔥 Hot Today", query: "trending gadgets 2026" },
  { name: "🚀 Viral Game Changers", query: "viral tech products" },
  { name: "✨ Glow Up Factory", query: "beauty must have products" },
  { name: "🏠 Home Upgrades", query: "amazon home improvement gadgets" },
  { name: "🎮 Gamer Essentials", query: "gaming accessories amazon" },
  { name: "💼 Productivity Hacks", query: "productivity desk gadgets" },
  { name: "💡 Smart Living", query: "smart home devices 2026" },
  { name: "🎒 Travel Must Haves", query: "travel accessories must have" },
  { name: "🧠 Cool Finds", query: "unique amazon products" },
  { name: "🛍 Budget Wins", query: "cheap useful gadgets" },

  /* Lifestyle & Niche */

  { name: "🐶 Pet Obsession", query: "innovative pet products amazon" },
  { name: "🚗 Car Upgrades", query: "car accessories must have" },
  { name: "🏋️ Home Fitness", query: "home workout equipment gadgets" },
  { name: "🌿 Wellness Lab", query: "wellness gadgets trending" },
  { name: "🧴 Skincare Tech", query: "skincare devices amazon" },
  { name: "🎥 Creator Studio", query: "content creator gadgets amazon" },
  { name: "🛠 DIY & Tools", query: "clever tools amazon" },
  { name: "📱 Phone Life", query: "iphone accessories trending" },
  { name: "🧑‍🍳 Kitchen Genius", query: "kitchen gadgets viral" },
  { name: "🎁 Gift Radar", query: "cool gift ideas trending products" },

  /* Micro-Trend / TikTok / High Conversion */

  { name: "🧸 Jellycat & Kawaii Plush", query: "jellycat plush keychain phone charm" },
  { name: "🧲 Magnetic Phone Mounts", query: "magnetic phone mount car desk holder" },
  { name: "🧬 Collagen & Peptide Masks", query: "collagen mask peptide sheet mask hydrogel mask" },
  { name: "🔋 Solar Power Banks", query: "solar power bank portable charger foldable solar" },
  { name: "🧘 Back Stretchers", query: "back stretcher spine decompressor yoga wheel" },
  { name: "🥟 Fusion Food Tools", query: "dumpling maker sushi roller scallion pancake maker" },
  { name: "🎧 ASMR & Sensory Kits", query: "slime kit kinetic sand jellyfish lamp" },
  { name: "💞 Long-Distance Touch", query: "long distance touch bracelet couple lamp" },
  { name: "🌱 Mini Hydroponics", query: "self watering planter led grow light hydroponic kit" },
  { name: "🛡 RFID Anti-Theft", query: "rfid blocking wallet anti theft wallet" },
  { name: "💅 LED Nail Lamps", query: "led nail lamp uv gel dryer" },
  { name: "☕ Portable Espresso", query: "portable espresso maker manual coffee grinder" },
  { name: "💍 Smart Ring Trackers", query: "smart ring fitness tracker sleep monitor" },
  { name: "🌀 Holographic Projectors", query: "holographic projector fan display" },
  { name: "🧪 Biohacking Stack", query: "nmn supplement resveratrol longevity" },
  { name: "🔥 Sauna Blankets", query: "infrared sauna blanket portable detox" },
  { name: "🪞 AR Makeup Mirrors", query: "smart makeup mirror ar virtual try on" }

];

/* ========== FETCH PRODUCTS ========== */
async function fetchProducts(query) {
  const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
  const data = await res.json();
  return data.items || [];
}

/* ========== FILTER VALID IMAGE ========== */
function validImage(item) {
  const img = item.pagemap?.cse_image?.[0]?.src;
  if (!img) return false;
  if (img.includes("gstatic")) return false;
  if (img.length < 10) return false;
  return img;
}

/* ========== STABLE DAILY RATING ========== */
function dailyRating() {
  return (4 + rng()).toFixed(1);
}

/* ========== CREATE CARD ========== */
function createCard(item) {
  const image = validImage(item);
  if (!image) return null;

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${image}" loading="lazy">
    <div class="card-content">
      <h3>${item.title}</h3>
      <div class="snippet">${item.snippet || ""}</div>
      <div class="rating">⭐ ${dailyRating()}</div>
      <div class="buttons">
        <button class="visit">Visit</button>
        <button class="add">Add</button>
      </div>
    </div>
  `;

  card.querySelector(".visit").onclick = () => {
    window.open(item.link, "_blank");
  };

  card.querySelector(".add").onclick = () => openSheet(item, image, card);

  return card;
}

/* ========== LOAD CATEGORIES ========== */
async function loadCategories() {
  const container = document.getElementById("categories");

  for (let cat of categories) {
    const section = document.createElement("div");
    section.className = "category";
    section.innerHTML = `<h2>${cat.name}</h2><div class="grid"></div>`;
    container.appendChild(section);

    const grid = section.querySelector(".grid");
    const items = await fetchProducts(cat.query);

    items.slice(0,8).forEach(item => {
      const card = createCard(item);
      if (card) grid.appendChild(card);
    });
  }
}

/* ========== SLIDE SHEET LOGIC ========== */
const overlay = document.getElementById("overlay");
const sheet = document.getElementById("sheet");

let currentProduct = null;
let currentCard = null;

function openSheet(item, image, card) {
  currentProduct = { ...item, image };
  currentCard = card;

  document.getElementById("editTitle").value = item.title;
  document.getElementById("editWhy").value = item.snippet || "";
  document.getElementById("editNote").value = "";

  overlay.style.display = "flex";
  setTimeout(() => sheet.classList.add("open"), 10);
}

function closeSheet() {
  sheet.classList.remove("open");
  setTimeout(() => overlay.style.display = "none", 300);
}

overlay.onclick = (e) => {
  if (e.target === overlay) closeSheet();
};

document.getElementById("saveProduct").onclick = () => {
  const title = document.getElementById("editTitle").value;
  const why = document.getElementById("editWhy").value;
  const note = document.getElementById("editNote").value;

  const stored = JSON.parse(localStorage.getItem("productWall") || "[]");

  stored.push({
    title,
    link: currentProduct.link,
    image: currentProduct.image,
    rating: dailyRating(),
    why,
    note,
    dateAdded: new Date().toISOString()
  });

  localStorage.setItem("productWall", JSON.stringify(stored));

  const addBtn = currentCard.querySelector(".add");
  addBtn.textContent = "Added ✓";
  addBtn.classList.add("added");
  addBtn.disabled = true;

  closeSheet();
};

/* ========== INIT ========== */
loadCategories();

</script>
</body>
</html>
