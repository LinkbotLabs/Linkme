<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkMe – Discover</title>

<style>
:root{
  --bg:#1c1c1e;
  --card:#2c2c2e;
  --accent:#0a84ff;
  --text:#f5f5f7;
  --muted:#9a9a9e;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  background:#141416;
  border-bottom:1px solid #2c2c2e;
}

header h1{
  font-size:20px;
  font-weight:600;
}

header button{
  background:var(--accent);
  border:none;
  padding:10px 16px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* SECTIONS */

.section{
  padding:40px 30px 10px;
}

.section h2{
  margin-bottom:20px;
  font-size:18px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:24px;
  padding:0 30px 50px;
}

/* CARD */

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:100%;
  border-radius:14px;
  margin-bottom:14px;
}

.card h3{
  margin:0 0 14px 0;
  font-size:15px;
}

.card-buttons{
  display:flex;
  gap:10px;
  margin-top:auto;
}

.card-buttons a,
.card-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.card-buttons a{
  background:#3a3a3c;
  color:white;
  text-align:center;
  text-decoration:none;
}

.card-buttons button{
  background:var(--accent);
  color:white;
}

.added{
  background:#30d158 !important;
}

/* FLOAT BUTTON */

#wallBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  background:var(--accent);
  color:white;
  padding:16px 24px;
  border-radius:50px;
  font-weight:600;
  border:none;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<header>
  <h1>🛍 Discover Products</h1>
  <button onclick="location.href='mywall.html'">My Wall</button>
</header>

<div id="sections"></div>

<button id="wallBtn" onclick="location.href='mywall.html'">
My Curated Wall (0)
</button>

<script>

const groups=[
  {heading:"🔥 Hot Today",query:"tiktok viral products"},
  {heading:"✨ Glow Up",query:"self care trending products"},
  {heading:"📱 Tech Finds",query:"aesthetic tech gadgets"},
  {heading:"✈️ Travel Picks",query:"travel essentials trending"}
];

let seenLinks = new Set();
let seenImages = new Set();
let seenTitles = new Set();

function normalize(text){
  return text.toLowerCase().replace(/[^a-z0-9]/g,"");
}

function updateCount(){
  const wall=JSON.parse(localStorage.getItem("linkme_wall")||"[]");
  document.getElementById("wallBtn").textContent=
    `My Curated Wall (${wall.length})`;
}

function getPlatform(link){
  if(link.includes("amazon")) return "amazon";
  if(link.includes("dhgate")) return "dhgate";
  if(link.includes("temu")) return "temu";
  return "other";
}

function addToWall(product){
  let wall=JSON.parse(localStorage.getItem("linkme_wall")||"[]");

  if(wall.some(p=>p.link===product.link)) return;

  wall.push(product);
  localStorage.setItem("linkme_wall",JSON.stringify(wall));
  updateCount();
}

function createCard(item){

  const cleanTitle = normalize(item.title);

  if(
    seenLinks.has(item.link) ||
    seenImages.has(item.image) ||
    seenTitles.has(cleanTitle)
  ){
    return null;
  }

  seenLinks.add(item.link);
  seenImages.add(item.image);
  seenTitles.add(cleanTitle);

  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
    <img src="${item.image}">
    <h3>${item.title}</h3>
    <div class="card-buttons">
      <a href="${item.link}" target="_blank">Visit</a>
      <button>Add</button>
    </div>
  `;

  const btn=card.querySelector("button");

  btn.onclick=()=>{
    addToWall({
      title:item.title,
      image:item.image,
      link:item.link,
      platform:getPlatform(item.link)
    });

    btn.textContent="Added ✓";
    btn.classList.add("added");
    btn.disabled=true;
  };

  return card;
}

async function render(){
  updateCount();
  const container=document.getElementById("sections");

  for(const group of groups){

    const section=document.createElement("div");
    section.className="section";
    section.innerHTML=`<h2>${group.heading}</h2>`;
    container.appendChild(section);

    const grid=document.createElement("div");
    grid.className="grid";
    container.appendChild(grid);

    const res=await fetch(`/api/search?q=${encodeURIComponent(group.query)}`);
    const data=await res.json();

    (data.items||[]).forEach(item=>{
      const card=createCard(item);
      if(card) grid.appendChild(card);
    });
  }
}

window.onload=render;

</script>
</body>
</html>
