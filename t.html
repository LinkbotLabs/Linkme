<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Themed Card</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<iframe id="frame"></iframe>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const themeEncoded = params.get("theme");

const iframe = document.getElementById("frame");

// Load original card
iframe.src = `/s.html?id=${id}`;

iframe.onload = () => {
  if (!themeEncoded) return;

  try {
    const theme = JSON.parse(atob(themeEncoded));

    const doc = iframe.contentDocument || iframe.contentWindow.document;

    // Apply theme to body
    if (theme.bg) doc.body.style.background = theme.bg;
    if (theme.text) doc.body.style.color = theme.text;

    // Apply to main card
    const card = doc.querySelector("#app > div");

    if (card) {
      if (theme.card) card.style.background = theme.card;
      if (theme.radius) card.style.borderRadius = theme.radius + "px";
      if (theme.text) card.style.color = theme.text;
    }

    // Buttons
    const buttons = doc.querySelectorAll("a, button");

    buttons.forEach(btn => {
      if (theme.accent) {
        btn.style.background = theme.accent;
        btn.style.color = "#fff";
      }
    });

  } catch (e) {
    console.log("Theme error", e);
  }
};
</script>

</body>
</html>
