<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Themed Card</title>
</head>

<body style="margin:0;">

<div id="app">Loading...</div>

<script type="module">
import { renderCard } from '/card.js';

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const themeEncoded = params.get("theme");

let theme = {};

if(themeEncoded){
  try {
    theme = JSON.parse(atob(themeEncoded));
  } catch(e){
    console.log("Theme error");
  }
}

async function load(){
  const res = await fetch(`/api/get?id=${id}`);
  const product = await res.json();

  document.body.style.background = theme.bg || "#111";

  document.getElementById("app").innerHTML =
    renderCard(product, theme);
}

load();
</script>

</body>
</html>
