<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Themed Card</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta property="og:type" content="website">
<meta property="og:title" content="🔥 Viral Product Card">
<meta property="og:description" content="See why this is trending now">
<meta property="og:image" content="" id="ogImage">

</head>

<body style="margin:0;">

<div id="app">Loading...</div>

<script type="module">
import { renderCard } from '/card.js';

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const themeEncoded = params.get("theme");

let theme = {};

/* ---------- LOAD THEME ---------- */
if(themeEncoded){
  try {
    theme = JSON.parse(atob(themeEncoded));

    // Save theme locally (so copy/share persists)
    localStorage.setItem(`theme_${id}`, themeEncoded);

  } catch(e){
    console.log("Theme decode error");
  }
} else {
  // fallback to saved theme if exists
  const saved = localStorage.getItem(`theme_${id}`);
  if(saved){
    try {
      theme = JSON.parse(atob(saved));
    } catch(e){}
  }
}

async function load(){

  if(!id){
    document.getElementById("app").innerHTML =
      "<p style='color:red;text-align:center;'>Missing product ID</p>";
    return;
  }

  const res = await fetch(`/api/get?id=${id}`);
  const product = await res.json();

  if(!product || product.error){
    document.getElementById("app").innerHTML =
      "<p style='color:red;text-align:center;'>Product not found</p>";
    return;
  }

  /* ---------- PAGE STYLE ---------- */
  document.body.style.background = theme.bg || "#f5f5f3";
  document.body.style.padding = "20px";
  document.body.style.display = "flex";
  document.body.style.justifyContent = "center";
  document.body.style.alignItems = "center";
  document.body.style.minHeight = "100vh";
  document.body.style.fontFamily = "Inter, sans-serif";

  /* ---------- OG IMAGE ---------- */
  document.getElementById("ogImage")
    .setAttribute("content", product.image);

  /* ---------- RENDER CARD ---------- */
  document.getElementById("app").innerHTML =
    renderCard(product, theme);

  /* =====================================================
     COPY LINK (THEMED URL)
  ====================================================== */
  const copyBtn = document.getElementById("copyBtn");
  if(copyBtn){
    copyBtn.addEventListener("click", () => {

      const themedURL = window.location.href;

      navigator.clipboard.writeText(themedURL);
      alert("Link copied!");

    });
  }

  /* =====================================================
     BUY BUTTON
  ====================================================== */
  const buyBtn = document.getElementById("buyBtn");
  if(buyBtn){
    buyBtn.addEventListener("click", () => {
      window.open(product.link, "_blank");
    });
  }

  /* =====================================================
     PINTEREST SHARE (SHARES THE THEMED PAGE)
  ====================================================== */
  const pinBtn = document.getElementById("pinBtn");

  if(pinBtn){
    pinBtn.addEventListener("click", () => {

      const url = encodeURIComponent(window.location.href); // themed link
      const media = encodeURIComponent(product.image);

      const desc = encodeURIComponent(
        `${product.title} 🔥 Trending viral product — tap to view the full card #amazonfinds #viralproducts`
      );

      const pinURL =
        `https://www.pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${desc}`;

      window.open(pinURL, "_blank");

    });
  }

}

load();
</script>

</body>
</html>
