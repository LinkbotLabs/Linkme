<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Float Rising – Viral Baby Product</title>
  
  <!-- Better Pinterest / Social Preview -->
  <meta name="description" content="Trending viral baby product loved by parents.">
  <meta property="og:title" content="Viral Baby Find 👶 | Float Rising"/>
  <meta property="og:description" content="Discover why parents are loving this trending baby product right now."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="https://floatrising.com/banner.jpg"/>
  <meta property="og:url" content="https://floatrising.com/"/>
  <meta name="twitter:card" content="summary_large_image"/>

  <link rel="icon" href="/float-rising-logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glow { box-shadow: 0 0 35px -10px rgb(236 72 153 / 0.5); }
  </style>
</head>
<body class="bg-[#0b0b0f] text-white min-h-screen">

  <div class="max-w-lg mx-auto px-5 py-10">

    <a href="/" class="inline-flex items-center gap-2 text-pink-400 hover:text-pink-300 mb-8">
      ← Back to Float Rising
    </a>

    <div id="productCard" class="bg-white/5 border border-white/10 rounded-3xl overflow-hidden min-h-[600px]">
      <div class="p-12 text-center">
        <div class="text-6xl mb-6">👶</div>
        <div class="text-xl">Loading viral baby find...</div>
      </div>
    </div>

  </div>

<script>
const DEFAULT_AFFILIATE_ID = "davidshort-21";

function appendAffiliate(url) {
  if (!url) return "#";
  return url.includes("tag=") ? url : 
    url + (url.includes("?") ? "&" : "?") + "tag=" + DEFAULT_AFFILIATE_ID;
}

function cleanTitle(title) {
  return (title || "Viral Baby Product")
    .replace(/Amazon\.com:?/gi,"")
    .replace(/\(.*?\)/g,"")
    .replace(/\|.*/g,"")
    .trim()
    .substring(0, 85);
}

// Get ID from URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadProduct() {
  const card = document.getElementById("productCard");

  if (!id) {
    card.innerHTML = `<div class="p-12 text-center text-red-400">Missing product ID.</div>`;
    return;
  }

  try {
    // Try multiple sources
    let product = null;
    const endpoints = ['/api/get?id=' + id, '/api/feed', '/api/search'];

    for (let endpoint of endpoints) {
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        
        const products = Array.isArray(data) ? data : (data.products || []);
        
        product = products.find(p => 
          (p.id && p.id == id) || 
          (p.asin && p.asin == id) ||
          (p.link && p.link.includes(id))
        );

        if (product) break;
      } catch(e) {}
    }

    if (!product) {
      card.innerHTML = `
        <div class="p-12 text-center">
          <div class="text-7xl mb-6">😕</div>
          <h2 class="text-3xl font-bold mb-3">Product Not Found</h2>
          <p class="text-gray-400 mb-8">This viral find may have expired.</p>
          <a href="/" class="inline-block bg-pink-500 hover:bg-pink-600 px-8 py-4 rounded-2xl font-bold">Browse All Baby Finds</a>
        </div>`;
      return;
    }

    // Update OG image dynamically
    const ogImage = document.querySelector('meta[property="og:image"]');
    if (ogImage && product.image) ogImage.setAttribute("content", product.image);

    const affLink = appendAffiliate(product.url || product.link);

    card.innerHTML = `
      <div class="relative">
        <img src="${product.image}" alt="${cleanTitle(product.title)}" 
             class="w-full h-[420px] object-cover">
        
        <div class="absolute top-5 left-5 bg-pink-500 text-white text-xs font-bold px-5 py-2 rounded-full">
          VIRAL BABY FIND 👶
        </div>
      </div>

      <div class="p-8">
        <h1 class="text-3xl font-extrabold leading-tight mb-4">
          ${cleanTitle(product.title)}
        </h1>

        <div class="text-pink-400 text-lg mb-6">🔥 Trending on TikTok & Amazon</div>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-6 text-gray-300 leading-relaxed mb-8">
          ${product.description ? product.description.replace(/\s+/g, ' ').substring(0, 220) : 'Popular baby product parents are loving right now.'}
        </div>

        <a href="${affLink}" target="_blank" rel="nofollow sponsored"
           class="block w-full py-6 text-center text-xl font-bold bg-gradient-to-r from-pink-500 to-cyan-500 rounded-3xl hover:scale-105 transition-all glow">
          👶 Shop on Amazon
        </a>

        <a href="/" class="block text-center text-gray-400 mt-6 hover:text-white">
          Discover More Viral Baby Finds →
        </a>
      </div>
    `;

  } catch (err) {
    console.error(err);
    card.innerHTML = `<div class="p-12 text-center text-red-400">Failed to load product. Please try again.</div>`;
  }
}

loadProduct();
</script>
</body>
</html>
