<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" href="/float-rising-logo.svg">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Float Rising Creator Product Cards</title>

<!-- Pinterest / Social Preview -->
<meta property="og:title" content="Viral Amazon Finds"/>
<meta property="og:description" content="Trending products people are discovering right now."/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="https://linkmetagshop.vercel.app/preview.jpg"/>
<meta property="og:url" content="https://linkmetagshop.vercel.app/"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="pinterest-rich-pin" content="true">
</head>

<body style="
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#f5f5f3,#eef2ff);
margin:0;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#111;
">

<div id="app" style="width:100%;max-width:420px;">Loading product...</div>

<script>

/* ---------- CLEAN AMAZON TITLES ---------- */

function cleanTitle(title){

if(!title) return "Trending Amazon Find";

return title
.replace(/Amazon\.com:?/gi,"")
.replace(/\(.*?\)/g,"")
.split(",")[0]
.trim()
.slice(0,60);

}

/* ---------- GENERATE BULLETS ---------- */
function generateBullets(title){

title = title.toLowerCase();

/* Phone accessories */

if(title.includes("phone") || title.includes("holder") || title.includes("mount")){
return `
📸 Perfect for photos and video<br>
📱 Hands-free viewing anywhere<br>
✈️ Great for flights, desks, and travel
`;
}

/* Model kits / Gundam */

if(title.includes("gundam") || title.includes("model") || title.includes("bandai")){
return `
🧩 Highly detailed collectible model<br>
🎨 Fun and relaxing to build<br>
⚙️ Poseable parts for display
`;
}

/* Kitchen gadgets */

if(title.includes("kitchen") || title.includes("slicer") || title.includes("cutter")){
return `
🍳 Makes cooking faster and easier<br>
⏱️ Saves time preparing meals<br>
🧼 Easy to clean and store
`;
}

/* Default fallback */

return `
🔥 Trending product people love<br>
⭐ Highly rated by shoppers<br>
✨ Popular viral Amazon find
`;

}



/* ---------- LOAD PRODUCT ---------- */

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(!id){

document.getElementById("app").innerHTML =
"<p style='color:red;'>Missing product ID.</p>";

}else{

fetch("/api/get?id="+id)

.then(res=>res.json())

.then(p=>{
document.querySelector('meta[property="og:image"]').setAttribute("content", p.image);
if(p.error||!p.title){

document.getElementById("app").innerHTML =
"<p style='color:red;'>Product not found or expired.</p>";

return;

}

/* ---------- SOCIAL PROOF ---------- */

const rating =
p.rating||(4.5+Math.random()*0.4).toFixed(1);

const reviews =
p.reviews||Math.floor(Math.random()*500+150);

const hooks=[

`This Product Is Going Viral 🔥`,
`TikTok Made This Go Viral`,
`Amazon Shoppers Love This`,
`Trending Amazon Find`,
`People Can't Stop Buying This`

];

const hook=hooks[Math.floor(Math.random()*hooks.length)];

/* ---------- PRODUCT CARD ---------- */

document.getElementById("app").innerHTML=`

<div style="
background:white;
border-radius:30px;
padding:30px 24px;
box-shadow:0 30px 70px rgba(0,0,0,0.12);
position:relative;
overflow:hidden;
">

<img src="/float-rising-logo.svg"
style="
position:absolute;
top:16px;
right:16px;
width:46px;
opacity:.9;
">

<div style="
position:absolute;
top:16px;
left:16px;
background:rgba(0,0,0,0.8);
color:white;
padding:6px 12px;
border-radius:999px;
font-size:11px;
letter-spacing:1px;
font-weight:600;
">
VIRAL FIND 🔥
</div>

<div style="
background:linear-gradient(135deg,#f6f7ff,#eef6ff);
padding:18px;
border-radius:22px;
margin-bottom:24px;
">

<img src="${p.image}"
style="
width:100%;
border-radius:18px;
display:block;
box-shadow:0 20px 50px rgba(0,0,0,0.18);
">

</div>

<div style="
font-family:'Playfair Display',serif;
font-size:24px;
text-align:center;
margin-bottom:10px;
line-height:1.3;
">

${cleanTitle(p.title)}

</div>

<div style="
text-align:center;
color:#6b7280;
margin-bottom:18px;
font-size:15px;
">

${hook}

</div>

<div style="
text-align:center;
font-size:15px;
margin-bottom:14px;
">

⭐ ${rating} • ${reviews}+ reviews

</div>

<div style="
font-size:14px;
line-height:1.7;
margin-top:10px;
margin-bottom:20px;
">

✨ Why You’ll Love It:<br><br>

${generateBullets(p.title)}

</div>
<div style="
text-align:center;
font-size:13px;
color:#ef4444;
margin-top:10px;
margin-bottom:8px;
font-weight:600;
">
🔥 ${Math.floor(Math.random()*80+20)} people viewed this today
</div>
<a href="${p.link}" target="_blank"
style="
display:block;
background:#111;
color:white;
padding:16px;
border-radius:18px;
text-align:center;
font-weight:700;
text-decoration:none;
margin:20px 0;
font-size:15px;
box-shadow:0 12px 25px rgba(0,0,0,0.2);
">

🔥 See Why This Is Going Viral

</a>

<button id="pinBtn"
style="
display:block;
width:100%;
background:#E60023;
color:white;
padding:14px;
border-radius:16px;
text-align:center;
font-weight:700;
border:none;
cursor:pointer;
margin-bottom:12px;
font-size:15px;
">

📌 Share This Viral Find

</button>

<a href="/"
style="
display:block;
text-align:center;
margin-top:12px;
font-size:14px;
color:#555;
text-decoration:none;
font-weight:500;
">

🔥 Next Viral Product

</a>

</div>

`;

/* ---------- PINTEREST SHARE ---------- */

document.getElementById("pinBtn").addEventListener("click",()=>{

const url=encodeURIComponent(window.location.href);

const media=encodeURIComponent(p.image);

const description=
encodeURIComponent(cleanTitle(p.title)+" 🔥 Viral Amazon Find");

const pinURL=
`https://www.pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${description}`;

window.open(pinURL,"_blank");

});

})

.catch(err=>{

console.error("Load error:",err);

document.getElementById("app").innerHTML=
"<p style='color:red;'>Error loading product.</p>";

});

}

</script>

</body>
</html>
