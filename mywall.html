<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Shop – Affiliate Storefront</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root{
  --primary:#ff7a9c;
  --dark:#111;
  --light:#f5f5f5;
  --muted:#777;
}

/* ===== BODY ===== */

body{
  margin:0;
  font-family: "Helvetica Neue", sans-serif;
  background:var(--light);
  color:#333;
  padding-bottom:120px;
}

/* ===== TOP NAV ===== */

.topbar{
  background:#fff;
  border-bottom:1px solid #eee;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:3px;
  color:var(--primary);
}

.nav-buttons{
  display:flex;
  gap:12px;
  align-items:center;
}

.nav-btn{
  background:#fff;
  border:1px solid #ddd;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

.nav-btn.primary{
  background:var(--primary);
  color:#fff;
  border:none;
}

/* ===== HERO ===== */

.hero{
  text-align:center;
  padding:80px 20px 50px;
  background:#fff;
}

.hero h1{
  font-size:60px;
  letter-spacing:6px;
  margin:0;
  color:var(--primary);
}

.hero p{
  margin-top:15px;
  color:var(--muted);
  font-size:18px;
}

/* ===== AFFILIATE BOX ===== */

#affiliatePopup{
  position:fixed;
  top:90px;
  right:40px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  width:280px;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

#affiliatePopup input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

/* ===== GRID ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:30px;
  max-width:1400px;
  margin:0 auto;
  padding:0 30px;
}

.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  transition:.3s;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.card-info{
  padding:18px;
}

.card-title{
  font-weight:700;
  margin-bottom:8px;
}

.card-buy{
  display:inline-block;
  margin-top:10px;
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
}

.card-remove-btn{
  margin-top:10px;
  background:#ff4444;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  cursor:pointer;
}

/* ===== SHARE MODAL ===== */

#shareModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

#shareModalContent{
  background:#fff;
  padding:30px;
  border-radius:12px;
  text-align:center;
  width:90%;
  max-width:400px;
}

#qrContainer{
  margin:20px auto;
  padding:10px;
  background:#fff;
}

button{
  cursor:pointer;
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="topbar">
  <div class="logo">LINKME</div>

  <div class="nav-buttons">
    <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
    <button class="nav-btn" onclick="toggleAffiliate()">Affiliate IDs</button>
    <button class="nav-btn primary" id="shareWallBtn">Share Shop</button>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <h1>LINKME</h1>
  <p>Curated viral finds & must-haves</p>
</section>

<!-- AFFILIATE POPUP -->
<div id="affiliatePopup">
  <input type="text" id="amazonAffiliate" placeholder="Amazon tag">
  <input type="text" id="temuAffiliate" placeholder="Temu tag">
  <input type="text" id="dhgateAffiliate" placeholder="DHGate ID">
  <button onclick="saveAffiliate()">Save</button>
</div>

<!-- GRID -->
<div class="grid" id="wallGrid"></div>

<!-- SHARE MODAL -->
<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Shop</h2>
    <div id="qrContainer"><div id="qrcode"></div></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button onclick="document.getElementById('shareModal').style.display='none'">Close</button>
  </div>
</div>

<script>
let isShared=false;
let currentWall=[];
let currentTags={};

/* ===== LOAD WALL ===== */

async function loadWallData(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get("id");

  if(id){
    const res=await fetch(`/api/getWall?id=${id}`);
    if(res.ok){
      const data=await res.json();
      currentWall=data.wall||[];
      currentTags=data.tags||{};
      isShared=true;
      return;
    }
  }

  currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
  currentTags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
}

/* ===== AFFILIATE ===== */

function toggleAffiliate(){
  const pop=document.getElementById("affiliatePopup");
  pop.style.display=pop.style.display==="block"?"none":"block";
}

function saveAffiliate(){
  currentTags={
    amazon:document.getElementById("amazonAffiliate").value.trim(),
    temu:document.getElementById("temuAffiliate").value.trim(),
    dhgate:document.getElementById("dhgateAffiliate").value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(currentTags));
  alert("Saved!");
  toggleAffiliate();
}

function buildAffiliateLink(link){
  if(!link) return "#";
  let url=new URL(link);

  if(url.hostname.includes("amazon") && currentTags.amazon)
    url.searchParams.set("tag",currentTags.amazon);

  if(url.hostname.includes("temu") && currentTags.temu)
    url.searchParams.set("aff_id",currentTags.temu);

  if(url.hostname.includes("dhgate") && currentTags.dhgate)
    url.searchParams.set("affid",currentTags.dhgate);

  return url.toString();
}

/* ===== RENDER ===== */

function renderWall(){
  const grid=document.getElementById("wallGrid");
  grid.innerHTML="";

  if(currentWall.length===0){
    grid.innerHTML="<p style='text-align:center;color:#777;'>Your shop is empty.</p>";
    return;
  }

  currentWall.forEach((item,idx)=>{
    const div=document.createElement("div");
    div.className="card";

    const aff=buildAffiliateLink(item.link);

    div.innerHTML=`
      <img src="${item.thumb||'https://via.placeholder.com/600'}">
      <div class="card-info">
        <div class="card-title">${item.title}</div>
        <a href="${aff}" target="_blank" class="card-buy">Shop Now</a>
        ${!isShared?`<button class="card-remove-btn" onclick="removeItem(${idx})">Remove</button>`:''}
      </div>
    `;

    grid.appendChild(div);
  });
}

function removeItem(idx){
  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.splice(idx,1);
  localStorage.setItem("productWall",JSON.stringify(wall));
  currentWall=wall;
  renderWall();
}

/* ===== SHARE ===== */

document.getElementById("shareWallBtn").addEventListener("click",async()=>{
  if(currentWall.length===0){alert("Add products first");return;}

  const res=await fetch("/api/saveWall",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({wall:currentWall,tags:currentTags})
  });

  const data=await res.json();
  const url=location.origin+"/mywall.html?id="+data.id;

  document.getElementById("shareModal").style.display="flex";
  document.getElementById("shareLinkDisplay").textContent=url;

  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{
    text:url,width:200,height:200
  });
});

document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(document.getElementById("shareLinkDisplay").textContent);
};

/* INIT */
(async()=>{
  await loadWallData();
  renderWall();
})();
</script>
</body>
</html>
