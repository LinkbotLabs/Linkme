<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
:root { --accent: #ffa500; --glow: #00FFFF; --text: #fff; --bg: #000; }

html, body {
  height: auto !important; min-height: 100vh; overflow-y: auto !important;
  padding-bottom: 160px !important; margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}

h1 { text-align:center; margin:10px 0 5px; color:#ffe169; font-size:2.2rem; cursor:pointer; }
h2 { color:#ffe169; margin:30px 5% 15px; font-size:1.6rem; }

.unlimited-banner {
  background: linear-gradient(135deg, #1fc27e, #39ff14);
  color: #000;
  padding: 16px;
  text-align: center;
  font-weight: 900;
  font-size: 18px;
  border-radius: 12px;
  margin: 10px 5% 20px;
  box-shadow: 0 0 20px rgba(31,194,126,0.6);
}

#affiliateIdDisplay { 
  text-align:center; font-weight:900; color:var(--accent); 
  text-shadow:0 0 15px var(--accent), 0 0 30px rgba(255,165,0,0.5); 
  margin:20px auto 30px; font-size:22px; cursor:pointer; 
  padding:16px 24px; background:rgba(255,165,0,0.18); 
  border:2px solid var(--accent); border-radius:16px; display:block; 
  box-shadow:0 0 25px rgba(255,165,0,0.6); transition: all 0.3s ease; 
  max-width:95%;
}
#affiliateIdDisplay:hover { transform: scale(1.04); box-shadow:0 0 40px var(--accent); background:rgba(255,165,0,0.28); }

.grid {
  column-count: 1;
  column-gap: 18px;
  padding: 0 5% 80px;
}
@media (min-width:640px) { .grid { column-count: 2; } }
@media (min-width:1024px) { .grid { column-count: 3; } }
@media (min-width:1400px) { .grid { column-count: 4; } }

.card {
  break-inside: avoid-column;
  margin-bottom: 18px;
  background: rgba(20,20,35,0.92);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
  position: relative;
}
.card:hover {
  transform: translateY(-12px) scale(1.03);
  box-shadow: 0 25px 60px rgba(255,165,0,0.35);
}
.card img {
  width: 100%; height: auto; display: block; cursor: pointer;
  transition: transform 0.4s ease;
}
.card:hover img { transform: scale(1.08); }

.card-content {
  padding: 14px 16px 16px;
}
.badge {
  position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 900; color: #000; z-index: 2;
}
.top-pick { background: #39ff14; }
.best-buy { background: #ff2d55; }
.recommended { background: #ffa500; }

.card-title { font-weight: 700; font-size: 15px; line-height: 1.3; margin: 8px 0 6px; }
.card-price { font-size: 18px; font-weight: 800; color: #39ff14; margin: 4px 0; }
.card-buy {
  display: block; margin-top: 12px; background: var(--accent); color: #000;
  text-align: center; padding: 12px; border-radius: 12px; font-weight: 900;
  font-size: 15px; text-decoration: none; transition: 0.3s;
}
.card-buy:hover { background: #ffe169; transform: scale(1.05); }

.top-picks {
  display: flex; gap: 16px; overflow-x: auto; padding: 10px 5% 20px;
  scrollbar-width: none;
}
.top-picks::-webkit-scrollbar { display: none; }
.top-card { flex: 0 0 260px; }

#quickModal {
  position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none;
  align-items:center; justify-content:center; z-index:3000;
}
#quickContent {
  background:rgba(20,20,35,0.98); border:3px solid var(--accent);
  border-radius:24px; max-width:420px; width:92%; padding:20px; color:#fff;
  box-shadow:0 0 80px rgba(255,165,0,0.6);
}

/* Keep your existing popup, toggle, socials, etc. styles unchanged */
#affiliatePopup, #affiliateToggle, .page-socials, #visitorCount, #homeBtn, #unlockOverlay, #shareModal, #shareWallBtn { /* your original styles here */ }
</style>
</head>
<body>

<h1 id="wallTitle">Tagshop Wall</h1>

<div id="heroBio" style="text-align:center; margin:0 5% 20px; font-size:15px; color:#ccc;">
  Curated unlimited affiliate finds ✨ Tap title to edit
</div>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password: <strong>tagshopme</strong> – enter once to unlock forever</span>
</div>

<div id="affiliateIdDisplay"></div>
<div id="visitorCount">Visitors: 0</div>

<button id="editToggle" style="position:fixed; top:20px; left:20px; background:rgba(0,0,0,0.7); color:var(--accent); border:2px solid var(--accent); padding:8px 16px; border-radius:12px; font-weight:700; z-index:10; display:none;">
  ✏️ Edit Wall
</button>

<h2 id="topPicksTitle" style="display:none;">🔥 Top Picks</h2>
<div id="topPicks" class="top-picks"></div>

<div class="grid" id="wallGrid"></div>

<button id="recBtn" style="display:block; margin:30px auto; padding:14px 32px; background:#39ff14; color:#000; border:none; border-radius:16px; font-weight:900; font-size:17px; cursor:pointer;">
  ✨ Generate Best Buys & Recommendations
</button>

<button id="shareWallBtn">🔗 Share Wall</button>

<!-- Your existing affiliate popup, social buttons, home btn, unlock overlay, share modal -->
<button id="affiliateToggle">💰 My Affiliate Tags</button>

<div id="affiliatePopup">
  <h2>Affiliate Activation</h2>
  <input type="text" id="amazonAffiliate" placeholder="Amazon tag (e.g., mytag-20)">
  <input type="text" id="temuAffiliate" placeholder="Temu tag">
  <input type="text" id="dhgateAffiliate" placeholder="DHGate ID (e.g., 2545671)">
  <button id="saveAffiliate">Activate & Save</button>
  <div id="affiliateOutput" style="margin-top:12px; font-size:14px; color:var(--accent); text-align:center;"></div>
</div>

<div class="page-socials">
  <button class="social-btn" onclick="window.open('https://facebook.com/@linkbotlabs','_blank')" title="F @linkbotlabs">F</button>
  <button class="social-btn" onclick="window.open('https://x.com/@linkbotlabs','_blank')" title="X @linkbotlabs">X</button>
  <button class="social-btn" onclick="window.open('https://tiktok.com/@linkbotlabs','_blank')" title="Tik @linkbotlabs">T</button>
  <button class="social-btn" onclick="window.open('https://youtube.com/@linkbotlabs','_blank')" title="YT @linkbotlabs">Y</button>
</div>

<button id="homeBtn" onclick="window.location.href='index.html'">Home</button>

<div id="unlockOverlay"> <!-- your existing unlock overlay code --> </div>

<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Wall</h2>
    <div id="qrContainer"><div id="qrcode"></div></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button id="closeShareBtn">Close</button>
  </div>
</div>

<div id="quickModal"></div>

<script>
// ====================== GLOBAL STATE ======================
let isShared = false;
let currentWall = [];
let currentTags = {};

// ====================== VISITOR COUNT ======================
let visitors = (parseInt(localStorage.getItem("visitorCount") || "0")) + 1;
localStorage.setItem("visitorCount", visitors);
document.getElementById("visitorCount").innerText = "Visitors: " + visitors;

// ====================== LOAD WALL ======================
async function loadWallData() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (id) {
    try {
      const res = await fetch(`/api/getWall?id=${id}`);
      if (res.ok) {
        const data = await res.json();
        currentWall = data.wall || [];
        currentTags = data.tags || {};
        isShared = true;
        return;
      }
    } catch (err) {
      console.error("Failed to load shared wall:", err);
    }
  }

  currentWall = JSON.parse(localStorage.getItem("productWall") || "[]");
  currentTags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  isShared = false;
}

// ====================== AFFILIATE HANDLING (unchanged) ======================
const popup = document.getElementById("affiliatePopup");
const toggleBtn = document.getElementById("affiliateToggle");
const affiliateDisplay = document.getElementById("affiliateIdDisplay");

affiliateDisplay.addEventListener("click", () => {
  if (!isShared) popup.style.display = popup.style.display === "block" ? "none" : "block";
});
toggleBtn.addEventListener("click", () => {
  if (!isShared) popup.style.display = popup.style.display === "block" ? "none" : "block";
});

function updateAffiliateDisplay() {
  const tags = currentTags;
  const active = [];
  if (tags.amazon) active.push("Amazon");
  if (tags.temu) active.push("Temu");
  if (tags.dhgate) active.push("DHGate");

  if (isShared) {
    affiliateDisplay.innerHTML = `🔗 Shared Wall • Affiliates: ${active.length ? active.join(" + ") : "None set"}`;
    affiliateDisplay.style.color = active.length ? "#39ff14" : "#ffa500";
  } else {
    if (active.length) {
      affiliateDisplay.innerHTML = `✅ Affiliates Active • ${active.join(" + ")}`;
      affiliateDisplay.style.color = "#39ff14";
      affiliateDisplay.style.borderColor = "#39ff14";
      toggleBtn.style.animation = "none";
    } else {
      affiliateDisplay.innerHTML = `💰 <span style="color:#ffeb3b;">SET YOUR AFFILIATE TAGS TO EARN COMMISSIONS!</span>`;
      affiliateDisplay.style.color = "#ffa500";
      affiliateDisplay.style.borderColor = "var(--accent)";
      toggleBtn.style.animation = "affiliatePulse 1.6s infinite";
    }
  }
  affiliateDisplay.style.display = "block";
}

function loadAffiliateTags() {
  if (isShared) return;
  const stored = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");

  const amazonTag = stored.amazon || "";
  const temuTag   = stored.temu   || "";
  const dhgateTag = stored.dhgate || "2545671";

  document.getElementById("amazonAffiliate").value = amazonTag;
  document.getElementById("temuAffiliate").value   = temuTag;
  document.getElementById("dhgateAffiliate").value = dhgateTag;

  localStorage.setItem("userAffiliateTags", JSON.stringify({amazon: amazonTag, temu: temuTag, dhgate: dhgateTag}));
  currentTags = {amazon: amazonTag, temu: temuTag, dhgate: dhgateTag};

  updateAffiliateDisplay();

  if (!amazonTag && !temuTag && !dhgateTag) {
    setTimeout(() => { if (!isShared) popup.style.display = "block"; }, 800);
  }
}

document.getElementById("saveAffiliate").addEventListener("click", () => {
  if (isShared) return;
  const amazon = document.getElementById("amazonAffiliate").value.trim();
  const temu = document.getElementById("temuAffiliate").value.trim();
  const dhgate = document.getElementById("dhgateAffiliate").value.trim();
  const tags = { amazon, temu, dhgate };

  localStorage.setItem("userAffiliateTags", JSON.stringify(tags));
  currentTags = tags;

  document.getElementById("affiliateOutput").innerHTML = "✅ Saved! You will now earn commissions on Amazon, Temu & DHGate.";
  setTimeout(() => document.getElementById("affiliateOutput").innerHTML = "", 5000);

  updateAffiliateDisplay();
  popup.style.display = "none";
});

// ====================== HELPERS ======================
function buildAffiliateLink(originalLink) {
  const tags = currentTags;
  if (!originalLink) return "#";
  let url;
  try { url = new URL(originalLink); } catch { return originalLink; }

  if (url.hostname.includes("amazon")) url.searchParams.set("tag", tags.amazon || "mychanneld-20");
  if (url.hostname.includes("temu.com") && tags.temu) url.searchParams.set("aff_id", tags.temu);
  if (url.hostname.includes("dhgate.com")) {
    const dh = tags.dhgate || "2545671";
    if (dh) url.searchParams.set("affid", dh);
  }
  return url.toString();
}

function getPlatform(link) {
  if (link.includes('amazon')) return 'Amazon';
  if (link.includes('temu')) return 'Temu';
  if (link.includes('dhgate')) return 'DHGate';
  return 'Store';
}

// ====================== RENDER WALL ======================
const wallGrid = document.getElementById("wallGrid");

function renderWall() {
  wallGrid.innerHTML = "";
  const hasProducts = currentWall.length > 0;

  if (!isShared && hasProducts) {
    wallGrid.innerHTML = `<div style="grid-column:1/-1; background:rgba(57,255,20,0.15); border:2px solid #39ff14; color:#39ff14; padding:16px; border-radius:16px; text-align:center; margin-bottom:25px; font-weight:700;">
      ✅ Your wall is LIVE! Ready to share everywhere
    </div>`;
  }

  if (!hasProducts) {
    wallGrid.innerHTML += `<p style='grid-column:1/-1;text-align:center;color:#888;font-size:15px;padding:40px;'>Add products from the main page to see the magic ✨</p>`;
    document.getElementById("topPicksTitle").style.display = "none";
    document.getElementById("editToggle").style.display = "none";
    document.getElementById("recBtn").style.display = "none";
    return;
  }

  document.getElementById("editToggle").style.display = "block";
  document.getElementById("recBtn").style.display = "block";

  // Top Picks
  const topPicksDiv = document.getElementById("topPicks");
  const topTitle = document.getElementById("topPicksTitle");
  topPicksDiv.innerHTML = "";
  const tops = currentWall.slice(0, 4);
  tops.forEach((item, i) => {
    const affLink = buildAffiliateLink(item.link);
    const div = document.createElement("div");
    div.className = "card top-card";
    div.innerHTML = `
      <span class="badge top-pick">TOP PICK</span>
      <img src="${item.thumb}" onclick="quickView(${i})">
      <div class="card-content">
        <div class="card-title">${item.title}</div>
        <div class="card-price">${item.price ? '$'+item.price : 'Shop Now'}</div>
        <a href="${affLink}" target="_blank" class="card-buy">Buy on ${getPlatform(item.link)}</a>
      </div>`;
    topPicksDiv.appendChild(div);
  });
  topTitle.style.display = hasProducts ? "block" : "none";

  // Main grid
  currentWall.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "card";
    const affLink = buildAffiliateLink(item.link);
    const isTop = idx < 4;
    let badge = isTop ? `<span class="badge top-pick">TOP PICK</span>` : '';
    if (!isTop && Math.random() > 0.65) badge = `<span class="badge best-buy">BEST BUY</span>`;
    if (!isTop && Math.random() > 0.85) badge = `<span class="badge recommended">RECOMMENDED</span>`;

    div.innerHTML = `
      ${badge}
      <img src="${item.thumb}" onclick="quickView(${idx})">
      <div class="card-content">
        <div class="card-title">${item.title}</div>
        <div class="card-price">${item.price ? '$'+item.price : 'View Price'}</div>
        <a href="${affLink}" target="_blank" class="card-buy">Buy Now →</a>
      </div>`;

    if (!isShared) {
      div.innerHTML += `<button class="card-remove-btn" onclick="removeItem(${idx});event.stopPropagation()" style="position:absolute;bottom:12px;right:12px;background:#ff4444;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;">Remove</button>`;
    }

    wallGrid.appendChild(div);
  });
}

function removeItem(idx) {
  if (isShared) return;
  currentWall.splice(idx, 1);
  localStorage.setItem("productWall", JSON.stringify(currentWall));
  renderWall();
}

function quickView(idx) {
  const item = currentWall[idx];
  if (!item) return;
  const affLink = buildAffiliateLink(item.link);
  document.getElementById("quickModal").innerHTML = `
    <div id="quickContent">
      <img src="${item.thumb}" style="width:100%;border-radius:16px;">
      <h2 style="margin:15px 0 8px;">${item.title}</h2>
      <p style="color:#39ff14;font-size:22px;font-weight:800;">${item.price ? '$'+item.price : ''}</p>
      <a href="${affLink}" target="_blank" style="display:block;margin:20px auto 10px;padding:16px;background:var(--accent);color:#000;text-align:center;border-radius:16px;font-weight:900;text-decoration:none;">Shop Now →</a>
      <button onclick="document.getElementById('quickModal').style.display='none'" style="width:100%;padding:12px;background:#444;border:none;border-radius:12px;color:#fff;cursor:pointer;">Close</button>
    </div>`;
  document.getElementById("quickModal").style.display = "flex";
}

// ====================== EDIT MODE (DRAG & DROP) ======================
let sortableInstance = null;
document.getElementById("editToggle").addEventListener("click", () => {
  const grid = document.getElementById("wallGrid");
  if (!sortableInstance) {
    sortableInstance = new Sortable(grid, {
      animation: 180,
      handle: ".card",
      onEnd: () => {
        const newOrder = Array.from(grid.children).map(card => {
          const btn = card.querySelector('.card-remove-btn');
          if (!btn) return null;
          const oldIdx = parseInt(btn.getAttribute('onclick').match(/\d+/)[0]);
          return currentWall[oldIdx];
        }).filter(Boolean);
        currentWall = newOrder;
        localStorage.setItem("productWall", JSON.stringify(currentWall));
        renderWall(); // refresh to show correct remove buttons
      }
    });
    document.getElementById("editToggle").textContent = "💾 Save Order";
  } else {
    sortableInstance.destroy();
    sortableInstance = null;
    document.getElementById("editToggle").textContent = "✏️ Edit Wall";
  }
});

// ====================== RECOMMENDATIONS ======================
document.getElementById("recBtn").addEventListener("click", () => {
  currentWall = currentWall.sort(() => Math.random() - 0.5);
  renderWall();
  alert("Wall refreshed! New Top Picks, Best Buys & Recommendations generated.");
});

// ====================== TITLE EDIT ======================
document.getElementById("wallTitle").addEventListener("click", () => {
  if (isShared) return;
  const newTitle = prompt("New wall title:", document.getElementById("wallTitle").innerText);
  if (newTitle && newTitle.trim()) {
    document.getElementById("wallTitle").innerText = newTitle.trim();
  }
});

// ====================== SHARE LOGIC ======================
const shareModal = document.getElementById("shareModal");
const shareLinkDisplay = document.getElementById("shareLinkDisplay");
const qrcodeDiv = document.getElementById("qrcode");
const copyBtn = document.getElementById("copyBtn");
const closeShareBtn = document.getElementById("closeShareBtn");

function showShareModal(url) {
  shareModal.style.display = "flex";
  shareLinkDisplay.textContent = url;

  qrcodeDiv.innerHTML = "";
  setTimeout(() => {
    try {
      new QRCode(qrcodeDiv, {
        text: url,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch(e) {
      console.error("QR failed", e);
      qrcodeDiv.innerHTML = `<p style="color:#f44;">QR error – use link</p>`;
    }
  }, 100);
}

copyBtn.onclick = () => {
  const text = shareLinkDisplay.textContent;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = "Copied!";
    setTimeout(() => copyBtn.textContent = "Copy Link", 2000);
  }).catch(() => alert("Copy failed"));
};

closeShareBtn.onclick = () => { shareModal.style.display = "none"; };

document.getElementById("shareWallBtn").addEventListener("click", async () => {
  if (isShared) {
    showShareModal(window.location.href);
    return;
  }

  if (currentWall.length === 0) {
    alert("Add some products first!");
    return;
  }

  try {
    const res = await fetch("/api/saveWall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wall: currentWall, tags: currentTags })
    });

    const data = await res.json();
    if (!data.id) {
      alert("Error creating share link.");
      return;
    }

    const cleanURL = window.location.origin + "/mywall.html?id=" + data.id;
    showShareModal(cleanURL);
  } catch (err) {
    console.error(err);
    alert("Share failed – check console.");
  }
});

// ====================== ADD TO WALL ======================
window.addToWall = function(title, thumb, link, price = null) {
  if (isShared) {
    alert("This is a shared wall (view-only). Create your own to add products!");
    return;
  }
  let wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  if (wall.length >= 50 && !localStorage.getItem("wallUnlocked")) {
    document.getElementById("unlockOverlay").style.display = "flex";
    return;
  }
  wall.push({title, thumb, link, price});
  localStorage.setItem("productWall", JSON.stringify(wall));
  currentWall = wall;
  renderWall();
};

document.getElementById("unlockBtn").addEventListener("click", () => {
  if (document.getElementById("unlockPassword").value.trim() === "tagshopme") {
    localStorage.setItem("wallUnlocked", "true");
    document.getElementById("unlockOverlay").style.display = "none";
    alert("✅ Wall unlocked! Unlimited items enabled.");
    renderWall();
  } else alert("Incorrect password.");
});

// ====================== INIT ======================
(async () => {
  await loadWallData();
  if (!isShared) loadAffiliateTags();
  updateAffiliateDisplay();
  renderWall();
})();
</script>
</body>
</html>
