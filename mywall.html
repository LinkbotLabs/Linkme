<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront</title>

<style>
:root {
  --bg1: #0f0c29;
  --bg2: #302b63;
  --bg3: #24243e;
  --accent: linear-gradient(135deg,#7f5af0,#2cb1ff);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  color: white;
  min-height:100vh;
}

/* HERO */

.hero {
  padding:80px 20px 60px;
  text-align:center;
}

.store-name {
  font-size:42px;
  font-weight:700;
  letter-spacing:1px;
  background: var(--accent);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* GRID */

.products-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:24px;
  padding:0 20px 60px;
  max-width:1200px;
  margin:auto;
}

/* CARD */

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-radius:18px;
  overflow:hidden;
  transition:0.3s ease;
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content {
  padding:16px;
}

.card h3 {
  font-size:16px;
  margin-bottom:6px;
}

.card p {
  font-size:13px;
  opacity:0.7;
  margin-bottom:14px;
  min-height:32px;
}

.btn {
  display:block;
  text-align:center;
  padding:10px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  background: var(--accent);
  color:white;
}

.footer {
  text-align:center;
  font-size:12px;
  opacity:0.4;
  padding-bottom:40px;
}
</style>
</head>

<body>

<div class="hero">
  <div class="store-name" id="storeName">My Picks</div>
</div>

<div class="products-grid" id="productsGrid"></div>

<div class="footer">
  Affiliate links may earn commission.
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const sharedId = urlParams.get("id");

// ===== LOAD STORE DATA =====
let storeData = JSON.parse(localStorage.getItem("productWall")) || [];

// Optional: If you later store storeName separately
let savedStoreName = localStorage.getItem("storeName");
if(savedStoreName){
  document.getElementById("storeName").innerText = savedStoreName;
}

// ===== RENDER PRODUCTS =====
const grid = document.getElementById("productsGrid");

if(storeData.length === 0){
  grid.innerHTML = "<p style='opacity:0.5'>No products yet.</p>";
} else {
  storeData.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${item.thumb}" alt="">
      <div class="card-content">
        <h3>${item.title}</h3>
        <p>${item.customWhy || ""}</p>
        <a class="btn" href="${item.link}" target="_blank">View Pick</a>
      </div>
    `;

    grid.appendChild(card);
  });
}
</script>

</body>
</html>
