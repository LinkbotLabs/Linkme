<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Affiliate Showcase</title>

<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<style>
:root { --accent:#ffe169; --text:#fff; --bg:#000; }

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  min-height:100vh;
  padding-bottom:160px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:20px 10px 10px;
}

.header h1{
  margin:0;
  color:var(--accent);
}

.back-btn{
  position:absolute;
  left:15px;
  top:20px;
  background:#000;
  color:var(--accent);
  border:2px solid var(--accent);
  border-radius:30px;
  padding:6px 14px;
  font-weight:700;
  text-decoration:none;
  font-size:14px;
}

.unlimited-banner{
  background:linear-gradient(135deg,#1fc27e,#39ff14);
  color:#000;
  padding:14px;
  text-align:center;
  font-weight:800;
  border-radius:12px;
  margin:10px 5% 20px;
  font-size:15px;
}

#affiliateIdDisplay{
  text-align:center;
  font-weight:800;
  margin:20px auto 25px;
  font-size:16px;
  cursor:pointer;
  padding:12px;
  border:2px solid var(--accent);
  border-radius:14px;
  max-width:95%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  padding:0 12px 80px;
}

.card{
  background:rgba(255,255,255,0.06);
  border-radius:12px;
  padding:8px;
  text-align:center;
}

.card img{
  max-width:100%;
  border-radius:8px;
}

.card-title{
  font-weight:bold;
  font-size:12px;
  margin-top:6px;
}

.card-buy{
  display:block;
  margin-top:6px;
  color:var(--accent);
  font-size:12px;
  text-decoration:none;
  font-weight:700;
}

.card-remove-btn{
  margin-top:6px;
  background:#ff4444;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:11px;
  padding:4px 8px;
  cursor:pointer;
}

#shareWallBtn{
  display:block;
  margin:30px auto;
  padding:14px 28px;
  font-size:16px;
  background:var(--accent);
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  color:#000;
}

#affiliateToggle{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#000;
  color:var(--accent);
  border:2px solid var(--accent);
  border-radius:40px;
  padding:12px 22px;
  font-weight:900;
  cursor:pointer;
}

#affiliatePopup{
  position:fixed;
  bottom:90px;
  right:10px;
  width:340px;
  max-width:94%;
  background:#111;
  border:2px solid var(--accent);
  border-radius:20px;
  padding:20px;
  display:none;
  z-index:1000;
}

#affiliatePopup input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#222;
  color:#fff;
}

#affiliatePopup button{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  font-weight:900;
  color:#000;
}

#shareModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

#shareModalContent{
  background:#111;
  padding:24px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:380px;
}

#shareLinkDisplay{
  background:#222;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  word-break:break-all;
  margin:16px 0;
}

.empty-state{
  text-align:center;
  color:#777;
  margin-top:40px;
  font-size:14px;
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">⬅ Builder</a>
  <h1>Tagshop Wall</h1>
</div>

<div class="unlimited-banner">
  Unlimited products. Share instantly.
</div>

<div id="affiliateIdDisplay">💰 Set Affiliate Tags</div>
<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall</button>
<button id="affiliateToggle">💰 My Affiliate Tags</button>

<div id="affiliatePopup">
  <input id="amazonAffiliate" placeholder="Amazon tag (mytag-20)">
  <input id="temuAffiliate" placeholder="Temu tag">
  <input id="dhgateAffiliate" placeholder="DHGate ID">
  <button id="saveAffiliate">Save</button>
</div>

<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Wall</h2>
    <div id="qrcode"></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button id="closeShareBtn">Close</button>
  </div>
</div>

<script>
const popup=document.getElementById("affiliatePopup");
const toggleBtn=document.getElementById("affiliateToggle");
const affiliateDisplay=document.getElementById("affiliateIdDisplay");
const wallGrid=document.getElementById("wallGrid");

const amazonInput=document.getElementById("amazonAffiliate");
const temuInput=document.getElementById("temuAffiliate");
const dhgateInput=document.getElementById("dhgateAffiliate");

toggleBtn.onclick=()=>popup.style.display=popup.style.display==="block"?"none":"block";
affiliateDisplay.onclick=toggleBtn.onclick;

function updateAffiliateDisplay(){
  const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  const active=[];
  if(tags.amazon)active.push("Amazon");
  if(tags.temu)active.push("Temu");
  if(tags.dhgate)active.push("DHGate");
  affiliateDisplay.textContent=active.length?
    "✅ Active: "+active.join(" + "):
    "💰 Set Affiliate Tags";
  amazonInput.value=tags.amazon||"";
  temuInput.value=tags.temu||"";
  dhgateInput.value=tags.dhgate||"";
}

document.getElementById("saveAffiliate").onclick=()=>{
  const tags={
    amazon:amazonInput.value.trim(),
    temu:temuInput.value.trim(),
    dhgate:dhgateInput.value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(tags));
  updateAffiliateDisplay();
  popup.style.display="none";
};

function buildAffiliateLink(link,tags){
  try{
    const url=new URL(link);
    if(tags.amazon&&url.hostname.includes("amazon"))
      url.searchParams.set("tag",tags.amazon);
    if(tags.temu&&url.hostname.includes("temu"))
      url.searchParams.set("aff_id",tags.temu);
    if(tags.dhgate&&url.hostname.includes("dhgate"))
      url.searchParams.set("affid",tags.dhgate);
    return url.toString();
  }catch{return link;}
}

function renderWall(){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  wallGrid.innerHTML="";
  if(!wall.length){
    wallGrid.innerHTML="<div class='empty-state'>Your wall is empty.<br>Add products from the builder.</div>";
    return;
  }
  wall.forEach((item,i)=>{
    const div=document.createElement("div");
    div.className="card";
    const aff=buildAffiliateLink(item.link,tags);
    div.innerHTML=`
      ${item.thumb?`<img src="${item.thumb}">`:""}
      <div class="card-title">${item.title}</div>
      <a class="card-buy" href="${aff}" target="_blank">Buy</a>
      <button class="card-remove-btn" onclick="removeItem(${i})">Remove</button>
    `;
    wallGrid.appendChild(div);
  });
}

window.removeItem=function(i){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.splice(i,1);
  localStorage.setItem("productWall",JSON.stringify(wall));
  renderWall();
};

document.getElementById("shareWallBtn").onclick=()=>{
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(!wall.length)return alert("Add products first.");
  const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  const compressed=LZString.compressToEncodedURIComponent(JSON.stringify({wall,tags}));
  const url=location.origin+location.pathname+"#data="+compressed;
  document.getElementById("shareLinkDisplay").textContent=url;
  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{text:url,width:200,height:200});
  document.getElementById("shareModal").style.display="flex";
};

document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(document.getElementById("shareLinkDisplay").textContent);
};

document.getElementById("closeShareBtn").onclick=()=>{
  document.getElementById("shareModal").style.display="none";
};

updateAffiliateDisplay();
renderWall();
</script>

</body>
</html>
