<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Shop – Linkme</title>

<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --border:#e5e5e7;
  --danger:#ff3b30;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  text-align:center;
  padding:60px 20px 30px;
}

.header h1{
  font-size:2.5rem;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 20px 100px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.card-body{
  padding:16px;
}

.title{
  font-weight:600;
  margin-bottom:6px;
}

.snippet{
  font-size:.9rem;
  color:var(--muted);
  margin-bottom:10px;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

a{
  text-decoration:none;
  flex:1;
}

.visit-btn{
  background:black;
  color:white;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:600;
}

.remove-btn{
  background:var(--danger);
  color:white;
  border:none;
  border-radius:10px;
  padding:10px;
  cursor:pointer;
}

.unlock{
  text-align:center;
  margin-bottom:30px;
}

input{
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
}
button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h1>My Shop</h1>
</div>

<div class="container">

<div class="unlock">
  <input type="password" id="unlockInput" placeholder="Enter unlock password">
  <button onclick="unlockWall()">Unlock</button>
</div>

<div class="grid" id="wallGrid"></div>

</div>

<script>
function unlockWall(){
  const val=document.getElementById("unlockInput").value.trim();
  if(val==="linkme"){
    localStorage.setItem("wallUnlocked","true");
    alert("Unlocked unlimited items.");
  }else{
    alert("Wrong password.");
  }
}

function renderWall(){
  const grid=document.getElementById("wallGrid");
  grid.innerHTML="";

  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");

  if(wall.length===0){
    grid.innerHTML="<p>Your shop is empty.</p>";
    return;
  }

  wall.forEach((item,index)=>{
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${item.thumb}">
      <div class="card-body">
        <div class="title">${item.title}</div>
        <div class="snippet">${item.snippet || ""}</div>
        <div class="actions">
          <a href="${item.link}" target="_blank">
            <div class="visit-btn">Visit</div>
          </a>
          <button class="remove-btn">X</button>
        </div>
      </div>
    `;

    card.querySelector(".remove-btn").onclick=()=>{
      wall.splice(index,1);
      localStorage.setItem("productWall",JSON.stringify(wall));
      renderWall();
    };

    grid.appendChild(card);
  });
}

window.onload=renderWall;
</script>
</body>
</html>
