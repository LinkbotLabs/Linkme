<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>

<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<style>
:root { --accent:#ffa500; --glow:#00FFFF; --text:#fff; --bg:#000; }

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  min-height:100vh;
  padding-bottom:160px;
}

h1{text-align:center;color:#ffe169;margin-bottom:10px;}

.unlimited-banner{
  background:linear-gradient(135deg,#1fc27e,#39ff14);
  color:#000;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  border-radius:12px;
  margin:10px 5% 20px;
}

#affiliateIdDisplay{
  text-align:center;
  font-weight:900;
  margin:20px auto 30px;
  font-size:20px;
  cursor:pointer;
  padding:14px 20px;
  border:2px solid var(--accent);
  border-radius:16px;
  max-width:95%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:8px;
  padding:0 10px 80px;
}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  padding:6px;
  text-align:center;
}

.card img{
  max-width:100%;
  border-radius:6px;
}

.card-title{font-weight:bold;font-size:12px;}
.card-buy{color:var(--accent);font-size:11px;text-decoration:none;}
.card-remove-btn{
  background:#ff4444;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:10px;
  padding:4px 8px;
  margin-top:4px;
  cursor:pointer;
}

#affiliateToggle{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#000;
  color:var(--accent);
  border:2px solid var(--accent);
  border-radius:40px;
  padding:12px 22px;
  font-weight:900;
  cursor:pointer;
}

#affiliatePopup{
  position:fixed;
  bottom:90px;
  right:10px;
  width:340px;
  max-width:94%;
  background:#111;
  border:2px solid var(--accent);
  border-radius:20px;
  padding:20px;
  display:none;
  z-index:1000;
}

#affiliatePopup input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#222;
  color:#fff;
}

#affiliatePopup button{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  font-weight:900;
}

#shareWallBtn{
  display:block;
  margin:30px auto;
  padding:14px 28px;
  font-size:16px;
  background:var(--accent);
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
}

#unlockOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

#unlockBox{
  background:#111;
  padding:20px;
  border-radius:16px;
  text-align:center;
  width:300px;
}

#shareModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

#shareModalContent{
  background:#111;
  padding:24px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:380px;
}

#shareLinkDisplay{
  background:#222;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  word-break:break-all;
  margin:16px 0;
}

button{cursor:pointer;}
</style>
</head>
<body>

<h1>Tagshop Wall</h1>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE<br>
  <span style="font-size:14px;">Password: <strong>tagshopme</strong></span>
</div>

<div id="affiliateIdDisplay"></div>
<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall</button>
<button id="affiliateToggle">💰 My Affiliate Tags</button>

<div id="affiliatePopup">
  <input id="amazonAffiliate" placeholder="Amazon tag (mytag-20)">
  <input id="temuAffiliate" placeholder="Temu tag">
  <input id="dhgateAffiliate" placeholder="DHGate ID">
  <button id="saveAffiliate">Save</button>
</div>

<div id="unlockOverlay">
  <div id="unlockBox">
    <h3>50 Item Limit</h3>
    <input type="password" id="unlockPassword" placeholder="Password">
    <button id="unlockBtn">Unlock</button>
  </div>
</div>

<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Wall</h2>
    <div id="qrcode"></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button id="closeShareBtn">Close</button>
  </div>
</div>

<script>
const popup=document.getElementById("affiliatePopup");
const toggleBtn=document.getElementById("affiliateToggle");
const affiliateDisplay=document.getElementById("affiliateIdDisplay");
const wallGrid=document.getElementById("wallGrid");

toggleBtn.onclick=()=>popup.style.display=popup.style.display==="block"?"none":"block";
affiliateDisplay.onclick=toggleBtn.onclick;

function updateAffiliateDisplay(){
  const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  const active=[];
  if(tags.amazon)active.push("Amazon");
  if(tags.temu)active.push("Temu");
  if(tags.dhgate)active.push("DHGate");
  affiliateDisplay.innerHTML=active.length?
    "✅ Active: "+active.join(" + "):
    "💰 Set Affiliate Tags";
}

document.getElementById("saveAffiliate").onclick=()=>{
  const tags={
    amazon:amazonAffiliate.value.trim(),
    temu:temuAffiliate.value.trim(),
    dhgate:dhgateAffiliate.value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(tags));
  updateAffiliateDisplay();
  popup.style.display="none";
};

function getSharedData(){
  const hash=location.hash.substring(1);
  if(hash.startsWith("data=")){
    try{
      const data=LZString.decompressFromEncodedURIComponent(hash.substring(5));
      return JSON.parse(data);
    }catch{}
  }
  return null;
}

function buildAffiliateLink(link,tags){
  if(!link)return "#";
  let url;
  try{url=new URL(link);}catch{return link;}
  if(tags.amazon&&url.hostname.includes("amazon"))
    url.searchParams.set("tag",tags.amazon);
  if(tags.temu&&url.hostname.includes("temu"))
    url.searchParams.set("aff_id",tags.temu);
  if(tags.dhgate&&url.hostname.includes("dhgate"))
    url.searchParams.set("affid",tags.dhgate);
  return url.toString();
}

function loadData(){
  const shared=getSharedData();
  if(shared)return{wall:shared.wall||[],tags:shared.tags||{},shared:true};
  return{
    wall:JSON.parse(localStorage.getItem("productWall")||"[]"),
    tags:JSON.parse(localStorage.getItem("userAffiliateTags")||"{}"),
    shared:false
  };
}

function renderWall(){
  const data=loadData();
  wallGrid.innerHTML="";
  if(!data.wall.length){
    wallGrid.innerHTML="<p style='text-align:center;color:#888;'>Wall empty</p>";
    return;
  }
  data.wall.forEach((item,i)=>{
    const div=document.createElement("div");
    div.className="card";
    const aff=buildAffiliateLink(item.link,data.shared?data.tags:JSON.parse(localStorage.getItem("userAffiliateTags")||"{}"));
    div.innerHTML=`
      ${item.thumb?`<img src="${item.thumb}">`:""}
      <div class="card-title">${item.title}</div>
      <a class="card-buy" href="${aff}" target="_blank">Buy</a>
      ${!data.shared?`<button class="card-remove-btn" onclick="removeItem(${i})">Remove</button>`:""}
    `;
    wallGrid.appendChild(div);
  });
}

window.removeItem=function(i){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.splice(i,1);
  localStorage.setItem("productWall",JSON.stringify(wall));
  renderWall();
};

window.addToWall=function(title,thumb,link){
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(wall.length>=50&&!localStorage.getItem("wallUnlocked")){
    unlockOverlay.style.display="flex";
    return;
  }
  wall.push({title,thumb,link});
  localStorage.setItem("productWall",JSON.stringify(wall));
  renderWall();
};

unlockBtn.onclick=()=>{
  if(unlockPassword.value==="tagshopme"){
    localStorage.setItem("wallUnlocked","true");
    unlockOverlay.style.display="none";
  }
};

shareWallBtn.onclick=()=>{
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  if(!wall.length)return alert("Add products first");
  const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  const compressed=LZString.compressToEncodedURIComponent(JSON.stringify({wall,tags}));
  const url=location.origin+location.pathname+"#data="+compressed;
  shareLinkDisplay.textContent=url;
  qrcode.innerHTML="";
  new QRCode(qrcode,{text:url,width:200,height:200});
  shareModal.style.display="flex";
};

copyBtn.onclick=()=>navigator.clipboard.writeText(shareLinkDisplay.textContent);
closeShareBtn.onclick=()=>shareModal.style.display="none";
shareModal.onclick=e=>{if(e.target===shareModal)shareModal.style.display="none";};

updateAffiliateDisplay();
renderWall();
</script>

</body>
</html>
