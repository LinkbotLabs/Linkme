<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Linkme Shop – Curated Viral Finds</title>

<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --text: #0f0f11;
  --muted: #6b7280;
  --accent: #000000;
  --border: #e2e8f0;
  --primary: #0066ff;     /* Slightly deeper 2026 blue */
  --primary-soft: #3b82f6;
  --danger: #ef4444;
  --success: #10b981;
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
  --radius-lg: 24px;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* Hero – more premium curated feel */
.hero {
  padding: 140px 20px 80px;
  text-align: center;
  background: linear-gradient(to bottom, #f8fafc, #ffffff);
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

#bannerPreview {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.12;
  z-index: 0;
  filter: blur(2px); /* subtle dreamy depth – 2026 trend */
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-soft), var(--primary));
  color: white;
  font-size: 3.5rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 28px;
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 1;
}

.header-group {
  position: relative;
  display: inline-block;
  z-index: 1;
}

#shopName {
  font-size: 2.8rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.5px;
}

#shopBio {
  font-size: 1.25rem;
  color: var(--muted);
  margin: 12px 0 0;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.edit-icon {
  position: absolute;
  right: -36px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--primary);
  font-size: 1.3rem;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.header-group:hover .edit-icon,
.header-group:focus-within .edit-icon {
  opacity: 0.8;
}

/* Affiliate – cleaner when collapsed */
details {
  max-width: 720px;
  margin: 48px auto;
  padding: 0;
  border: none;
  background: transparent;
}

details[open] {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}

summary {
  font-weight: 600;
  cursor: pointer;
  padding: 16px 24px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  list-style: none;
}

/* Grid – more spacious, magazine-like curation */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 40px;
  padding: 48px 5% 100px;
  max-width: 1400px;
  margin: 0 auto;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: var(--shadow-md);
}

.card img {
  width: 100%;
  aspect-ratio: 4 / 3.2;
  object-fit: cover;
  background: #f8fafc;
}

.price-badge, .platform-badge {
  position: absolute;
  top: 16px;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.price-badge { left: 16px; background: #000; color: #fff; }
.platform-badge { right: 16px; background: rgba(255,255,255,0.92); color: #111; border: 1px solid rgba(0,0,0,0.08); }

.card-content {
  padding: 24px;
}

.card-title {
  font-weight: 700;
  font-size: 1.32rem;
  margin-bottom: 10px;
  line-height: 1.3;
}

.card-why {
  font-size: 1rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 20px;
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  border-radius: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}

.btn-buy {
  background: var(--primary);
  color: white;
}

.btn-buy:hover { background: #0055dd; }

.btn-share {
  margin-left: 12px;
  background: #8b5cf6;
  color: white;
}

.btn-remove {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(239,68,68,0.9);
  color: white;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
}

/* Drawer / FAB – keep as is, but subtle polish */
#fab {
  background: var(--primary);
  box-shadow: 0 10px 30px rgba(0,102,255,0.28);
}

/* Shared view polish */
.shared .hero { padding-top: 100px; }
.shared #shopName, .shared #shopBio { cursor: default; }

/* Hide edit elements in shared view (already there + extras) */
.shared #fab,
.shared #drawer,
.shared details,
.shared #bannerUpload,
.shared #publishBtn,
.shared .edit-icon,
.shared .btn-remove,
.shared .btn-share {
  display: none !important;
}
</style>
</head>
<body>

<div class="hero">
  <div id="bannerPreview"></div>
  <div class="avatar">✨</div>
  
  <div class="header-group">
    <h1 id="shopName" contenteditable="true">My Linkme Shop</h1>
    <span class="edit-icon">✏️</span>
  </div>
  
  <div class="header-group">
    <p id="shopBio" contenteditable="true">Curated viral finds ✨ Hand-picked daily</p>
    <span class="edit-icon">✏️</span>
  </div>
  
  <input type="file" id="bannerUpload" accept="image/*" style="margin-top:28px; z-index:1; position:relative; font-size:0.95rem; color:var(--muted);">
</div>

<details id="affiliateBox">
  <summary>⚙ Affiliate Settings</summary>
  <input id="amazonTag" placeholder="Amazon Tag (-21)">
  <input id="dhgateTag" placeholder="DHgate ID">
  <input id="temuTag" placeholder="Temu ID">
  <button onclick="saveAffiliateTags()">Save</button>
</details>

<div class="grid" id="wallGrid"></div>

<button id="publishBtn">🔥 Publish My Shop</button>

<!-- Side Drawer (unchanged structure) -->
<div id="drawer">
  <div class="drawer-header">Tools & Settings</div>
  <div class="drawer-section">
    <button class="drawer-btn primary" onclick="document.getElementById('publishBtn').click()">Publish Shop</button>
  </div>
  <div class="drawer-section">
    <h4>Shop Details</h4>
    <button class="drawer-btn" onclick="alert('Edit name/bio directly in header')">Edit Name & Bio</button>
  </div>
  <div class="drawer-section">
    <h4>Affiliate</h4>
    <button class="drawer-btn" onclick="document.querySelector('details').open = true; document.getElementById('drawer').classList.remove('open'); document.querySelector('.drawer-backdrop').classList.remove('show');">Manage Affiliate IDs</button>
  </div>
  <div class="drawer-section">
    <button class="drawer-btn danger" onclick="if(confirm('Clear entire wall?')) { localStorage.removeItem('productWall'); location.reload(); }">Clear Wall</button>
  </div>
</div>

<div class="drawer-backdrop" onclick="closeDrawer()"></div>

<button id="fab" onclick="toggleDrawer()">⚙</button>

<!-- Per-card Edit Modal (unchanged) -->
<div id="editModal">
  <div id="editContent">
    <h3>Edit Product</h3>
    <input id="editTitle" placeholder="Product Title">
    <textarea id="editWhy" rows="4" placeholder="Why you should buy this... (3 lines recommended)"></textarea>
    <input id="editPrice" placeholder="Price (e.g. 29.99)" type="text">
    <div class="modal-buttons">
      <button style="flex:1; background:#ccc;" onclick="closeEditModal()">Cancel</button>
      <button style="flex:1; background:var(--primary); color:white;" onclick="saveCardEdit()">Save</button>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
// STATE & HELPERS (unchanged + minor)
// ──────────────────────────────────────────────

let isShared = false;
let currentWall = [];
let currentTags = {};
let editingIndex = -1;

const urlParams = new URLSearchParams(window.location.search);
const sharedId = urlParams.get("id");

if (sharedId) {
  document.body.classList.add("shared");
}

// Drawer (unchanged)
function toggleDrawer() { /* ... same as original */ }
function closeDrawer() { /* ... same */ }

// Header auto-save (unchanged)
const shopName = document.getElementById("shopName");
const shopBio = document.getElementById("shopBio");

shopName.addEventListener("blur", () => localStorage.setItem("shopName", shopName.innerText.trim()));
shopBio.addEventListener("blur", () => localStorage.setItem("shopBio", shopBio.innerText.trim()));

if (!shopName.innerText.trim()) shopName.innerText = "My Linkme Shop";
if (!shopBio.innerText.trim()) shopBio.innerText = "Curated viral finds ✨ Hand-picked daily";

// Affiliate (enhanced hide + save)
function saveAffiliateTags() {
  currentTags = {
    amazon: document.getElementById("amazonTag").value.trim(),
    dhgate: document.getElementById("dhgateTag").value.trim(),
    temu: document.getElementById("temuTag").value.trim()
  };
  localStorage.setItem("userAffiliateTags", JSON.stringify(currentTags));
  
  const hasTag = currentTags.amazon || currentTags.dhgate || currentTags.temu;
  if (hasTag) {
    document.getElementById("affiliateBox").open = false;
  }
  alert("Affiliate IDs saved" + (hasTag ? " ✓" : ""));
}

function buildAffiliateLink(url) { /* unchanged – already appends tag */ }
function getPlatform(url) { /* unchanged */ }

// ──────────────────────────────────────────────
// RENDER WALL – professional card + Share to Grok
// ──────────────────────────────────────────────

function renderWall() {
  const wallGrid = document.getElementById("wallGrid");
  wallGrid.innerHTML = "";

  currentWall.forEach((item, i) => {
    const aff = buildAffiliateLink(item.link); // always applies saved tags
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.index = i;
    card.innerHTML = `
      <img src="${item.thumb}" loading="lazy" alt="${item.title || 'Product'}">
      ${item.price ? `<div class="price-badge">$${item.price}</div>` : ""}
      <div class="platform-badge">${getPlatform(item.link)}</div>
      <div class="card-content">
        <div class="card-title">${item.title}</div>
        <div class="card-why">${item.customWhy || item.snippet || ""}</div>
        <div style="margin-top:16px;">
          <a href="${aff}" target="_blank" class="btn btn-buy">Shop Now</a>
          ${!isShared ? `
            <button class="btn btn-share" onclick="shareToGrokImagine(${i})">Share to Grok Imagine</button>
            <button class="btn btn-remove" onclick="removeItem(${i})">X</button>
          ` : ""}
        </div>
      </div>`;

    // Long-press edit (unchanged)
    let pressTimer;
    card.addEventListener("touchstart", e => { pressTimer = setTimeout(() => openEditModal(i), 600); });
    card.addEventListener("touchend", () => clearTimeout(pressTimer));
    card.addEventListener("contextmenu", e => { e.preventDefault(); openEditModal(i); });

    wallGrid.appendChild(card);
  });
}

// New: Share single edited product card to Grok Imagine
function shareToGrokImagine(index) {
  const item = currentWall[index];
  if (!item) return;

  const affLink = buildAffiliateLink(item.link);
  const priceText = item.price ? `$${item.price}` : "";
  const platform = getPlatform(item.link);

  const shareText = `Viral find from my curated shop ✨

${item.title}
${priceText} • ${platform}

${item.customWhy || item.snippet || ""}

→ ${affLink}

#ViralFinds #LinkmeShop`;

  // Open X intent (Grok reads from X) – user can then ask Grok to imagine/generate image
  const tweetUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
  window.open(tweetUrl, "_blank");

  // Optional tip
  alert("Shared! Paste into Grok chat:\n\nGenerate a stunning product image of: " + item.title);
}

// Edit modal (unchanged)
function openEditModal(index) { /* ... same */ }
function closeEditModal() { /* ... same */ }
function saveCardEdit() { /* ... same */ }

// Load – ensure tags always applied in shared view too
async function loadWall() {
  if (sharedId) {
    isShared = true;
    try {
      const res = await fetch("/api/getWall?id=" + sharedId);
      const data = await res.json();
      currentWall = data.wall || [];
      currentTags = data.tags || {};          // published tags → applied to links
      shopName.innerText = data.shopName || "Curated Shop";
      shopBio.innerText = data.shopBio || "";
      shopName.contentEditable = false;
      shopBio.contentEditable = false;
      if (data.shopBanner) {
        document.getElementById("bannerPreview").style.backgroundImage = `url(${data.shopBanner})`;
      }
    } catch (e) { console.error(e); }
  } else {
    currentWall = JSON.parse(localStorage.getItem("productWall") || "[]");
    currentTags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
    shopName.innerText = localStorage.getItem("shopName") || "My Linkme Shop";
    shopBio.innerText = localStorage.getItem("shopBio") || "Curated viral finds ✨ Hand-picked daily";
    const banner = localStorage.getItem("shopBanner");
    if (banner) document.getElementById("bannerPreview").style.backgroundImage = `url(${banner})`;
  }
  renderWall();
}

document.getElementById("publishBtn").onclick = async () => {
  if (isShared) return;
  if (!Object.values(currentTags).some(v => v)) {
    document.querySelector("details").open = true;
    alert("Add at least one affiliate ID before publishing.");
    return;
  }
  const id = Math.random().toString(36).substring(2, 10);
  await fetch("/api/saveWall", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id,
      wall: currentWall,
      tags: currentTags,
      shopName: shopName.innerText,
      shopBio: shopBio.innerText,
      shopBanner: localStorage.getItem("shopBanner") || ""
    })
  });
  const shareUrl = window.location.origin + "/mywall.html?id=" + id;
  alert("Shop published! Share this link:\n" + shareUrl);
  // Optional: show QR
  // const qrDiv = document.createElement("div"); document.body.appendChild(qrDiv); new QRCode(qrDiv, shareUrl);
};

// Banner upload (unchanged)
document.getElementById("bannerUpload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    document.getElementById("bannerPreview").style.backgroundImage = `url(${url})`;
    localStorage.setItem("shopBanner", url);
  };
  reader.readAsDataURL(file);
});

// Init
loadWall();
</script>
</body>
</html>
