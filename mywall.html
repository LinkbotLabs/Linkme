<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Shop – Editorial</title>

<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root{
  --bg:#f4f4f4;
  --card-bg:#ffffff;
  --accent:#ff7a9c;
  --text:#333;
  --muted:#777;
  --soft-border:#e8e8e8;
}

body{
  margin:0;
  font-family: "Helvetica Neue", sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== HEADER + NAV ===== */

.header{
  background:#fff;
  border-bottom:1px solid var(--soft-border);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:700;
  color:var(--accent);
}

.nav-tabs{
  display:flex;
  gap:30px;
}

.nav-tabs span{
  cursor:pointer;
  font-weight:500;
  color:var(--muted);
  transition:.3s;
}

.nav-tabs span:hover{
  color:var(--accent);
}

/* ===== GRID ===== */

.grid{
  column-count:3;
  column-gap:30px;
  padding:50px 60px;
}

@media(max-width:1100px){ .grid{ column-count:2; } }
@media(max-width:700px){ .grid{ column-count:1; } }

/* ===== CARD ===== */

.card{
  background:var(--card-bg);
  margin-bottom:30px;
  display:inline-block;
  width:100%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  display:block;
}

.card-content{
  padding:20px;
}

.card-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:8px;
}

.card-why{
  font-size:14px;
  color:var(--muted);
  margin-bottom:15px;
}

.card-actions{
  display:flex;
  gap:10px;
}

.card-shop-link{
  background:var(--accent);
  color:#fff;
  padding:8px 14px;
  border-radius:5px;
  text-decoration:none;
  font-size:13px;
}

.card-share-single{
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  padding:8px 14px;
  border-radius:5px;
  font-size:13px;
  cursor:pointer;
}

/* ===== SHARE MODAL ===== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  padding:40px;
  border-radius:10px;
  width:90%;
  max-width:500px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo" id="storeNameDisplay">My Linkme Shop</div>
  <div class="nav-tabs">
    <span>Home</span>
    <span>Fashion</span>
    <span>Beauty</span>
    <span>Travel</span>
    <span>Shop</span>
  </div>
</div>

<div class="grid" id="wallGrid"></div>

<div id="singleShareModal" class="modal">
  <div class="modal-box">
    <h2>Share Product</h2>
    <div id="singleQrcode"></div>
    <div id="singleShareLinkDisplay" style="margin:20px 0;"></div>
    <button onclick="document.getElementById('singleShareModal').style.display='none'">Close</button>
  </div>
</div>

<script>
let currentWall=[];
let currentTags={};
let isShared=false;

async function loadWall(){
  currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
  currentTags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
}

function buildAffiliateLink(link){
  if(!link) return "#";
  let url=new URL(link);
  if(url.hostname.includes("amazon") && currentTags.amazon)
    url.searchParams.set("tag",currentTags.amazon);
  return url.toString();
}

function renderWall(){
  const grid=document.getElementById("wallGrid");
  grid.innerHTML="";
  currentWall.forEach((item,idx)=>{
    const aff=buildAffiliateLink(item.link);
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${item.thumb||'https://via.placeholder.com/600'}">
      <div class="card-content">
        <div class="card-title">${item.customTitle||item.title}</div>
        <div class="card-why">${item.whyLike||item.snippet||''}</div>
        <div class="card-actions">
          <a href="${aff}" target="_blank" class="card-shop-link">Shop</a>
          <button class="card-share-single" onclick="shareSingle(${idx})">Share</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function shareSingle(idx){
  const item=currentWall[idx];
  const link=buildAffiliateLink(item.link);
  document.getElementById("singleShareLinkDisplay").textContent=link;
  document.getElementById("singleQrcode").innerHTML="";
  new QRCode(document.getElementById("singleQrcode"),{
    text:link,width:200,height:200
  });
  document.getElementById("singleShareModal").style.display="flex";
}

(async()=>{
  await loadWall();
  renderWall();
})();
</script>

</body>
</html>
