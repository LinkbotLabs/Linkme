<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Shop</title>

<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root{
  --accent:#ffa500;
  --bg:#000;
  --text:#fff;
  --muted:#aaa;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  padding-bottom:120px;
}

/* Shop Title */
.title-wrap{
  text-align:center;
  margin-top:30px;
}

#wallTitle{
  font-size:28px;
  font-weight:900;
  outline:none;
  border-bottom:2px dashed var(--accent);
  display:inline-block;
  padding:6px 12px;
}

/* Affiliate Box */
#affiliateBox{
  max-width:600px;
  margin:20px auto;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.15);
  padding:20px;
  border-radius:14px;
}

#affiliateBox input{
  width:100%;
  margin-bottom:10px;
  padding:8px;
  border-radius:6px;
  border:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
  padding:0 20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  padding:12px;
}

.card img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

.card-title{
  font-weight:700;
  margin:8px 0 4px;
}

.card-why{
  font-size:13px;
  color:var(--muted);
}

.card-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.btn{
  border:none;
  border-radius:6px;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
  font-weight:700;
}

.btn-buy{ background:var(--accent); color:#000; }
.btn-share{ background:#444; color:#fff; }
.btn-grok{ background:#00ffff; color:#000; }
.btn-remove{ background:#ff4444; color:#fff; }

#publishBtn{
  display:block;
  margin:40px auto;
  padding:16px 30px;
  font-size:18px;
  background:var(--accent);
  color:#000;
  border:none;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

.modal-box{
  background:#111;
  padding:24px;
  border-radius:14px;
  max-width:420px;
  width:90%;
  text-align:center;
}

#previewImage{
  width:100%;
  border-radius:10px;
  margin-bottom:12px;
}
</style>
</head>
<body>

<div class="title-wrap">
  <h1 id="wallTitle" contenteditable="true">My Linkme Shop</h1>
</div>

<div id="affiliateBox">
  <h3>Affiliate IDs</h3>
  <input id="amazonTag" placeholder="Amazon Associate Tag (e.g. yourtag-21)">
  <input id="dhgateTag" placeholder="DHgate Affiliate ID">
  <input id="temuTag" placeholder="Temu Affiliate ID">
  <button onclick="saveAffiliateTags()" class="btn btn-buy">Save Affiliate IDs</button>
</div>

<div class="grid" id="wallGrid"></div>

<button id="publishBtn">🔥 Publish My Shop</button>

<!-- Preview Modal -->
<div class="modal" id="previewModal">
  <div class="modal-box">
    <img id="previewImage">
    <h3 id="previewTitle"></h3>
    <p id="previewWhy"></p>
    <a id="previewBuy" target="_blank" class="btn btn-buy">Shop Now</a>
    <br><br>
    <button onclick="closePreview()" class="btn btn-share">Close</button>
  </div>
</div>

<!-- Share Modal -->
<div class="modal" id="shareModal">
  <div class="modal-box">
    <h3>Share Your Shop</h3>
    <div id="qrcode"></div>
    <p id="shareLink" style="word-break:break-all;font-size:12px;"></p>
    <button onclick="copyLink()" class="btn btn-buy">Copy Link</button>
    <br><br>
    <button onclick="closeShare()" class="btn btn-share">Close</button>
  </div>
</div>

<script>
let isShared=false;
let currentWall=[];
let currentTags={};
let currentShopName="My Linkme Shop";

const wallGrid=document.getElementById("wallGrid");
const urlParams=new URLSearchParams(window.location.search);
const sharedId=urlParams.get("id");

/* Affiliate Injection */
function buildAffiliateLink(url){
  try{
    if(url.includes("amazon.") && currentTags.amazon)
      return url+(url.includes("?")?"&":"?")+"tag="+currentTags.amazon;

    if(url.includes("dhgate.") && currentTags.dhgate)
      return url+(url.includes("?")?"&":"?")+"f="+currentTags.dhgate;

    if(url.includes("temu.") && currentTags.temu)
      return url+(url.includes("?")?"&":"?")+"af="+currentTags.temu;

    return url;
  }catch{ return url; }
}

/* Load Affiliate Tags */
function loadAffiliateTags(){
  const saved=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
  currentTags=saved;
  document.getElementById("amazonTag").value=saved.amazon||"";
  document.getElementById("dhgateTag").value=saved.dhgate||"";
  document.getElementById("temuTag").value=saved.temu||"";
}

function saveAffiliateTags(){
  const tags={
    amazon:document.getElementById("amazonTag").value.trim(),
    dhgate:document.getElementById("dhgateTag").value.trim(),
    temu:document.getElementById("temuTag").value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(tags));
  currentTags=tags;
  alert("Affiliate IDs saved!");
}

/* Load Wall */
async function loadWall(){
  if(sharedId){
    isShared=true;
    document.getElementById("affiliateBox").style.display="none";

    const res=await fetch("/api/getWall?id="+sharedId);
    const data=await res.json();

    currentWall=data.wall||[];
    currentTags=data.tags||{};
    currentShopName=data.shopName||"Shared Shop";

    document.getElementById("wallTitle").innerText=currentShopName;
    document.getElementById("wallTitle").contentEditable=false;
  }else{
    currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
    currentShopName=localStorage.getItem("shopName")||"My Linkme Shop";
    document.getElementById("wallTitle").innerText=currentShopName;
  }
  renderWall();
}

/* Save Shop Name */
document.getElementById("wallTitle").addEventListener("input",e=>{
  if(!isShared){
    currentShopName=e.target.innerText.trim();
    localStorage.setItem("shopName",currentShopName);
  }
});

/* Render Products */
function renderWall(){
  wallGrid.innerHTML="";
  if(currentWall.length===0){
    wallGrid.innerHTML="<p style='grid-column:1/-1;text-align:center;color:#888;'>No products yet.</p>";
    return;
  }

  currentWall.forEach((item,i)=>{
    const affLink=buildAffiliateLink(item.link);
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img src="${item.thumb}" onclick="openPreview(${i})">
      <div class="card-title">${item.title}</div>
      ${item.customWhy?`<div class="card-why">Why I picked this: ${item.customWhy}</div>`:""}
      <div class="card-actions">
        <a href="${affLink}" target="_blank" class="btn btn-buy">Buy</a>
        <button class="btn btn-share" onclick="shareProduct(${i})">Share</button>
        <button class="btn btn-grok" onclick="shareToGrok(${i})">Grok</button>
        ${!isShared?`<button class="btn btn-remove" onclick="removeItem(${i})">X</button>`:""}
      </div>
    `;
    wallGrid.appendChild(div);
  });
}

function removeItem(i){
  currentWall.splice(i,1);
  localStorage.setItem("productWall",JSON.stringify(currentWall));
  renderWall();
}

function openPreview(i){
  const item=currentWall[i];
  document.getElementById("previewImage").src=item.thumb;
  document.getElementById("previewTitle").innerText=item.title;
  document.getElementById("previewWhy").innerText=item.customWhy||"";
  document.getElementById("previewBuy").href=buildAffiliateLink(item.link);
  document.getElementById("previewModal").style.display="flex";
}

function closePreview(){
  document.getElementById("previewModal").style.display="none";
}

function shareProduct(i){
  navigator.clipboard.writeText(buildAffiliateLink(currentWall[i].link));
  alert("Product link copied!");
}

function shareToGrok(i){
  const item=currentWall[i];
  const text=`Create a viral product image and short promo video script for:\n\nTitle: ${item.title}\nWhy I picked it: ${item.customWhy||""}\nLink: ${buildAffiliateLink(item.link)}`;
  navigator.clipboard.writeText(text);
  window.open("https://grok.com","_blank");
}

document.getElementById("publishBtn").addEventListener("click",async()=>{
  if(currentWall.length===0) return alert("Add products first.");

  const id=Math.random().toString(36).substring(2,8);

  await fetch("/api/saveWall",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      id,
      wall:currentWall,
      tags:currentTags,
      shopName:currentShopName
    })
  });

  const shareURL=window.location.origin+"/mywall.html?id="+id;

  document.getElementById("shareLink").innerText=shareURL;
  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{
    text:shareURL,width:200,height:200
  });

  document.getElementById("shareModal").style.display="flex";
});

function closeShare(){
  document.getElementById("shareModal").style.display="none";
}

function copyLink(){
  navigator.clipboard.writeText(document.getElementById("shareLink").innerText);
  alert("Copied!");
}

loadAffiliateTags();
loadWall();
</script>

</body>
</html>
