<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Wall – Your Curated Storefront</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<style>
:root {
  --accent: #ffe169;
  --glow: #00ffff;
  --text: #fff;
  --muted: #ccc;
  --bg: #0a0a15;
  --glass: rgba(30,30,60,0.45);
  --stroke: rgba(255,255,255,0.15);
  --shadow: 0 20px 60px rgba(0,0,0,0.6);
}
body {
  background: linear-gradient(135deg, #000 0%, #0f001a 100%);
  color: var(--text);
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  margin: 0;
  padding-bottom: 180px;
}
h1 {
  text-align: center;
  color: #ffe169;
  font-size: 3rem;
  margin: 50px 0 10px;
  text-shadow: 0 0 40px rgba(255,225,105,0.5);
}
.affiliate-banner {
  background: rgba(57,255,20,0.15);
  border: 1px solid #39ff14;
  color: #39ff14;
  text-align: center;
  padding: 12px;
  margin: 0 5% 30px;
  border-radius: 16px;
  font-weight: 600;
  font-size: 1.05rem;
  display: none;
  box-shadow: 0 0 30px rgba(57,255,20,0.3);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 28px;
  max-width: 1480px;
  margin: 0 auto;
  padding: 0 24px 100px;
}
.card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--stroke);
  border-radius: 28px;
  overflow: hidden;
  transition: all 0.45s;
  box-shadow: var(--shadow);
  position: relative;
}
.card:hover {
  transform: translateY(-16px) scale(1.04);
  box-shadow: 0 40px 90px rgba(255,165,0,0.35);
}
.card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  transition: transform 0.6s;
}
.card:hover img { transform: scale(1.09); }
.card-content {
  padding: 24px;
}
.card-title {
  font-size: 1.45rem;
  font-weight: 700;
  margin: 0 0 10px;
  color: #ffe169;
  cursor: pointer;
}
.card-why {
  font-size: 1rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 20px;
  min-height: 3.2em;
  cursor: pointer;
}
.card-shop-link {
  display: inline-block;
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
  margin-top: 12px;
  transition: all 0.25s;
}
.card-shop-link:hover {
  color: #ffd14d;
  text-decoration: underline;
}
.platform-badge {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.75);
  color: var(--accent);
  padding: 8px 16px;
  border-radius: 14px;
  font-size: 0.95rem;
  font-weight: 800;
}
.remove-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  background: #ff4444;
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.95rem;
  display: none;
}
.card:hover .remove-btn { display: block; }
#affiliateModal, #shareModal, #unlockOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}
#affiliateContent, #shareModalContent, #unlockBox {
  background: rgba(30,30,60,0.98);
  border: 3px solid var(--accent);
  border-radius: 28px;
  padding: 40px;
  width: 92%;
  max-width: 520px;
  box-shadow: 0 0 80px rgba(255,165,0,0.6);
}
#affiliateContent h2, #shareModalContent h2 {
  color: var(--accent);
  margin: 0 0 24px;
  text-align: center;
  font-size: 1.8rem;
}
#amazonAffiliate, #temuAffiliate, #dhgateAffiliate {
  width: 100%;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 16px;
  border: 1px solid var(--accent);
  background: rgba(255,255,255,0.07);
  color: white;
  font-size: 1.05rem;
}
.saveAffiliateBtn {
  background: var(--accent);
  color: #000;
  padding: 18px;
  border: none;
  border-radius: 16px;
  font-weight: 900;
  font-size: 1.15rem;
  cursor: pointer;
  width: 100%;
  margin-top: 12px;
}
#homeBtn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(255,225,105,0.15);
  color: #ffe169;
  border: 2px solid #ffe169;
  border-radius: 50px;
  padding: 14px 28px;
  font-weight: 900;
  font-size: 1.1rem;
  cursor: pointer;
  z-index: 1000;
  box-shadow: 0 0 30px rgba(255,225,105,0.4);
  transition: all 0.3s;
}
#homeBtn:hover {
  background: #ffe169;
  color: #000;
  transform: scale(1.08);
}
#affiliateToggle, #shareWallBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 16px 32px;
  font-weight: 900;
  font-size: 1.15rem;
  cursor: pointer;
  box-shadow: 0 0 40px rgba(255,165,0,0.5);
  z-index: 1000;
}
#affiliateToggle:hover, #shareWallBtn:hover {
  transform: scale(1.08);
}
</style>
</head>
<body>

<div id="affiliateBanner" class="affiliate-banner"></div>

<h1 id="wallTitle">My Linkme Shop</h1>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Shop</button>
<button id="affiliateToggle">💰 Affiliate Tags</button>
<button id="homeBtn">← Home</button>

<!-- Affiliate Modal -->
<div id="affiliateModal">
  <div id="affiliateContent">
    <h2>Set Your Affiliate Tags</h2>
    <input type="text" id="amazonAffiliate" placeholder="Amazon tag (e.g., mytag-20)">
    <input type="text" id="temuAffiliate" placeholder="Temu tag">
    <input type="text" id="dhgateAffiliate" placeholder="DHgate ID (e.g., 2545671)">
    <button class="saveAffiliateBtn" id="saveAffiliate">Save & Activate</button>
    <button onclick="document.getElementById('affiliateModal').style.display='none'" style="margin-top:16px;background:#444;color:#fff;padding:16px;border:none;border-radius:16px;cursor:pointer;width:100%;">Cancel</button>
  </div>
</div>

<!-- Share Modal (unchanged) -->
<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Shop</h2>
    <div id="qrContainer"><div id="qrcode"></div></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button id="closeShareBtn">Close</button>
  </div>
</div>

<!-- Unlock Overlay (unchanged) -->
<div id="unlockOverlay">
  <div id="unlockBox">
    <!-- existing unlock content -->
  </div>
</div>

<script>
// ====================== GLOBAL STATE ======================
let isShared = false;
let currentWall = [];
let currentTags = {};
let editingIndex = -1;

// ====================== VISITOR COUNT ======================
let visitors = (parseInt(localStorage.getItem("visitorCount") || "0")) + 1;
localStorage.setItem("visitorCount", visitors);
document.getElementById("visitorCount").innerText = "Visitors: " + visitors;

// ====================== LOAD WALL ======================
async function loadWallData() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (id) {
    try {
      const res = await fetch(`/api/getWall?id=${id}`);
      if (res.ok) {
        const data = await res.json();
        currentWall = data.wall || [];
        currentTags = data.tags || {};
        isShared = true;
        return;
      }
    } catch (err) {
      console.error("Failed to load shared wall:", err);
    }
  }
  currentWall = JSON.parse(localStorage.getItem("productWall") || "[]");
  currentTags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  isShared = false;
}

// ====================== AFFILIATE HANDLING ======================
const affiliateModal = document.getElementById("affiliateModal");
const affiliateToggle = document.getElementById("affiliateToggle");
const affiliateBanner = document.getElementById("affiliateBanner");

affiliateToggle.addEventListener("click", () => {
  if (!isShared) affiliateModal.style.display = "flex";
});

document.getElementById("saveAffiliate").addEventListener("click", () => {
  if (isShared) return;
  const amazon = document.getElementById("amazonAffiliate").value.trim();
  const temu = document.getElementById("temuAffiliate").value.trim();
  const dhgate = document.getElementById("dhgateAffiliate").value.trim();
  const tags = { amazon, temu, dhgate };
  localStorage.setItem("userAffiliateTags", JSON.stringify(tags));
  currentTags = tags;

  // Show banner
  const active = [];
  if (amazon) active.push("Amazon");
  if (temu) active.push("Temu");
  if (dhgate) active.push("DHgate");
  affiliateBanner.innerHTML = active.length ? `Affiliates active: ${active.join(" • ")}` : "Affiliate tags saved!";
  affiliateBanner.style.display = "block";
  setTimeout(() => { affiliateBanner.style.display = "none"; }, 8000);

  affiliateModal.style.display = "none";
});

function updateAffiliateBanner() {
  const tags = currentTags;
  const active = [];
  if (tags.amazon) active.push("Amazon");
  if (tags.temu) active.push("Temu");
  if (tags.dhgate) active.push("DHgate");
  if (active.length) {
    affiliateBanner.innerHTML = `Affiliates active: ${active.join(" • ")}`;
    affiliateBanner.style.display = "block";
  }
}

// ====================== WALL RENDERING ======================
const wallGrid = document.getElementById("wallGrid");

function buildAffiliateLink(originalLink) {
  const tags = currentTags;
  if (!originalLink) return "#";
  let url;
  try { url = new URL(originalLink); } catch { return originalLink; }
  if (url.hostname.includes("amazon")) url.searchParams.set("tag", tags.amazon || "mychanneld-20");
  if (url.hostname.includes("temu.com") && tags.temu) url.searchParams.set("aff_id", tags.temu);
  if (url.hostname.includes("dhgate.com")) {
    const dh = tags.dhgate || "2545671";
    if (dh) url.searchParams.set("affid", dh);
  }
  return url.toString();
}

function renderWall() {
  wallGrid.innerHTML = "";
  if (isShared) {
    affiliateToggle.style.display = "none";
    wallGrid.innerHTML = `<div style="grid-column:1/-1;background:rgba(255,165,0,0.15);border:2px solid var(--accent);color:var(--accent);padding:20px;border-radius:20px;text-align:center;margin-bottom:30px;">
      🔗 Shared Linkme Shop<br><small>Affiliate links use sharer's tags</small><br>
      <button onclick="window.location.href = window.location.origin + window.location.pathname" style="margin-top:12px;padding:12px 28px;background:#000;color:var(--accent);border:2px solid var(--accent);border-radius:16px;cursor:pointer;">Create My Own Shop</button>
    </div>`;
  } else {
    affiliateToggle.style.display = "block";
  }

  if (currentWall.length === 0) {
    wallGrid.innerHTML += `<p style='grid-column:1/-1;text-align:center;color:#888;font-size:1.3rem;padding:60px 20px;'>Your shop is empty.<br>Add viral products from home!</p>`;
    return;
  }

  currentWall.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "card";
    const affLink = buildAffiliateLink(item.link);
    const platform = getPlatform(item.link); // assume getPlatform exists or add it

    const displayTitle = item.customTitle || item.title;
    const whyText = item.whyLike || item.snippet || "Trending must-have!";

    let html = `
      <img src="${item.thumb || 'https://via.placeholder.com/600x400?text=Product'}" alt="${displayTitle}">
      <div class="platform-badge">${platform}</div>
      ${!isShared ? `<button class="remove-btn" onclick="removeItem(${idx})">Remove</button>` : ''}
      <div class="card-content">
        <div class="card-title" onclick="editItem(${idx})">${displayTitle}</div>
        <div class="card-why" onclick="editItem(${idx})">${whyText}</div>
        ${item.price ? `<div style="font-size:1.1rem;color:#39ff14;margin:12px 0;">$${item.price}</div>` : ''}
        <a href="${affLink}" target="_blank" class="card-shop-link">Shop Now →</a>
      </div>
    `;
    div.innerHTML = html;
    wallGrid.appendChild(div);
  });
}

// ... keep editItem, removeItem, expandItem, unlock, share logic unchanged ...

// Add getPlatform if missing
function getPlatform(link) {
  if (link.includes('amazon')) return 'Amazon';
  if (link.includes('temu')) return 'Temu';
  if (link.includes('dhgate')) return 'DHgate';
  return 'Store';
}

// INIT
(async () => {
  await loadWallData();
  if (!isShared) {
    // Load tags and show banner if set
    const stored = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
    currentTags = stored;
    updateAffiliateBanner();
  }
  renderWall();
})();
</script>
</body>
</html>
