<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Curated Shop</title>

<style>
:root{
  --bg:#f8f8f8;
  --card:#fff;
  --text:#111;
  --muted:#6e6e73;
  --border:#e8e8ed;
  --accent:#000;
  --danger:#ff3b30;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.header{
  text-align:center;
  padding:80px 20px 40px;
}
.header h1{font-size:2.5rem;}
.controls{
  text-align:center;
  margin-bottom:40px;
}
input{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
}
button{
  padding:10px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
.primary{background:black;color:white;}

.grid{
  max-width:1200px;
  margin:auto;
  padding:0 30px 80px;
  display:grid;
  gap:30px;
}

@media(min-width:0px){.grid{grid-template-columns:1fr;}}
@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr);}}

.card{
  display:flex;
  gap:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
.card img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}
.info{
  flex:1;
}
.title{
  font-weight:600;
  margin-bottom:6px;
}
.why{
  color:var(--muted);
  font-size:.9rem;
  margin-bottom:10px;
}
.actions{
  display:flex;
  gap:10px;
}
.visit{
  flex:1;
  background:black;
  color:white;
  padding:10px;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
}
.remove{
  background:var(--danger);
  color:white;
  padding:10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>My Curated Shop</h1>
</div>

<div class="controls">
  <input id="affiliate" placeholder="Affiliate ID">
  <button class="primary" onclick="saveAffiliate()">Save</button>
  <button onclick="copyLink()">Copy Share Link</button>
</div>

<div class="grid" id="grid"></div>

<script>
let affiliate=localStorage.getItem("affiliateId")||"";
document.getElementById("affiliate").value=affiliate;

function saveAffiliate(){
  affiliate=document.getElementById("affiliate").value.trim();
  localStorage.setItem("affiliateId",affiliate);
  alert("Saved.");
}

function append(link){
  if(!affiliate) return link;
  const url=new URL(link);
  url.searchParams.set("ref",affiliate);
  return url.toString();
}

function copyLink(){
  const base=location.origin+location.pathname;
  navigator.clipboard.writeText(base+(affiliate?`?ref=${affiliate}`:""));
  alert("Copied.");
}

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const wall=JSON.parse(localStorage.getItem("productWall")||"[]");

  wall.forEach((item,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${item.thumb}">
      <div class="info">
        <div class="title">${item.title}</div>
        <div class="why">A curated pick worth considering.</div>
        <div class="actions">
          <a href="${append(item.link)}" target="_blank" class="visit">Visit Store</a>
          <button class="remove">Remove</button>
        </div>
      </div>
    `;
    card.querySelector(".remove").onclick=()=>{
      wall.splice(i,1);
      localStorage.setItem("productWall",JSON.stringify(wall));
      render();
    };
    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
