<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront</title>

<style>
:root {
  --accent: linear-gradient(135deg,#7f5af0,#2cb1ff);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
  background: linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#1b1f3a);
  background-size:400% 400%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

/* Soft radial glow overlay */
body::after {
  content:"";
  position:fixed;
  top:-200px;
  left:-200px;
  width:600px;
  height:600px;
  background:radial-gradient(circle,rgba(127,90,240,0.25),transparent 70%);
  filter:blur(80px);
  z-index:-1;
}

/* HERO */
.hero {
  padding:100px 20px 70px;
  text-align:center;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp 1s ease forwards;
}

.store-name {
  font-size:44px;
  font-weight:700;
  letter-spacing:1px;
  background: var(--accent);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* GRID */
.products-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:28px;
  padding:0 20px 80px;
  max-width:1200px;
  margin:auto;
}

/* CARD */
.card {
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(14px);
  border-radius:20px;
  overflow:hidden;
  transition:0.3s ease;
  opacity:0;
  transform:translateY(20px);
}

.card.show {
  opacity:1;
  transform:translateY(0);
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.card img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content {
  padding:18px;
}

.card h3 {
  font-size:16px;
  margin-bottom:6px;
}

.card p {
  font-size:13px;
  opacity:0.7;
  margin-bottom:14px;
  min-height:34px;
}

.btn {
  display:block;
  text-align:center;
  padding:10px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  background: var(--accent);
  color:white;
  transition:0.3s;
}

.btn:hover {
  opacity:0.9;
}

.footer {
  text-align:center;
  font-size:12px;
  opacity:0.4;
  padding-bottom:40px;
}

@keyframes fadeUp {
  to {
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="hero">
  <div class="store-name" id="storeName">My Picks</div>
</div>

<div class="products-grid" id="productsGrid"></div>

<div class="footer">
  Affiliate links may earn commission.
</div>

<script>
// ===== MODE DETECTION =====
const urlParams = new URLSearchParams(window.location.search);
const sharedMode = urlParams.get("id") !== null;

// ===== LOAD DATA =====
let products = JSON.parse(localStorage.getItem("productWall")) || [];
let savedStoreName = localStorage.getItem("storeName");

if(savedStoreName){
  document.getElementById("storeName").innerText = savedStoreName;
}

// ===== AFFILIATE INJECTION HOOK =====
// (Expand this later to inject Amazon/DHGate/Temu tags cleanly)
function injectAffiliate(link){
  return link; 
}

// ===== RENDER PRODUCTS =====
const grid = document.getElementById("productsGrid");

if(products.length === 0){
  grid.innerHTML = "<p style='opacity:0.5;text-align:center;width:100%'>No products yet.</p>";
} else {

  products.forEach((item,index) => {

    const card = document.createElement("div");
    card.className = "card";

    const finalLink = injectAffiliate(item.link);

    card.innerHTML = `
      <img src="${item.thumb}" alt="">
      <div class="card-content">
        <h3>${item.title}</h3>
        <p>${item.customWhy || ""}</p>
        <a class="btn" href="${finalLink}" target="_blank">View Pick</a>
      </div>
    `;

    grid.appendChild(card);

    // stagger animation
    setTimeout(()=>{
      card.classList.add("show");
    }, index * 120);
  });
}
</script>

</body>
</html>
