<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkMe Wall</title>

<style>
:root{
  --bg:#1c1c1e;
  --card:#2c2c2e;
  --accent:#0a84ff;
  --text:#f5f5f7;
  --muted:#9a9a9e;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  background:#141416;
  border-bottom:1px solid #2c2c2e;
}

header h1{
  font-size:20px;
  font-weight:600;
  outline:none;
}

.header-buttons{
  display:flex;
  gap:12px;
}

button{
  background:var(--accent);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-size:14px;
  transition:0.2s;
}

button.secondary{
  background:#3a3a3c;
}

button:hover{
  transform:translateY(-2px);
  opacity:0.9;
}

.grid{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:30px;
}

/* LANDSCAPE CARD */
.card{
  display:flex;
  gap:20px;
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:14px;
  flex-shrink:0;
}

.card-content{
  display:flex;
  flex-direction:column;
  flex:1;
}

.badge{
  font-size:12px;
  background:#3a3a3c;
  padding:4px 8px;
  border-radius:8px;
  display:inline-block;
  margin-bottom:8px;
  width:fit-content;
}

.card h3{
  margin:0 0 8px 0;
  font-size:18px;
}

.why{
  font-size:14px;
  color:var(--muted);
  margin-bottom:14px;
  line-height:1.5;
}

.card-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

.remove-btn{
  background:#ff453a;
}

/* MOBILE STACK */
@media(max-width:700px){
  .card{
    flex-direction:column;
  }

  .card img{
    width:100%;
    height:220px;
  }
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:var(--card);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
}

.modal-content input{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
  background:#3a3a3c;
  color:white;
}
</style>
</head>
<body>

<header>
  <h1 contenteditable="true" id="shopName">🛍 Your Curated Wall</h1>
  <div class="header-buttons">
    <button class="secondary" onclick="goHome()">Home</button>
    <button onclick="shareShop()">Share Shop</button>
    <button class="secondary" onclick="openAffiliate()">Affiliate</button>
    <button class="secondary" onclick="clearWall()">Clear</button>
  </div>
</header>

<div class="grid" id="wall"></div>

<div class="modal" id="affiliateModal">
  <div class="modal-content">
    <h3>Affiliate Settings</h3>
    <input id="amazonId" placeholder="Amazon Affiliate ID">
    <input id="dhgateId" placeholder="DHGate Affiliate ID">
    <input id="temuId" placeholder="Temu Affiliate ID">
    <button onclick="saveAffiliate()">Save</button>
  </div>
</div>

<script>
let wall = JSON.parse(localStorage.getItem("linkme_wall")) || [];
let affiliate = JSON.parse(localStorage.getItem("linkme_affiliate")) || {};

const grid = document.getElementById("wall");
const shopNameEl = document.getElementById("shopName");

/* SHOP NAME SAVE */
const savedName = localStorage.getItem("linkme_shopname");
if(savedName) shopNameEl.innerText = savedName;

shopNameEl.addEventListener("blur",()=>{
  localStorage.setItem("linkme_shopname", shopNameEl.innerText);
});

/* RENDER */
function render(){
  grid.innerHTML = "";

  if(!wall.length){
    grid.innerHTML = "<p style='color:#9a9a9e'>No products added yet.</p>";
    return;
  }

  wall.forEach((p,index)=>{
    const card = document.createElement("div");
    card.className="card";

    const finalLink = injectAffiliate(p.link,p.platform);

    card.innerHTML=`
      <img src="${p.image}" />
      <div class="card-content">
        <div class="badge">⭐ Premium Pick</div>
        <h3>${p.title}</h3>
        <div class="why">${p.why || autoWhy(p.title)}</div>
        <div class="card-buttons">
          <button onclick="visit('${finalLink}')">Visit</button>
          <button class="secondary" onclick="shareProduct('${p.title}','${finalLink}')">Share</button>
          <button class="secondary" onclick="editItem(${index})">Edit</button>
          <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* EDIT PRODUCT */
function editItem(i){
  const item = wall[i];
  const newTitle = prompt("Edit title:", item.title);
  if(newTitle !== null) item.title = newTitle;

  const newWhy = prompt("Edit description:", item.why || "");
  if(newWhy !== null) item.why = newWhy;

  localStorage.setItem("linkme_wall", JSON.stringify(wall));
  render();
}

/* AUTO DESCRIPTION */
function autoWhy(title){
  return `✨ ${title} levels up your setup instantly.\n🔥 Clean vibes, real impact.\n💎 Smart pick you won’t regret.`;
}

/* AFFILIATE */
function injectAffiliate(link, platform){
  if(platform==="amazon" && affiliate.amazonId){
    return link + "&tag=" + affiliate.amazonId;
  }
  if(platform==="dhgate" && affiliate.dhgateId){
    return link + "?aff=" + affiliate.dhgateId;
  }
  if(platform==="temu" && affiliate.temuId){
    return link + "?ref=" + affiliate.temuId;
  }
  return link;
}

function visit(link){
  window.open(link,"_blank");
}

function removeItem(i){
  wall.splice(i,1);
  localStorage.setItem("linkme_wall",JSON.stringify(wall));
  render();
}

function clearWall(){
  localStorage.removeItem("linkme_wall");
  wall=[];
  render();
}

/* SHARE PRODUCT */
function shareProduct(title,link){
  const text=`Check this out: ${title} ${link}`;
  if(navigator.share){
    navigator.share({text});
  }else{
    navigator.clipboard.writeText(text);
    alert("Copied!");
  }
}

/* FIXED SHARE SHOP */
async function shareShop(){
  try{
    const res = await fetch("/api/share",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({wall,affiliate})
    });

    if(!res.ok) throw new Error();

    const data = await res.json();
    const url = window.location.origin + "/mywall.html?id=" + data.id;

    if(navigator.share){
      await navigator.share({url});
    }else{
      await navigator.clipboard.writeText(url);
      alert("Shop link copied!");
    }

  }catch{
    alert("Share failed. Check API deployment.");
  }
}

function goHome(){
  window.location.href="index.html";
}

function openAffiliate(){
  document.getElementById("affiliateModal").style.display="flex";
}

function saveAffiliate(){
  affiliate={
    amazonId:amazonId.value,
    dhgateId:dhgateId.value,
    temuId:temuId.value
  };
  localStorage.setItem("linkme_affiliate",JSON.stringify(affiliate));
  affiliateModal.style.display="none";
}

/* LOAD SHARED */
async function loadShared(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get("id");
  if(id){
    const res=await fetch("/api/get?id="+id);
    const data=await res.json();
    wall=data.wall||[];
    affiliate=data.affiliate||{};
    render();
  }
}

loadShared();
render();
</script>

</body>
</html>
