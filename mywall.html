<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>

<link rel="stylesheet" href="uniform-dark-glass.css">

<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<style>
:root { --accent:#ffa500; --glow:#00ffff; --bg:#000; --text:#fff; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  padding-bottom:140px;
}

h1{ text-align:center; color:#ffe169; margin:20px 0; }

.unlimited-banner{
  background:linear-gradient(135deg,#1fc27e,#39ff14);
  color:#000;
  padding:14px;
  text-align:center;
  font-weight:900;
  border-radius:12px;
  margin:10px 5%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;
  padding:0 10px;
}

.card{
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  padding:6px;
  text-align:center;
}

.card img{
  max-width:100%;
  border-radius:6px;
  cursor:pointer;
}

.card-title{
  font-size:12px;
  font-weight:bold;
  margin-top:4px;
}

.card-buy{
  font-size:11px;
  color:var(--accent);
  text-decoration:none;
}

.card-remove-btn{
  margin-top:4px;
  background:#ff4444;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:10px;
  padding:3px 6px;
  cursor:pointer;
}

#affiliateToggle{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#000;
  color:var(--accent);
  border:2px solid var(--accent);
  border-radius:40px;
  padding:12px 20px;
  font-weight:900;
  cursor:pointer;
}

#shareWallBtn{
  display:block;
  margin:30px auto;
  padding:14px 26px;
  background:var(--accent);
  color:#000;
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
}

#affiliatePopup{
  position:fixed;
  bottom:90px;
  right:10px;
  width:340px;
  max-width:94%;
  background:#111;
  border:2px solid var(--accent);
  border-radius:18px;
  padding:20px;
  display:none;
  z-index:999;
}

#affiliatePopup input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

#affiliatePopup button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  font-weight:900;
}

#shareModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

#shareModalContent{
  background:#111;
  border:2px solid var(--accent);
  padding:24px;
  border-radius:20px;
  width:90%;
  max-width:380px;
  text-align:center;
}

#shareLinkDisplay{
  font-size:12px;
  margin:16px 0;
  word-break:break-all;
  background:#000;
  padding:10px;
  border-radius:8px;
}

#qrContainer{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:16px;
}

#unlockOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

#unlockBox{
  background:#111;
  border:2px solid var(--glow);
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:300px;
  text-align:center;
}
</style>
</head>

<body>

<h1>Tagshop Wall</h1>

<div class="unlimited-banner">
✅ UNLIMITED PRODUCTS FOR EVERYONE  
<br>Password: <strong>tagshopme</strong>
</div>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall</button>
<button id="affiliateToggle">💰 My Affiliate Tags</button>

<div id="affiliatePopup">
<h3>Affiliate Tags</h3>
<input type="text" id="amazonAffiliate" placeholder="Amazon tag (example-20)">
<input type="text" id="temuAffiliate" placeholder="Temu tag">
<input type="text" id="dhgateAffiliate" placeholder="DHGate ID">
<button id="saveAffiliate">Save</button>
</div>

<div id="shareModal">
<div id="shareModalContent">
<h3>Share Your Wall</h3>
<div id="qrContainer"><div id="qrcode"></div></div>
<div id="shareLinkDisplay"></div>
<button id="copyBtn">Copy Link</button>
<button onclick="document.getElementById('shareModal').style.display='none'">Close</button>
</div>
</div>

<div id="unlockOverlay">
<div id="unlockBox">
<h3>50 Item Limit</h3>
<p>Password: tagshopme</p>
<input type="password" id="unlockPassword" value="tagshopme">
<br><br>
<button id="unlockBtn">Unlock</button>
</div>
</div>

<script>
const wallGrid=document.getElementById("wallGrid");
const popup=document.getElementById("affiliatePopup");

document.getElementById("affiliateToggle").onclick=()=>{
popup.style.display=popup.style.display==="block"?"none":"block";
};

document.getElementById("saveAffiliate").onclick=()=>{
const tags={
amazon:document.getElementById("amazonAffiliate").value.trim(),
temu:document.getElementById("temuAffiliate").value.trim(),
dhgate:document.getElementById("dhgateAffiliate").value.trim()
};
localStorage.setItem("userAffiliateTags",JSON.stringify(tags));
popup.style.display="none";
};

function buildAffiliateLink(link){
const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
try{
let url=new URL(link);
if(url.hostname.includes("amazon")) url.searchParams.set("tag",tags.amazon||"mychanneld-20");
if(url.hostname.includes("temu.com")&&tags.temu) url.searchParams.set("aff_id",tags.temu);
if(url.hostname.includes("dhgate.com")&&tags.dhgate) url.searchParams.set("affid",tags.dhgate);
return url.toString();
}catch{return link;}
}

function renderWall(){
let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
wallGrid.innerHTML="";
if(wall.length===0){
wallGrid.innerHTML="<p style='grid-column:1/-1;text-align:center;color:#888;'>Your wall is empty</p>";
return;
}
wall.forEach((item,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`
<img src="${item.thumb}">
<div class="card-title">${item.title}</div>
<a href="${buildAffiliateLink(item.link)}" target="_blank" class="card-buy">Buy Now</a>
<button class="card-remove-btn" onclick="removeItem(${i})">Remove</button>
`;
wallGrid.appendChild(div);
});
}

function removeItem(i){
let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
wall.splice(i,1);
localStorage.setItem("productWall",JSON.stringify(wall));
renderWall();
}

document.getElementById("unlockBtn").onclick=()=>{
if(document.getElementById("unlockPassword").value==="tagshopme"){
localStorage.setItem("wallUnlocked","true");
document.getElementById("unlockOverlay").style.display="none";
}
};

document.getElementById("shareWallBtn").onclick=()=>{
let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
if(wall.length===0){alert("Add products first");return;}
const tags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
const payload=LZString.compressToEncodedURIComponent(JSON.stringify({wall,tags}));
const url=window.location.origin+window.location.pathname+"#data="+payload;
document.getElementById("shareLinkDisplay").innerText=url;
document.getElementById("shareModal").style.display="flex";
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{text:url,width:200,height:200});
};

document.getElementById("copyBtn").onclick=()=>{
navigator.clipboard.writeText(document.getElementById("shareLinkDisplay").innerText);
};

renderWall();
</script>

</body>
</html>
