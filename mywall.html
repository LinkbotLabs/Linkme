<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Shop – Your Curated Storefront</title>

<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root{
  --accent:#ffe169;
  --glow:#7f5af0;
  --bg:#0a0a15;
  --glass:rgba(30,30,60,0.45);
  --stroke:rgba(255,255,255,0.1);
  --text:#fff;
  --muted:#aaa;
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#000 0%,#0f001a 100%);
  color:var(--text);
  min-height:100vh;
  padding-bottom:150px;
}

/* ===== STORE HEADER ===== */

.shop-header{
  text-align:center;
  padding:60px 20px 40px;
  background:linear-gradient(180deg,#0d0d1f 0%,#0a0a15 100%);
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.creator-name{
  font-size:3rem;
  font-weight:800;
  color:var(--accent);
  display:inline-flex;
  gap:14px;
  align-items:center;
  text-shadow:0 0 40px rgba(255,225,105,0.3);
}

.creator-tagline{
  margin-top:12px;
  color:var(--muted);
  font-size:1.2rem;
}

#editStoreBtn{
  background:rgba(255,225,105,0.15);
  border:1px solid var(--accent);
  color:var(--accent);
  border-radius:12px;
  padding:6px 10px;
  cursor:pointer;
}

#editStoreBtn:hover{
  background:var(--accent);
  color:#000;
}

/* ===== GRID ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:32px;
  max-width:1600px;
  margin:50px auto 0;
  padding:0 24px;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--stroke);
  border-radius:28px;
  overflow:hidden;
  transition:.4s;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.card:hover{
  transform:translateY(-12px) scale(1.03);
  box-shadow:0 40px 100px rgba(127,90,240,0.4);
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
  transition:.6s;
}

.card:hover img{
  transform:scale(1.08);
}

.card-content{
  padding:24px;
}

.card-title{
  font-size:1.5rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:10px;
  cursor:pointer;
}

.card-why{
  color:var(--muted);
  margin-bottom:18px;
  cursor:pointer;
}

.card-actions{
  display:flex;
  gap:12px;
  justify-content:center;
}

.card-shop-link{
  background:var(--accent);
  color:#000;
  padding:12px 24px;
  border-radius:16px;
  font-weight:700;
  text-decoration:none;
}

.card-share-single{
  border:2px solid var(--accent);
  background:transparent;
  color:var(--accent);
  padding:12px 24px;
  border-radius:16px;
  cursor:pointer;
}

.platform-badge{
  position:absolute;
  top:18px;
  right:18px;
  background:rgba(0,0,0,0.7);
  padding:6px 14px;
  border-radius:14px;
  font-size:0.9rem;
  font-weight:700;
  color:var(--accent);
}

/* Buttons */

#shareWallBtn,#affiliateToggle,#homeBtn{
  position:fixed;
  bottom:20px;
  border:none;
  border-radius:50px;
  padding:14px 28px;
  font-weight:800;
  cursor:pointer;
}

#shareWallBtn{ right:180px; background:var(--accent); color:#000; }
#affiliateToggle{ right:20px; background:#7f5af0; color:#fff; }
#homeBtn{ left:20px; background:rgba(255,225,105,0.15); color:var(--accent); border:1px solid var(--accent); }

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

.modal-box{
  background:#1b1b2f;
  border:2px solid var(--accent);
  padding:40px;
  border-radius:24px;
  width:90%;
  max-width:500px;
}
</style>
</head>
<body>

<header class="shop-header">
  <div class="creator-name">
    <span id="storeNameDisplay">My Linkme Shop</span>
    <button id="editStoreBtn">✏️</button>
  </div>
  <div class="creator-tagline" id="storeTaglineDisplay">
    Curated viral finds & must-haves
  </div>
</header>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Shop</button>
<button id="affiliateToggle">💰 Affiliate Tags</button>
<button id="homeBtn" onclick="window.location.href='index.html'">← Home</button>

<div id="singleShareModal" class="modal">
  <div class="modal-box">
    <h2>Share Product</h2>
    <div id="singleQrcode"></div>
    <div id="singleShareLinkDisplay" style="margin:20px 0;"></div>
    <button id="singleCopyBtn">Copy Link</button>
    <button onclick="document.getElementById('singleShareModal').style.display='none'">Close</button>
  </div>
</div>

<script>
let currentWall=[];
let currentTags={};
let isShared=false;

/* ===== STORE NAME ===== */

const storeNameDisplay=document.getElementById("storeNameDisplay");
const storeTaglineDisplay=document.getElementById("storeTaglineDisplay");

function loadStoreBranding(){
  const n=localStorage.getItem("storeName");
  const t=localStorage.getItem("storeTagline");
  if(n) storeNameDisplay.textContent=n;
  if(t) storeTaglineDisplay.textContent=t;
}

document.getElementById("editStoreBtn").onclick=()=>{
  if(isShared) return;
  const n=prompt("Store name:",storeNameDisplay.textContent);
  if(n){ storeNameDisplay.textContent=n; localStorage.setItem("storeName",n); }
  const t=prompt("Tagline:",storeTaglineDisplay.textContent);
  if(t){ storeTaglineDisplay.textContent=t; localStorage.setItem("storeTagline",t); }
};

/* ===== LOAD WALL ===== */

async function loadWall(){
  const params=new URLSearchParams(location.search);
  const id=params.get("id");

  if(id){
    const res=await fetch(`/api/getWall?id=${id}`);
    if(res.ok){
      const data=await res.json();
      currentWall=data.wall||[];
      currentTags=data.tags||{};
      isShared=true;
      return;
    }
  }

  currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
  currentTags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
}

/* ===== AFFILIATE ===== */

function buildAffiliateLink(link){
  if(!link) return "#";
  let url=new URL(link);

  if(url.hostname.includes("amazon") && currentTags.amazon)
    url.searchParams.set("tag",currentTags.amazon);

  if(url.hostname.includes("temu") && currentTags.temu)
    url.searchParams.set("aff_id",currentTags.temu);

  if(url.hostname.includes("dhgate") && currentTags.dhgate)
    url.searchParams.set("affid",currentTags.dhgate);

  return url.toString();
}

/* ===== RENDER ===== */

function renderWall(){
  const grid=document.getElementById("wallGrid");
  grid.innerHTML="";

  if(currentWall.length===0){
    grid.innerHTML="<p style='text-align:center;color:#777;'>Your shop is empty.</p>";
    return;
  }

  currentWall.forEach((item,idx)=>{
    const card=document.createElement("div");
    card.className="card";
    card.style.position="relative";

    const aff=buildAffiliateLink(item.link);

    card.innerHTML=`
      <img src="${item.thumb||'https://via.placeholder.com/800x380'}">
      <div class="platform-badge">${item.platform||'Store'}</div>
      <div class="card-content">
        <div class="card-title">${item.customTitle||item.title}</div>
        <div class="card-why">${item.whyLike||item.snippet||''}</div>
        <div class="card-actions">
          <a href="${aff}" target="_blank" class="card-shop-link">Shop Now</a>
          ${!isShared?`<button class="card-share-single" onclick="shareSingle(${idx})">Share</button>`:''}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ===== SHARE SINGLE ===== */

function shareSingle(idx){
  const item=currentWall[idx];
  const link=buildAffiliateLink(item.link);

  document.getElementById("singleShareLinkDisplay").textContent=link;
  document.getElementById("singleQrcode").innerHTML="";
  new QRCode(document.getElementById("singleQrcode"),{
    text:link,width:200,height:200
  });

  document.getElementById("singleShareModal").style.display="flex";
}

/* INIT */
(async()=>{
  await loadWall();
  loadStoreBranding();
  renderWall();
})();
</script>

</body>
</html>
