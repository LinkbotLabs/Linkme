<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root { --accent: #ffa500; --glow: #00FFFF; --text: #fff; --bg: #000; }

html, body {
  height: auto !important;
  min-height: 100vh;
  overflow-y: auto !important;
  padding-bottom: 160px !important;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui;
}

h1 { text-align:center; margin-bottom:10px; color:#ffe169; }

/* New unlimited banner */
.unlimited-banner {
  background: linear-gradient(135deg, #1fc27e, #39ff14);
  color: #000;
  padding: 16px;
  text-align: center;
  font-weight: 900;
  font-size: 18px;
  border-radius: 12px;
  margin: 10px 5% 20px;
  box-shadow: 0 0 20px rgba(31,194,126,0.6);
}

#affiliateIdDisplay { 
  text-align:center; font-weight:900; color:var(--accent); 
  text-shadow:0 0 15px var(--accent), 0 0 30px rgba(255,165,0,0.5); 
  margin:20px auto 30px; font-size:22px; cursor:pointer; 
  padding:16px 24px; background:rgba(255,165,0,0.18); 
  border:2px solid var(--accent); border-radius:16px; display:block; 
  box-shadow:0 0 25px rgba(255,165,0,0.6); transition: all 0.3s ease; 
  max-width:95%;
}
#affiliateIdDisplay:hover { transform: scale(1.04); box-shadow:0 0 40px var(--accent); background:rgba(255,165,0,0.28); }

.grid { 
  display:grid; 
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); 
  gap:8px; 
  margin-top:20px; 
  padding-bottom:80px; 
}

.card { 
  background:rgba(0,0,0,0.35); 
  border:1px solid rgba(255,255,255,0.12); 
  border-radius:12px; 
  padding:8px; 
  text-align:center; 
  position:relative; 
}
.card img { 
  max-width:100%; 
  border-radius:6px; 
  cursor:pointer; 
  transition:0.3s; 
  display:block; 
  margin:0 auto; 
}
.card img:hover { transform:scale(1.05); }

.card-info { font-size:12px; margin:4px 0; }
.card-title { font-weight:bold; margin:4px 0 6px; }
.card-niche {
  background: rgba(255,225,105,0.2);
  color: #ffe169;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 6px;
  font-weight: 600;
}
.card-summary {
  font-size: 12.5px;
  color: #cfcfcf;
  line-height: 1.4;
  margin: 4px 0 10px;
  text-align: left;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-buy { 
  color:var(--accent); 
  font-size:11px; 
  text-decoration:none; 
  font-weight:600; 
}
.card-remove-btn { 
  margin-top:6px; background:#ff4444; color:#fff; border:none; border-radius:4px; 
  cursor:pointer; font-size:10px; padding:3px 8px; font-weight:bold; 
  display:inline-block; 
}

button { margin-top:4px; background:var(--glow); border:none; border-radius:6px; cursor:pointer; color:#000; font-weight:700; padding:4px 8px; font-size:12px; }

/* Item Modal */
#itemModal {
  position:fixed; inset:0; background:rgba(0,0,0,0.96); 
  display:none; justify-content:center; align-items:center; 
  z-index:2500; padding:20px; box-sizing:border-box;
}
#itemModal .modal-content {
  background:rgba(20,20,30,0.98); border:2px solid var(--accent); 
  border-radius:20px; max-width:440px; width:100%; max-height:92vh; 
  overflow:auto; box-shadow:0 0 60px rgba(255,165,0,0.4);
}
#itemModal img { width:100%; border-radius:12px; margin-bottom:16px; cursor:pointer; }
#itemModal h2 { margin:0 0 8px; color:#ffe169; font-size:18px; }
#itemModal .modal-niche { color:#39ff14; font-size:13px; font-weight:700; margin-bottom:12px; }
#itemModal p { color:#ddd; font-size:14.5px; line-height:1.5; margin-bottom:20px; }

#affiliatePopup, #shareModal, #unlockOverlay { /* existing styles unchanged */ }

/* rest of your existing styles stay exactly the same */
#affiliatePopup { 
  position:fixed; bottom:90px; right:10px; width:360px; max-width:94%; 
  background:rgba(0,0,0,0.97); backdrop-filter:blur(20px); border:3px solid var(--accent); 
  border-radius:20px; padding:24px; z-index:999; color:#fff; display:none; 
  box-shadow:0 0 40px var(--accent), 0 15px 50px rgba(0,0,0,0.9), 0 0 80px rgba(0,255,255,0.15); 
}
#shareModal { /* ... your existing share modal styles ... */ }
/* (all your other CSS remains untouched) */
</style>
</head>
<body>

<!-- Your existing HTML (header, banner, affiliate display, grid, buttons, modals, etc.) stays exactly the same until the script -->

<h1 id="wallTitle">Tagshop Wall</h1>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password: <strong>tagshopme</strong> – enter once to unlock forever</span>
</div>

<div id="affiliateIdDisplay"></div>
<div id="visitorCount">Visitors: 0</div>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall</button>

<button id="affiliateToggle">💰 My Affiliate Tags</button>

<!-- ... your existing affiliatePopup, socials, homeBtn, unlockOverlay, shareModal ... -->

<!-- NEW ITEM DETAIL MODAL -->
<div id="itemModal">
  <div class="modal-content">
    <div style="padding:20px;">
      <img id="modalThumb" onclick="this.requestFullscreen ? this.requestFullscreen() : this.webkitRequestFullscreen();">
      <h2 id="modalTitle"></h2>
      <div id="modalNiche" class="modal-niche"></div>
      <p id="modalSummary"></p>
      <a id="modalBuyLink" href="#" target="_blank">🛍️ Buy Now with Affiliate</a>
      <button onclick="closeItemModal()" style="width:100%; background:#444; color:#fff; border:none; padding:12px; border-radius:12px; font-size:15px; cursor:pointer; margin-top:8px;">Close</button>
    </div>
  </div>
</div>

<script>
// ====================== GLOBAL STATE ======================
let isShared = false;
let currentWall = [];
let currentTags = {};

// ====================== VISITOR COUNT ======================
let visitors = (parseInt(localStorage.getItem("visitorCount") || "0")) + 1;
localStorage.setItem("visitorCount", visitors);
document.getElementById("visitorCount").innerText = "Visitors: " + visitors;

// ====================== LOAD WALL ======================
async function loadWallData() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (id) {
    try {
      const res = await fetch(`/api/getWall?id=${id}`);
      if (res.ok) {
        const data = await res.json();
        currentWall = data.wall || [];
        currentTags = data.tags || {};
        isShared = true;
        return;
      }
    } catch (err) {
      console.error("Failed to load shared wall:", err);
    }
  }

  currentWall = JSON.parse(localStorage.getItem("productWall") || "[]");
  currentTags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  isShared = false;
}

// ====================== AFFILIATE & RENDERING (unchanged until renderWall) ======================
/* ... your existing affiliatePopup, toggle, loadAffiliateTags, saveAffiliate, buildAffiliateLink ... */

// ====================== WALL RENDERING (UPDATED) ======================
const wallGrid = document.getElementById("wallGrid");

function renderWall() {
  wallGrid.innerHTML = "";

  if (isShared) {
    toggleBtn.style.display = "none";
    wallGrid.innerHTML = `<div style="grid-column:1/-1;background:rgba(255,165,0,0.15);border:2px solid var(--accent);color:var(--accent);padding:14px;border-radius:12px;text-align:center;margin-bottom:20px;">
      🔗 Shared Tagshop Wall<br><small>Affiliate links use the sharer's tags</small><br>
      <button onclick="window.location.href = window.location.origin + window.location.pathname" style="margin-top:8px;padding:8px 16px;background:#000;color:var(--accent);border:2px solid var(--accent);border-radius:8px;cursor:pointer;">Create My Own Wall</button>
    </div>`;
  } else {
    toggleBtn.style.display = "block";
  }

  if (currentWall.length === 0) {
    wallGrid.innerHTML += `<p style='grid-column:1/-1;text-align:center;color:#888;font-size:14px;'>Your wall is empty. Add products from the main page!</p>`;
    return;
  }

  currentWall.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "card";

    const affLink = buildAffiliateLink(item.link);

    let html = `<img src="${item.thumb || 'https://via.placeholder.com/300'}" onclick="showItemModal(${idx})" alt="${item.title}">`;
    
    html += `<div class="card-info">`;
    
    if (item.niche) {
      html += `<div class="card-niche">${item.niche}</div>`;
    }
    
    html += `<div class="card-title">${item.title}</div>`;
    
    if (item.summary) {
      html += `<div class="card-summary">${item.summary}</div>`;
    }
    
    html += `<a href="${affLink}" target="_blank" class="card-buy">Buy Now →</a></div>`;

    if (!isShared) {
      html += `<button class="card-remove-btn" onclick="removeItem(${idx})">Remove</button>`;
    }

    div.innerHTML = html;
    wallGrid.appendChild(div);
  });
}

// ====================== ITEM MODAL ======================
function showItemModal(idx) {
  const item = currentWall[idx];
  if (!item) return;

  const affLink = buildAffiliateLink(item.link);

  document.getElementById("modalThumb").src = item.thumb || "https://via.placeholder.com/600";
  document.getElementById("modalTitle").textContent = item.title;
  
  const nicheEl = document.getElementById("modalNiche");
  if (item.niche) {
    nicheEl.textContent = `📂 ${item.niche}`;
    nicheEl.style.display = "block";
  } else {
    nicheEl.style.display = "none";
  }
  
  document.getElementById("modalSummary").textContent = item.summary || "Popular option with strong buyer interest.";
  
  const buyBtn = document.getElementById("modalBuyLink");
  buyBtn.href = affLink;

  document.getElementById("itemModal").style.display = "flex";
}

function closeItemModal() {
  document.getElementById("itemModal").style.display = "none";
}

// ====================== REMOVE ======================
function removeItem(idx) {
  if (isShared) return;
  let wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  wall.splice(idx, 1);
  localStorage.setItem("productWall", JSON.stringify(wall));
  currentWall = wall;
  renderWall();
}

// ====================== UPDATED addToWall (supports new fields) ======================
window.addToWall = function(title, thumb, link, summary = "", niche = "") {
  if (isShared) {
    alert("This is a shared wall (view-only). Create your own to add products!");
    return;
  }
  let wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  if (wall.length >= 50 && !localStorage.getItem("wallUnlocked")) {
    document.getElementById("unlockOverlay").style.display = "flex";
    return;
  }
  wall.push({title, thumb, link, summary, niche});
  localStorage.setItem("productWall", JSON.stringify(wall));
  currentWall = wall;
  renderWall();
};

// ====================== UNLOCK, SHARE, INIT (unchanged) ======================
/* ... your existing unlockBtn, shareWallBtn, showShareModal, etc. ... */

document.getElementById("unlockBtn").addEventListener("click", () => {
  if (document.getElementById("unlockPassword").value.trim() === "tagshopme") {
    localStorage.setItem("wallUnlocked", "true");
    document.getElementById("unlockOverlay").style.display = "none";
    alert("✅ Wall unlocked! You now have unlimited items.");
    renderWall();
  } else alert("Incorrect password.");
});

// ====================== INIT ======================
(async () => {
  await loadWallData();
  if (!isShared) loadAffiliateTags();
  updateAffiliateDisplay();
  renderWall();
})();
</script>
</body>
</html>
