<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkme Shop – Affiliate Storefront</title>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root{
  --bg:#e6e7eb;
  --glass:rgba(255,255,255,0.6);
  --glass-strong:rgba(255,255,255,0.85);
  --border:rgba(255,255,255,0.5);
  --text:#1c1c1c;
  --muted:#6e6e73;
  --shadow:0 25px 60px rgba(0,0,0,0.15);
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:60px 40px 120px;
}

/* ===== TOP NAV ===== */

.topbar{
  background:var(--glass);
  backdrop-filter:blur(30px);
  border-radius:20px 20px 0 0;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--border);
  border-bottom:none;
  box-shadow:var(--shadow);
}

.logo{
  font-size:18px;
  font-weight:600;
  letter-spacing:2px;
}

.nav-buttons{
  display:flex;
  gap:18px;
  align-items:center;
}

.nav-btn{
  background:transparent;
  border:none;
  padding:6px 8px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  transition:.2s ease;
}

.nav-btn:hover{ color:var(--text); }
.nav-btn.primary{ font-weight:600; color:var(--text); }

/* ===== HERO ===== */

.hero{
  text-align:center;
  padding:120px 20px 90px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

.hero h1{ font-size:56px; margin:0; }
.hero p{ margin-top:14px; color:var(--muted); }

/* ===== AFFILIATE POPUP ===== */

#affiliatePopup{
  position:fixed;
  top:120px;
  right:60px;
  background:var(--glass-strong);
  backdrop-filter:blur(30px);
  border-radius:18px;
  padding:25px;
  width:280px;
  display:none;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

#affiliatePopup input{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
  background:#fff;
}

/* ===== GRID ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:30px;
  max-width:1400px;
  margin:0 auto;
  padding:40px 30px 60px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border-radius:0 0 20px 20px;
  border:1px solid var(--border);
  border-top:none;
  box-shadow:var(--shadow);
}

/* ===== PRODUCT CARD ===== */

.card{
  background:var(--glass-strong);
  backdrop-filter:blur(20px);
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--border);
  transition:.3s ease;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 50px rgba(0,0,0,0.12);
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.card-info{ padding:20px; }
.card-title{ font-weight:600; margin-bottom:10px; }
.card-buy{
  display:inline-block;
  margin-top:8px;
  text-decoration:none;
  border-bottom:1px solid var(--text);
  color:var(--text);
}
.card-remove-btn{
  margin-top:12px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:6px 12px;
  cursor:pointer;
}

/* ===== SHARE MODAL ===== */

#shareModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(15px);
  display:none;
  justify-content:center;
  align-items:center;
}

#shareModalContent{
  background:var(--glass-strong);
  padding:35px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:420px;
  box-shadow:var(--shadow);
}

#qrContainer{
  margin:20px auto;
  padding:15px;
  background:#fff;
  border-radius:12px;
}

/* ===== APPLE STYLE UNLOCK ===== */

#unlockModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(20px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
}

#unlockModal.active{
  opacity:1;
  pointer-events:auto;
}

.unlock-card{
  background:var(--glass-strong);
  border-radius:28px;
  padding:50px 40px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 40px 80px rgba(0,0,0,0.25);
  transform:scale(.9);
  opacity:0;
  transition:all .4s cubic-bezier(.22,1,.36,1);
}

#unlockModal.active .unlock-card{
  transform:scale(1);
  opacity:1;
}

.unlock-icon{
  font-size:42px;
  margin-bottom:20px;
}

.unlock-btn{
  width:100%;
  background:#111;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:14px;
  font-weight:500;
  transition:.2s;
}

.unlock-btn:hover{ transform:translateY(-2px); }
.unlock-btn:active{ transform:scale(.97); }

.unlock-later{
  margin-top:18px;
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">LINKME</div>
  <div class="nav-buttons">
    <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
    <button class="nav-btn" onclick="toggleAffiliate()">Affiliate IDs</button>
    <button class="nav-btn primary" id="shareWallBtn">🔒 Share Shop</button>
  </div>
</div>

<section class="hero">
  <h1>LINKME</h1>
  <p>Curated viral finds & must-haves</p>
</section>

<div id="affiliatePopup">
  <input type="text" id="amazonAffiliate" placeholder="Amazon tag">
  <input type="text" id="temuAffiliate" placeholder="Temu tag">
  <input type="text" id="dhgateAffiliate" placeholder="DHGate ID">
  <button onclick="saveAffiliate()">Save</button>
</div>

<div class="grid" id="wallGrid"></div>

<div id="shareModal">
  <div id="shareModalContent">
    <h2>Share Your Shop</h2>
    <div id="qrContainer"><div id="qrcode"></div></div>
    <div id="shareLinkDisplay"></div>
    <button id="copyBtn">Copy Link</button>
    <button onclick="document.getElementById('shareModal').style.display='none'">Close</button>
  </div>
</div>

<!-- UNLOCK MODAL -->
<div id="unlockModal">
  <div class="unlock-card">
    <div class="unlock-icon">🔒</div>
    <h2>Unlock Sharing</h2>
    <p>One-time developer coffee.<br>Free forever after.</p>
    <button class="unlock-btn" onclick="unlockShare()">☕ Buy Developer Coffee</button>
    <button class="unlock-later" onclick="closeUnlock()">Maybe later</button>
  </div>
</div>

<script>
/* ===== ORIGINAL JS ===== */
let isShared=false;
let currentWall=[];
let currentTags={};

async function loadWallData(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get("id");
  if(id){
    const res=await fetch(`/api/getWall?id=${id}`);
    if(res.ok){
      const data=await res.json();
      currentWall=data.wall||[];
      currentTags=data.tags||{};
      isShared=true;
      return;
    }
  }
  currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
  currentTags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
}

function toggleAffiliate(){
  const pop=document.getElementById("affiliatePopup");
  pop.style.display=pop.style.display==="block"?"none":"block";
}

function saveAffiliate(){
  currentTags={
    amazon:document.getElementById("amazonAffiliate").value.trim(),
    temu:document.getElementById("temuAffiliate").value.trim(),
    dhgate:document.getElementById("dhgateAffiliate").value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(currentTags));
  alert("Saved!");
  toggleAffiliate();
}

function buildAffiliateLink(link){
  if(!link) return "#";
  let url=new URL(link);
  if(url.hostname.includes("amazon") && currentTags.amazon)
    url.searchParams.set("tag",currentTags.amazon);
  if(url.hostname.includes("temu") && currentTags.temu)
    url.searchParams.set("aff_id",currentTags.temu);
  if(url.hostname.includes("dhgate") && currentTags.dhgate)
    url.searchParams.set("affid",currentTags.dhgate);
  return url.toString();
}

function renderWall(){
  const grid=document.getElementById("wallGrid");
  grid.innerHTML="";
  if(currentWall.length===0){
    grid.innerHTML="<p style='text-align:center;color:#6e6e73;'>Your shop is empty.</p>";
    return;
  }
  currentWall.forEach((item,idx)=>{
    const div=document.createElement("div");
    div.className="card";
    const aff=buildAffiliateLink(item.link);
    div.innerHTML=`
      <img src="${item.thumb||'https://via.placeholder.com/600'}">
      <div class="card-info">
        <div class="card-title">${item.title}</div>
        <a href="${aff}" target="_blank" class="card-buy">Shop Now</a>
        ${!isShared?`<button class="card-remove-btn" onclick="removeItem(${idx})">Remove</button>`:''}
      </div>
    `;
    grid.appendChild(div);
  });
}

function removeItem(idx){
  let wall=JSON.parse(localStorage.getItem("productWall")||"[]");
  wall.splice(idx,1);
  localStorage.setItem("productWall",JSON.stringify(wall));
  currentWall=wall;
  renderWall();
}

/* ===== SHARE WITH LOCK ===== */

function unlockShare(){
   window.open("https://wise.com/pay/r/LLBS1n4HJAFfa38","_blank");
  localStorage.setItem("shareUnlocked","true");
  closeUnlock();
  document.getElementById("shareWallBtn").innerHTML="✅ Share Shop";
}

function closeUnlock(){
  document.getElementById("unlockModal").classList.remove("active");
}

document.getElementById("shareWallBtn").addEventListener("click",async()=>{

  if(!localStorage.getItem("shareUnlocked")){
    document.getElementById("unlockModal").classList.add("active");
    return;
  }

  if(currentWall.length===0){alert("Add products first");return;}

  const res=await fetch("/api/saveWall",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({wall:currentWall,tags:currentTags})
  });

  const data=await res.json();
  const url=location.origin+"/mywall.html?id="+data.id;

  document.getElementById("shareModal").style.display="flex";
  document.getElementById("shareLinkDisplay").textContent=url;
  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{
    text:url,width:200,height:200
  });
});

if(localStorage.getItem("shareUnlocked")){
  document.getElementById("shareWallBtn").innerHTML="✅ Share Shop";
}

document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(document.getElementById("shareLinkDisplay").textContent);
};

(async()=>{
  await loadWallData();
  renderWall();
})();
</script>
</body>
</html>
