<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
/* KEEPING YOUR STYLES EXACTLY AS THEY WERE */
:root { --accent: #ffa500; --glow: #00FFFF; --text: #fff; --bg: #000; }
/* (styles unchanged for brevity — keep all your CSS exactly as-is here) */
</style>
</head>
<body>

<h1 id="wallTitle">Tagshop Wall</h1>

<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password: <strong>tagshopme</strong> – enter once to unlock forever</span>
</div>

<div id="affiliateIdDisplay"></div>
<div id="visitorCount">Visitors: 0</div>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall</button>

<button id="affiliateToggle">💰 My Affiliate Tags</button>

<!-- Affiliate Popup, Socials, Unlock Overlay, Share Modal -->
<!-- KEEP ALL YOUR HTML STRUCTURE EXACTLY AS YOU HAD IT -->
<!-- (No changes required in HTML layout) -->

<script>

/* ===========================
   VISITOR COUNT
=========================== */

let visitors = (parseInt(localStorage.getItem("visitorCount") || "0")) + 1;
localStorage.setItem("visitorCount", visitors);
document.getElementById("visitorCount").innerText = "Visitors: " + visitors;


/* ===========================
   AFFILIATE HANDLING
=========================== */

const popup = document.getElementById("affiliatePopup");
const toggleBtn = document.getElementById("affiliateToggle");
const affiliateDisplay = document.getElementById("affiliateIdDisplay");

affiliateDisplay.addEventListener("click", () =>
  popup.style.display = popup.style.display === "block" ? "none" : "block"
);

toggleBtn.addEventListener("click", () =>
  popup.style.display = popup.style.display === "block" ? "none" : "block"
);

function updateAffiliateDisplay() {
  const tags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  const active = [];

  if (tags.amazon) active.push("Amazon");
  if (tags.temu) active.push("Temu");
  if (tags.dhgate) active.push("DHGate");

  if (active.length) {
    affiliateDisplay.innerHTML = `✅ Affiliates Active • ${active.join(" + ")}`;
    affiliateDisplay.style.color = "#39ff14";
  } else {
    affiliateDisplay.innerHTML =
      `💰 <span style="color:#ffeb3b;">SET YOUR AFFILIATE TAGS TO EARN COMMISSIONS!</span>`;
  }

  affiliateDisplay.style.display = "block";
}

function loadAffiliateTags() {
  const stored = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  localStorage.setItem("userAffiliateTags", JSON.stringify(stored));
  updateAffiliateDisplay();
}

document.getElementById("saveAffiliate").addEventListener("click", () => {
  const tags = {
    amazon: document.getElementById("amazonAffiliate").value.trim(),
    temu: document.getElementById("temuAffiliate").value.trim(),
    dhgate: document.getElementById("dhgateAffiliate").value.trim()
  };
  localStorage.setItem("userAffiliateTags", JSON.stringify(tags));
  popup.style.display = "none";
  updateAffiliateDisplay();
});


/* ===========================
   WALL RENDERING
=========================== */

const wallGrid = document.getElementById("wallGrid");

function buildAffiliateLink(originalLink) {
  const tags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  if (!originalLink) return "#";

  let url;
  try { url = new URL(originalLink); }
  catch { return originalLink; }

  if (url.hostname.includes("amazon"))
    url.searchParams.set("tag", tags.amazon || "mychanneld-20");

  if (url.hostname.includes("temu.com") && tags.temu)
    url.searchParams.set("aff_id", tags.temu);

  if (url.hostname.includes("dhgate.com"))
    url.searchParams.set("affid", tags.dhgate || "2545671");

  return url.toString();
}

function renderWall() {
  const wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  wallGrid.innerHTML = "";

  if (!wall.length) {
    wallGrid.innerHTML =
      `<p style="grid-column:1/-1;text-align:center;color:#888;">Your wall is empty.</p>`;
    return;
  }

  wall.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${item.thumb}" alt="${item.title}">
      <div class="card-info">
        <div class="card-title">${item.title}</div>
        <a href="${buildAffiliateLink(item.link)}" target="_blank" class="card-buy">Buy Now</a>
      </div>
      <button class="card-remove-btn" onclick="removeItem(${idx})">Remove</button>
    `;

    wallGrid.appendChild(div);
  });
}

function removeItem(idx) {
  let wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  wall.splice(idx, 1);
  localStorage.setItem("productWall", JSON.stringify(wall));
  renderWall();
}


/* ===========================
   NEW CLEAN SHARE SYSTEM
=========================== */

const shareModal = document.getElementById("shareModal");
const shareLinkDisplay = document.getElementById("shareLinkDisplay");
const qrcodeDiv = document.getElementById("qrcode");
const copyBtn = document.getElementById("copyBtn");
const closeShareBtn = document.getElementById("closeShareBtn");

function showShareModal(url) {
  shareModal.style.display = "flex";
  shareLinkDisplay.textContent = url;
  qrcodeDiv.innerHTML = "";

  new QRCode(qrcodeDiv, {
    text: url,
    width: 220,
    height: 220
  });
}

copyBtn.onclick = () => {
  navigator.clipboard.writeText(shareLinkDisplay.textContent)
    .then(() => {
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = "Copy Link", 2000);
    });
};

closeShareBtn.onclick = () => {
  shareModal.style.display = "none";
};

document.getElementById("shareWallBtn")
.addEventListener("click", async () => {

  const wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  if (!wall.length) {
    alert("Add some products first!");
    return;
  }

  const tags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");

  try {
    const res = await fetch("/api/saveWall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wall, tags })
    });

    const data = await res.json();

    if (!data.id) {
      alert("Error creating link.");
      return;
    }

    const cleanURL = window.location.origin + "/w/" + data.id;
    navigator.clipboard.writeText(cleanURL).catch(() => {});
    showShareModal(cleanURL);

  } catch (err) {
    console.error(err);
    alert("Share failed.");
  }

});


/* ===========================
   INIT
=========================== */

loadAffiliateTags();
renderWall();

</script>
</body>
</html>
