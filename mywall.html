<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkMe Wall</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
:root{
  --bg:#1c1c1e;
  --card:#2c2c2e;
  --accent:#0a84ff;
  --text:#f5f5f7;
  --muted:#9a9a9e;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  background:#141416;
  border-bottom:1px solid #2c2c2e;
}

header h1{
  font-size:20px;
  font-weight:600;
  outline:none;
}

/* 3 LANDSCAPE PER ROW */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
  padding:30px;
}

@media(max-width:1100px){
  .grid{ grid-template-columns:repeat(2,1fr); }
}

@media(max-width:700px){
  .grid{ grid-template-columns:1fr; }
}

.card{
  display:flex;
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:45%;
  object-fit:cover;
}

.card-content{
  padding:18px;
  display:flex;
  flex-direction:column;
  width:55%;
}

.badge{
  font-size:12px;
  background:#3a3a3c;
  padding:4px 8px;
  border-radius:8px;
  width:fit-content;
  margin-bottom:8px;
}

.card h3{
  margin:0 0 8px 0;
  font-size:16px;
}

.why{
  font-size:14px;
  color:var(--muted);
  margin-bottom:12px;
  white-space:pre-line;
}

.card-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

button{
  background:var(--accent);
  border:none;
  padding:8px 12px;
  border-radius:8px;
  color:white;
  cursor:pointer;
  font-size:13px;
}

button.secondary{ background:#3a3a3c; }
.remove-btn{ background:#ff453a; }

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-content{
  background:var(--card);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
}

.modal-content input{
  width:100%;
  padding:10px;
  margin-top:15px;
  border-radius:8px;
  border:none;
  background:#3a3a3c;
  color:white;
}
</style>
</head>
<body>

<header>
  <h1 contenteditable="true" id="shopName">🛍 Your Curated Wall</h1>
  <div>
    <button class="secondary" onclick="goHome()">Home</button>
    <button onclick="shareShop()">Share Shop</button>
    <button class="secondary" onclick="openAffiliate()">Affiliate</button>
    <button class="secondary" onclick="clearWall()">Clear</button>
  </div>
</header>

<div class="grid" id="wall"></div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
  <div class="modal-content">
    <h3>Public Shop Link</h3>
    <div id="qrcode"></div>
    <input id="shareLink" readonly />
    <button onclick="copyLink()">Copy Link</button>
    <button class="secondary" onclick="closeShare()">Close</button>
  </div>
</div>

<!-- AFFILIATE MODAL -->
<div class="modal" id="affiliateModal">
  <div class="modal-content">
    <h3>Affiliate Settings</h3>
    <input id="amazonId" placeholder="Amazon Affiliate ID">
    <input id="dhgateId" placeholder="DHGate Affiliate ID">
    <input id="temuId" placeholder="Temu Affiliate ID">
    <button onclick="saveAffiliate()">Save</button>
  </div>
</div>

<script>
let wall = JSON.parse(localStorage.getItem("linkme_wall")) || [];
let affiliate = JSON.parse(localStorage.getItem("linkme_affiliate")) || {};

const grid = document.getElementById("wall");
const shopNameEl = document.getElementById("shopName");

/* SHOP NAME SAVE */
const savedName = localStorage.getItem("linkme_shopname");
if(savedName) shopNameEl.innerText = savedName;
shopNameEl.addEventListener("blur",()=>{
  localStorage.setItem("linkme_shopname", shopNameEl.innerText);
});

/* RENDER */
function render(){
  grid.innerHTML="";
  if(!wall.length){
    grid.innerHTML="<p style='color:#9a9a9e'>No products added yet.</p>";
    return;
  }

  wall.forEach((p,index)=>{
    const finalLink=injectAffiliate(p.link,p.platform);
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.image}">
      <div class="card-content">
        <div class="badge">⭐ Featured</div>
        <h3>${p.title}</h3>
        <div class="why">${p.why||autoWhy(p.title)}</div>
        <div class="card-buttons">
          <button onclick="visit('${finalLink}')">Visit</button>
          <button class="secondary" onclick="editItem(${index})">Edit</button>
          <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* AUTO DESCRIPTION */
function autoWhy(title){
  return `✨ ${title} levels up your setup.\n🔥 Clean aesthetic.\n💎 Smart choice.`;
}

/* EDIT */
function editItem(i){
  const item=wall[i];
  const newTitle=prompt("Edit title:",item.title);
  if(newTitle!==null) item.title=newTitle;
  const newWhy=prompt("Edit description:",item.why||"");
  if(newWhy!==null) item.why=newWhy;
  localStorage.setItem("linkme_wall",JSON.stringify(wall));
  render();
}

/* REMOVE */
function removeItem(i){
  wall.splice(i,1);
  localStorage.setItem("linkme_wall",JSON.stringify(wall));
  render();
}

function clearWall(){
  wall=[];
  localStorage.removeItem("linkme_wall");
  render();
}

function visit(link){ window.open(link,"_blank"); }

/* AFFILIATE LOGIC RESTORED */
function injectAffiliate(link,platform){
  if(platform==="amazon" && affiliate.amazonId){
    return link.includes("?") ? link+"&tag="+affiliate.amazonId : link+"?tag="+affiliate.amazonId;
  }
  if(platform==="dhgate" && affiliate.dhgateId){
    return link+"?aff="+affiliate.dhgateId;
  }
  if(platform==="temu" && affiliate.temuId){
    return link+"?ref="+affiliate.temuId;
  }
  return link;
}

function openAffiliate(){
  document.getElementById("affiliateModal").style.display="flex";
}

function saveAffiliate(){
  affiliate={
    amazonId:amazonId.value,
    dhgateId:dhgateId.value,
    temuId:temuId.value
  };
  localStorage.setItem("linkme_affiliate",JSON.stringify(affiliate));
  affiliateModal.style.display="none";
}

/* SHARE + QR */
async function shareShop(){
  try{
    const res=await fetch("/api/share",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({wall,affiliate})
    });

    if(!res.ok) throw new Error();

    const data=await res.json();
    const url=window.location.origin+"/mywall.html?id="+data.id;

    document.getElementById("shareLink").value=url;
    document.getElementById("shareModal").style.display="flex";

    const qr=document.getElementById("qrcode");
    qr.innerHTML="";
    new QRCode(qr,{ text:url, width:180, height:180 });

  }catch{
    alert("Share failed. Check API.");
  }
}

function copyLink(){
  navigator.clipboard.writeText(document.getElementById("shareLink").value);
}

function closeShare(){
  document.getElementById("shareModal").style.display="none";
}

function goHome(){ window.location.href="index.html"; }

/* LOAD SHARED WALL RESTORED */
async function loadShared(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get("id");
  if(id){
    const res=await fetch("/api/get?id="+id);
    const data=await res.json();
    wall=data.wall||[];
    affiliate=data.affiliate||{};
    render();
  }
}

loadShared();
render();
</script>

</body>
</html>
