<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Linkme Storefront</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>

<style>
:root {
  --accent:#ffe169;
  --glow:#00ffff;
  --glass:rgba(20,20,35,0.85);
  --stroke:rgba(255,255,255,0.18);
  --text:#fff;
  --muted:#d0d0ff;
  --success:#39ff14;
  --viral:#ff3366;
}

body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#000 0%,#0a0015 100%);
  color:var(--text);
}

/* HERO */
.hero{
  position:relative;
  padding:100px 20px 60px;
  text-align:center;
  background:linear-gradient(135deg,#000,#1a0030);
}

#bannerPreview{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:0.35;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  border:3px solid var(--accent);
  background:#111;
  margin:0 auto 16px;
}

#shopName{
  font-size:2.5rem;
  font-weight:900;
  color:var(--accent);
  outline:none;
}

#shopBio{
  max-width:600px;
  margin:10px auto 0;
  color:var(--muted);
  outline:none;
}

/* AFFILIATE */
details{
  max-width:600px;
  margin:30px auto;
  background:var(--glass);
  border:1px solid var(--stroke);
  padding:20px;
  border-radius:20px;
}

details summary{
  cursor:pointer;
  font-weight:700;
  font-size:1.1rem;
}

details input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

details button{
  padding:10px 20px;
  background:var(--accent);
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

/* MASONRY */
.grid{
  column-count:2;
  column-gap:24px;
  padding:20px;
}

@media(min-width:640px){ .grid{ column-count:3; } }
@media(min-width:1024px){ .grid{ column-count:4; } }

.card{
  break-inside:avoid;
  margin-bottom:24px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:24px;
  overflow:hidden;
  transition:all .4s;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
  position:relative;
}

.card:hover{
  transform:translateY(-12px) scale(1.03);
  box-shadow:0 30px 80px rgba(255,165,0,.35);
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.price-badge{
  position:absolute;
  top:14px;
  left:14px;
  background:var(--success);
  color:#000;
  padding:6px 12px;
  border-radius:12px;
  font-weight:800;
}

.platform-badge{
  position:absolute;
  top:14px;
  right:14px;
  background:rgba(0,0,0,.75);
  color:var(--accent);
  padding:6px 12px;
  border-radius:12px;
  font-weight:800;
}

.card-content{
  padding:18px;
}

.card-title{
  font-weight:700;
  margin-bottom:8px;
  color:var(--accent);
}

.card-why{
  font-size:.9rem;
  color:var(--muted);
  margin-bottom:12px;
}

.btn{
  padding:8px 14px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  margin:4px 2px;
}

.btn-buy{ background:var(--accent); color:#000; }
.btn-share{ background:#444; color:#fff; }
.btn-grok{ background:var(--glow); color:#000; }
.btn-remove{ background:#ff4444; color:#fff; }

#publishBtn{
  display:block;
  margin:40px auto;
  padding:18px 40px;
  background:var(--accent);
  color:#000;
  border:none;
  border-radius:40px;
  font-size:1.2rem;
  font-weight:900;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="hero">
  <div id="bannerPreview"></div>
  <div class="avatar"></div>
  <h1 id="shopName" contenteditable="true">My Linkme Shop</h1>
  <p id="shopBio" contenteditable="true">Curated viral finds ✨</p>
  <br>
  <input type="file" id="bannerUpload" accept="image/*">
</div>

<details id="affiliateBox">
  <summary>⚙ Affiliate Settings</summary>
  <input id="amazonTag" placeholder="Amazon Tag (-21)">
  <input id="dhgateTag" placeholder="DHgate ID">
  <input id="temuTag" placeholder="Temu ID">
  <button onclick="saveAffiliateTags()">Save</button>
</details>

<div class="grid" id="wallGrid"></div>

<button id="publishBtn">🔥 Publish My Shop</button>

<script>
let isShared=false;
let currentWall=[];
let currentTags={};

const urlParams=new URLSearchParams(window.location.search);
const sharedId=urlParams.get("id");

function saveAffiliateTags(){
  currentTags={
    amazon:amazonTag.value.trim(),
    dhgate:dhgateTag.value.trim(),
    temu:temuTag.value.trim()
  };
  localStorage.setItem("userAffiliateTags",JSON.stringify(currentTags));
  alert("Affiliate IDs saved.");
}

function requireAffiliateIDs(){
  if(!currentTags.amazon && !currentTags.dhgate && !currentTags.temu){
    affiliateBox.open=true;
    affiliateBox.scrollIntoView({behavior:"smooth"});
    alert("Add affiliate IDs before sharing.");
    return false;
  }
  return true;
}

function buildAffiliateLink(url){
  if(url.includes("amazon.") && currentTags.amazon)
    return url+(url.includes("?")?"&":"?")+"tag="+currentTags.amazon;
  if(url.includes("dhgate.") && currentTags.dhgate)
    return url+(url.includes("?")?"&":"?")+"f="+currentTags.dhgate;
  if(url.includes("temu.") && currentTags.temu)
    return url+(url.includes("?")?"&":"?")+"af="+currentTags.temu;
  return url;
}

function getPlatform(url){
  if(url.includes("amazon")) return "Amazon";
  if(url.includes("dhgate")) return "DHgate";
  if(url.includes("temu")) return "Temu";
  return "Shop";
}

function renderWall(){
  wallGrid.innerHTML="";
  currentWall.forEach((item,i)=>{
    const aff=buildAffiliateLink(item.link);
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${item.thumb}">
      ${item.price?`<div class="price-badge">$${item.price}</div>`:""}
      <div class="platform-badge">${getPlatform(item.link)}</div>
      <div class="card-content">
        <div class="card-title">${item.title}</div>
        <div class="card-why">${item.customWhy||item.snippet||""}</div>
        <a href="${aff}" target="_blank" class="btn btn-buy">Shop</a>
        <button class="btn btn-share" onclick="shareProduct(${i})">Share</button>
        <button class="btn btn-grok" onclick="shareGrok(${i})">Grok</button>
        ${!isShared?`<button class="btn btn-remove" onclick="removeItem(${i})">X</button>`:""}
      </div>`;
    wallGrid.appendChild(card);
  });
}

function shareProduct(i){
  if(!requireAffiliateIDs()) return;
  const aff=buildAffiliateLink(currentWall[i].link);
  navigator.clipboard.writeText(aff);
  alert("Affiliate link copied.");
}

function shareGrok(i){
  if(!requireAffiliateIDs()) return;
  const item=currentWall[i];
  const text=`Create a viral Pinterest-style image and short video script for:
${item.title}
Hook: ${item.customWhy||item.snippet}
Link: ${buildAffiliateLink(item.link)}`;
  navigator.clipboard.writeText(text);
  window.open("https://grok.com","_blank");
}

function removeItem(i){
  currentWall.splice(i,1);
  localStorage.setItem("productWall",JSON.stringify(currentWall));
  renderWall();
}

async function loadWall(){
  if(sharedId){
    isShared=true;
    const res=await fetch("/api/getWall?id="+sharedId);
    const data=await res.json();
    currentWall=data.wall||[];
    currentTags=data.tags||{};
    shopName.innerText=data.shopName||"Shop";
    shopName.contentEditable=false;
    shopBio.contentEditable=false;
    affiliateBox.style.display="none";
    bannerUpload.style.display="none";
  }else{
    currentWall=JSON.parse(localStorage.getItem("productWall")||"[]");
    currentTags=JSON.parse(localStorage.getItem("userAffiliateTags")||"{}");
    shopName.innerText=localStorage.getItem("shopName")||"My Linkme Shop";
    shopBio.innerText=localStorage.getItem("shopBio")||"Curated viral finds ✨";
    const banner=localStorage.getItem("shopBanner");
    if(banner) bannerPreview.style.backgroundImage=`url(${banner})`;
  }
  renderWall();
}

shopName.addEventListener("input",()=>localStorage.setItem("shopName",shopName.innerText));
shopBio.addEventListener("input",()=>localStorage.setItem("shopBio",shopBio.innerText));

bannerUpload.addEventListener("change",e=>{
  const reader=new FileReader();
  reader.onload=()=>{
    bannerPreview.style.backgroundImage=`url(${reader.result})`;
    localStorage.setItem("shopBanner",reader.result);
  };
  reader.readAsDataURL(e.target.files[0]);
});

document.getElementById("publishBtn").onclick=async()=>{
  if(!requireAffiliateIDs()) return;
  const id=Math.random().toString(36).substring(2,8);
  await fetch("/api/saveWall",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      id,
      wall:currentWall,
      tags:currentTags,
      shopName:shopName.innerText,
      shopBio:shopBio.innerText
    })
  });
  alert("Published! Share link: "+window.location.origin+"/mywall.html?id="+id);
};

loadWall();
</script>
</body>
</html>
