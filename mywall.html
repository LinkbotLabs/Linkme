<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop Wall – Free Unlimited Affiliate Showcase</title>
<link rel="stylesheet" href="uniform-dark-glass.css">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<style>
:root { --accent: #ffa500; --glow: #00FFFF; --text: #fff; --bg: #000; }

html, body {
  height: auto !important;
  min-height: 100vh;
  overflow-y: auto !important;
  padding-bottom: 160px !important;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui;
}

h1 { text-align:center; margin-bottom:10px; color:#ffe169; }

/* Unlimited banner */
.unlimited-banner {
  background: linear-gradient(135deg, #1fc27e, #39ff14);
  color: #000;
  padding: 16px;
  text-align: center;
  font-weight: 900;
  font-size: 18px;
  border-radius: 12px;
  margin: 10px 5% 20px;
  box-shadow: 0 0 20px rgba(31,194,126,0.6);
}

/* Collapsible permalink box */
#permanentLinkBox {
  background: rgba(255,165,0,0.15);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 16px;
  margin: 20px 5%;
  text-align: center;
}

details summary {
  font-weight: bold;
  color: var(--accent);
  cursor: pointer;
  font-size: 16px;
  list-style: none;
}

details summary::marker { display: none; }

#permLinkText {
  font-family: monospace;
  word-break: break-all;
  font-size: 13px;
  color: #ffd700;
  background: rgba(0,0,0,0.4);
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
  display: none; /* hidden until expanded */
}

details[open] #permLinkText { display: block; }

/* Rest of your existing styles (unchanged) */
#affiliateIdDisplay, .grid, .card, #affiliatePopup, #shareModal, etc. { /* your original styles remain */ }
</style>
</head>
<body>

<h1 id="wallTitle">Tagshop Wall</h1>

<!-- UNLIMITED BANNER -->
<div class="unlimited-banner">
  ✅ UNLIMITED PRODUCTS FOR EVERYONE!<br>
  <span style="font-size:15px;">Password: <strong>tagshopme</strong> – enter once to unlock forever</span>
</div>

<div id="affiliateIdDisplay"></div>
<div id="visitorCount">Visitors: 0</div>

<!-- COLLAPSIBLE PERMANENT LINK -->
<div id="permanentLinkBox">
  <details>
    <summary>🔗 Click to reveal your Permanent Share Link</summary>
    <div id="permLinkText"></div>
    <button onclick="copyPermanentLink()" 
            style="background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:900; cursor:pointer;">
      📋 Copy Permanent Link
    </button>
  </details>
</div>

<div class="grid" id="wallGrid"></div>

<button id="shareWallBtn">🔗 Share Wall (QR + Modal)</button>

<button id="affiliateToggle">💰 My Affiliate Tags</button>

<!-- Rest of your HTML (affiliate popup, socials, home button, unlock overlay, share modal) remains exactly the same -->
<!-- ... (I kept it short here for readability) ... -->

<script>
// ==================== YOUR EXISTING CODE (Visitor count, affiliate, wall logic, etc.) ====================
let visitors = (parseInt(localStorage.getItem("visitorCount") || "0")) + 1;
localStorage.setItem("visitorCount", visitors);
document.getElementById("visitorCount").innerText = "Visitors: " + visitors;

// ... (all your existing functions: updateAffiliateDisplay, loadAffiliateTags, getSharedData, buildAffiliateLink, renderWall, etc.) ...

// ==================== NEW PERMANENT LINK FUNCTIONS ====================
function getMyWallId() {
  let id = localStorage.getItem("myPermanentWallId");
  if (!id) {
    id = "ts" + Math.random().toString(36).substring(2, 8);
    localStorage.setItem("myPermanentWallId", id);
  }
  return id;
}

function getPermanentShareURL() {
  const wall = JSON.parse(localStorage.getItem("productWall") || "[]");
  const tags = JSON.parse(localStorage.getItem("userAffiliateTags") || "{}");
  const payload = JSON.stringify({wall, tags});
  const compressed = LZString.compressToEncodedURIComponent(payload);
  
  return window.location.origin + 
         window.location.pathname + 
         "?w=" + getMyWallId() + 
         "#data=" + compressed;
}

function copyPermanentLink() {
  const url = getPermanentShareURL();
  navigator.clipboard.writeText(url).then(() => {
    alert("✅ Permanent link copied to clipboard!");
  });
}

// Show the permalink box (owner only)
function showPermanentLinkBox() {
  if (getSharedData()) return; // don't show on shared views
  
  const url = getPermanentShareURL();
  document.getElementById("permLinkText").textContent = url;
}

// Initialize
loadAffiliateTags();
renderWall();
setTimeout(showPermanentLinkBox, 600);

window.addEventListener("hashchange", () => {
  renderWall();
  showPermanentLinkBox();
});
</script>
</body>
</html>
