<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme Builder</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
.panel {
  width: 300px;
  padding: 16px;
  border-right: 1px solid #ddd;
  background: #f9fafb;
  overflow-y: auto;
}

/* RIGHT PREVIEW */
.preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
}

#app {
  width: 100%;
  max-width: 420px;
}

/* UI */
input {
  width: 100%;
  margin-bottom: 10px;
}

.btn {
  margin-top: 10px;
  padding: 10px;
  background: #22c55e;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  display: block;
  width: 100%;
}

.preset-btn {
  width: 100%;
  margin-bottom: 6px;
  padding: 8px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #e5e7eb;

  @media (max-width: 768px) {

  body {
    flex-direction: column;
  }

  .panel {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid #ddd;
  }

  .preview {
    flex: none;
    height: 65vh;
    padding: 10px;
  }

  #app {
    max-width: 100%;
  }

}
}
</style>
</head>

<body>

<div class="panel">
  <h3>🎨 Presets</h3>

  <button class="preset-btn" onclick="loadPreset('darkGlass')">Dark Glass</button>
  <button class="preset-btn" onclick="loadPreset('minimalWhite')">Minimal White</button>
  <button class="preset-btn" onclick="loadPreset('neonViral')">Neon Viral</button>

  <hr/>

  <h3>⚙️ Customize</h3>

  <label>Background</label>
  <input type="color" id="bg" />

  <label>Card</label>
  <input type="color" id="card" />

  <label>Text</label>
  <input type="color" id="text" />

  <label>Accent</label>
  <input type="color" id="accent" />

  <label>Radius</label>
  <input type="range" id="radius" min="0" max="40" />

  <button class="btn" onclick="copyLink()">📋 Copy Link</button>
  <button class="btn" onclick="shareTelegram()">📤 Share Telegram</button>
  <button class="btn" onclick="sharePinterest()">📌 Pinterest</button>
</div>

<div class="preview">
  <div id="app"></div>
</div>

<script type="module">
import { renderCard } from '/card.js';

let productId;
let product;

/* -------- PRESETS -------- */
const presets = {
  darkGlass: {
    bg: "#0f172a",
    card: "rgba(255,255,255,0.05)",
    text: "#ffffff",
    accent: "#22c55e",
    radius: 16
  },
  minimalWhite: {
    bg: "#f9fafb",
    card: "#ffffff",
    text: "#111827",
    accent: "#2563eb",
    radius: 12
  },
  neonViral: {
    bg: "#050505",
    card: "#111111",
    text: "#ffffff",
    accent: "#ff00ff",
    radius: 20
  }
};

let theme = {
  bg: "#111111",
  card: "#111827",
  text: "#ffffff",
  accent: "#22c55e",
  radius: 12
};

let currentPreset = null;

/* -------- INIT -------- */
async function init() {
  const params = new URLSearchParams(window.location.search);
  productId = params.get("id");

  const res = await fetch(`/api/get?id=${productId}`);
  product = await res.json();

  bindInputs();
  applyTheme();
  render();
}

init();

/* -------- RENDER -------- */
function render(){
  document.body.style.background = theme.bg;
  document.getElementById("app").innerHTML = renderCard(product, theme);
}

/* -------- PRESET -------- */
window.loadPreset = function(name){
  const preset = presets[name];
  if (!preset) return;

  currentPreset = name;
  theme = { ...preset };

  syncInputs();
  render();
};

/* -------- INPUTS -------- */
function bindInputs(){
  document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", ()=>{
      theme.bg = document.getElementById("bg").value;
      theme.card = document.getElementById("card").value;
      theme.text = document.getElementById("text").value;
      theme.accent = document.getElementById("accent").value;
      theme.radius = document.getElementById("radius").value;

      render();
    });
  });
}

function syncInputs(){
  document.getElementById("bg").value = theme.bg;
  document.getElementById("card").value = theme.card;
  document.getElementById("text").value = theme.text;
  document.getElementById("accent").value = theme.accent;
  document.getElementById("radius").value = theme.radius;
}

/* -------- ENCODE -------- */
function encodeTheme(){
  return btoa(JSON.stringify({
    ...theme,
    preset: currentPreset || "custom"
  }));
}

/* -------- LINKS -------- */
function getLink(){
  return `https://floatrising.com/t.html?id=${productId}&theme=${encodeTheme()}`;
}

window.copyLink = function(){
  navigator.clipboard.writeText(getLink());
  alert("Link copied");
};

window.shareTelegram = function(){
  const url = encodeURIComponent(getLink());
  window.open(`https://t.me/share/url?url=${url}`, "_blank");
};

window.sharePinterest = function(){
  const url = encodeURIComponent(getLink());
  const image = encodeURIComponent(product.image);
  const desc = encodeURIComponent(product.title);

  window.open(
    `https://pinterest.com/pin/create/button/?url=${url}&media=${image}&description=${desc}`,
    "_blank"
  );
};
</script>

</body>
</html>
