<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme Builder</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #111;
}

/* =========================
   PANEL (GLASS + MINIMAL)
========================= */
.panel {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 280px;
  max-height: 90vh;
  z-index: 9999;

  background: rgba(0,0,0,0.22);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.25);

  color: #fff;

  overflow: hidden;

  cursor: default;
}

/* Header always visible (drag handle) */
.panel-header {
  padding: 10px 12px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;

  cursor: move;
  background: rgba(255,255,255,0.03);
}

/* Collapsible body */
.panel-body {
  padding: 12px;
  display: none;
}

/* Expand on hover */
.panel:hover .panel-body {
  display: block;
}

/* =========================
   CONTROLS
========================= */
label {
  font-size: 12px;
  opacity: 0.7;
}

input {
  width: 100%;
  margin: 6px 0 10px;
  padding: 6px;
  border-radius: 6px;
  border: none;
}

.btn {
  margin-top: 8px;
  padding: 8px;
  background: #22c55e;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  font-size: 13px;
}

.btn.secondary {
  background: rgba(255,255,255,0.08);
}

/* Presets */
.preset-btn {
  width: 100%;
  margin-bottom: 6px;
  padding: 7px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 12px;
}

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.08);
  margin: 10px 0;
}

/* =========================
   PREVIEW
========================= */
.preview {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}

#app {
  width: 100%;
  max-width: 420px;
}
</style>
</head>

<body>

<div class="panel">
  <div class="panel-header" id="panelHeader">
    Theme Editor
    <span style="font-size:12px; opacity:0.6;">drag</span>
  </div>

  <div class="panel-body">

    <button class="btn secondary" onclick="toggleFocus()">🔍 Focus Mode</button>
    <button class="btn secondary" onclick="toggleEditor()">👁 Hide Editor</button>

    <hr/>

    <div>🎨 Presets</div>
    <button class="preset-btn" onclick="loadPreset('darkGlass')">Dark Glass</button>
    <button class="preset-btn" onclick="loadPreset('minimalWhite')">Minimal White</button>
    <button class="preset-btn" onclick="loadPreset('neonViral')">Neon Viral</button>

    <hr/>

    <div>⚙️ Customize</div>

    <label>Background</label>
    <input type="color" id="bg" />

    <label>Card</label>
    <input type="color" id="card" />

    <label>Text</label>
    <input type="color" id="text" />

    <label>Accent</label>
    <input type="color" id="accent" />

    <label>Radius</label>
    <input type="range" id="radius" min="0" max="40" />

    <hr/>

    <button class="btn" onclick="copyLink()">📋 Copy Link</button>
    <button class="btn" onclick="shareTelegram()">📤 Telegram</button>
    <button class="btn" onclick="sharePinterest()">📌 Pinterest</button>

  </div>
</div>

<div class="preview">
  <div id="app"></div>
</div>

<script type="module">
import { renderCard } from '/card.js';

let productId;
let product;

const presets = {
  darkGlass: {
    bg: "#0f172a",
    card: "rgba(255,255,255,0.05)",
    text: "#ffffff",
    accent: "#22c55e",
    radius: 16
  },
  minimalWhite: {
    bg: "#f9fafb",
    card: "#ffffff",
    text: "#111827",
    accent: "#2563eb",
    radius: 12
  },
  neonViral: {
    bg: "#050505",
    card: "#111111",
    text: "#ffffff",
    accent: "#ff00ff",
    radius: 20
  }
};

let theme = {
  bg: "#111111",
  card: "#111827",
  text: "#ffffff",
  accent: "#22c55e",
  radius: 12
};

let currentPreset = null;

/* INIT */
async function init() {
  const params = new URLSearchParams(window.location.search);
  productId = params.get("id");

  const res = await fetch(`/api/get?id=${productId}`);
  product = await res.json();

  bindInputs();
  syncInputs();
  render();
}
init();

/* RENDER */
function render(){
  document.body.style.background = theme.bg;
  document.getElementById("app").innerHTML = renderCard(product, theme);
}

/* PRESETS */
window.loadPreset = function(name){
  theme = { ...presets[name] };
  currentPreset = name;
  syncInputs();
  render();
};

/* INPUTS */
function bindInputs(){
  document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", ()=>{
      theme.bg = document.getElementById("bg").value;
      theme.card = document.getElementById("card").value;
      theme.text = document.getElementById("text").value;
      theme.accent = document.getElementById("accent").value;
      theme.radius = document.getElementById("radius").value;
      render();
    });
  });
}

function syncInputs(){
  document.getElementById("bg").value = theme.bg;
  document.getElementById("card").value = theme.card;
  document.getElementById("text").value = theme.text;
  document.getElementById("accent").value = theme.accent;
  document.getElementById("radius").value = theme.radius;
}

/* TOGGLE */
window.toggleEditor = function(){
  const panel = document.querySelector(".panel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
};

let focusMode = false;
window.toggleFocus = function(){
  const panel = document.querySelector(".panel");
  focusMode = !focusMode;

  panel.style.opacity = focusMode ? "0" : "1";
  panel.style.pointerEvents = focusMode ? "none" : "auto";
};

/* DRAG (HEADER ONLY) */
const panel = document.querySelector(".panel");
const header = document.getElementById("panelHeader");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

header.addEventListener("mousedown", (e)=>{
  dragging = true;
  const rect = panel.getBoundingClientRect();
  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;
});

document.addEventListener("mousemove", (e)=>{
  if(!dragging) return;
  panel.style.left = `${e.clientX - offsetX}px`;
  panel.style.top = `${e.clientY - offsetY}px`;
});

document.addEventListener("mouseup", ()=> dragging = false);

/* LINKS */
function encodeTheme(){
  return btoa(JSON.stringify({ ...theme, preset: currentPreset || "custom" }));
}

function getLink(){
  return `https://floatrising.com/t.html?id=${productId}&theme=${encodeTheme()}`;
}

window.copyLink = function(){
  navigator.clipboard.writeText(getLink());
  alert("Link copied");
};

window.shareTelegram = function(){
  const url = encodeURIComponent(getLink());
  window.open(`https://t.me/share/url?url=${url}`, "_blank");
};

window.sharePinterest = function(){
  const url = encodeURIComponent(getLink());
  const media = encodeURIComponent(product.image);
  const desc = encodeURIComponent("🔥 Trending product");

  window.open(
    `https://pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${desc}`,
    "_blank"
  );
};
</script>

</body>
</html>
