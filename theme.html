<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme Builder</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
}

/* ✅ FLOATING PANEL */
.panel {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 300px;
  max-height: 90vh;
  z-index: 9999;

  background: rgba(249,250,251,0.95);
  backdrop-filter: blur(12px);

  border-radius: 12px;
  padding: 16px;
  overflow-y: auto;

  box-shadow: 0 20px 60px rgba(0,0,0,0.3);

  cursor: move;
}

/* ✅ PREVIEW BACKGROUND */
.preview {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}

#app {
  width: 100%;
  max-width: 420px;
}

/* UI */
input {
  width: 100%;
  margin-bottom: 10px;
}

.btn {
  margin-top: 10px;
  padding: 10px;
  background: #22c55e;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  display: block;
  width: 100%;
}

.preset-btn {
  width: 100%;
  margin-bottom: 6px;
  padding: 8px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #e5e7eb;
}
</style>
</head>

<body>

<div class="panel">

  <div id="panelHeader" style="font-weight:600; margin-bottom:10px;">
    Theme Editor
  </div>

  <button class="btn" onclick="toggleFocus()">🔍 Focus Mode</button>
  <button class="btn" onclick="toggleEditor()">👁 Hide Editor</button>

  <h3>🎨 Presets</h3>

  <button class="preset-btn" onclick="loadPreset('darkGlass')">Dark Glass</button>
  <button class="preset-btn" onclick="loadPreset('minimalWhite')">Minimal White</button>
  <button class="preset-btn" onclick="loadPreset('neonViral')">Neon Viral</button>

  <hr/>

  <h3>⚙️ Customize</h3>

  <label>Background</label>
  <input type="color" id="bg" />

  <label>Card</label>
  <input type="color" id="card" />

  <label>Text</label>
  <input type="color" id="text" />

  <label>Accent</label>
  <input type="color" id="accent" />

  <label>Radius</label>
  <input type="range" id="radius" min="0" max="40" />

  <button class="btn" onclick="copyLink()">📋 Copy Link</button>
  <button class="btn" onclick="shareTelegram()">📤 Share Telegram</button>
  <button class="btn" onclick="sharePinterest()">📌 Pinterest</button>

</div>

<div class="preview">
  <div id="app"></div>
</div>

<script type="module">
import { renderCard } from '/card.js';

let productId;
let product;

/* -------- PRESETS -------- */
const presets = {
  darkGlass: {
    bg: "#0f172a",
    card: "rgba(255,255,255,0.05)",
    text: "#ffffff",
    accent: "#22c55e",
    radius: 16
  },
  minimalWhite: {
    bg: "#f9fafb",
    card: "#ffffff",
    text: "#111827",
    accent: "#2563eb",
    radius: 12
  },
  neonViral: {
    bg: "#050505",
    card: "#111111",
    text: "#ffffff",
    accent: "#ff00ff",
    radius: 20
  }
};

let theme = {
  bg: "#111111",
  card: "#111827",
  text: "#ffffff",
  accent: "#22c55e",
  radius: 12
};

let currentPreset = null;

/* -------- INIT -------- */
async function init() {
  const params = new URLSearchParams(window.location.search);
  productId = params.get("id");

  if(!productId){
    document.getElementById("app").innerHTML = "Missing product";
    return;
  }

  const res = await fetch(`/api/get?id=${productId}`);
  product = await res.json();

  if(!product || product.error){
    document.getElementById("app").innerHTML = "Product not found";
    return;
  }

  bindInputs();
  syncInputs();
  render();
}

init();

/* -------- RENDER -------- */
function render(){
  document.body.style.background = theme.bg;

  document.getElementById("app").innerHTML = renderCard(product, theme);
}

/* -------- PRESET -------- */
window.loadPreset = function(name){
  const preset = presets[name];
  if (!preset) return;

  currentPreset = name;
  theme = { ...preset };

  syncInputs();
  render();
};

/* -------- INPUTS -------- */
function bindInputs(){
  document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", ()=>{
      theme.bg = document.getElementById("bg").value;
      theme.card = document.getElementById("card").value;
      theme.text = document.getElementById("text").value;
      theme.accent = document.getElementById("accent").value;
      theme.radius = document.getElementById("radius").value;

      render();
    });
  });
}

function syncInputs(){
  document.getElementById("bg").value = theme.bg;
  document.getElementById("card").value = theme.card;
  document.getElementById("text").value = theme.text;
  document.getElementById("accent").value = theme.accent;
  document.getElementById("radius").value = theme.radius;
}

/* -------- TOGGLE EDITOR -------- */
window.toggleEditor = function(){
  const panel = document.querySelector(".panel");

  panel.style.display =
    panel.style.display === "none" ? "block" : "none";
};

/* -------- FOCUS MODE -------- */
let focusMode = false;

window.toggleFocus = function () {
  const panel = document.querySelector(".panel");

  focusMode = !focusMode;

  if (focusMode) {
    panel.style.opacity = "0";
    panel.style.pointerEvents = "none";
  } else {
    panel.style.opacity = "1";
    panel.style.pointerEvents = "auto";
  }
};

/* -------- DRAG PANEL -------- */
const panel = document.querySelector(".panel");
const header = document.getElementById("panelHeader");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

header.addEventListener("mousedown", (e) => {
  isDragging = true;

  const rect = panel.getBoundingClientRect();

  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;

  panel.style.transition = "none";
});

document.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  panel.style.left = `${e.clientX - offsetX}px`;
  panel.style.top = `${e.clientY - offsetY}px`;
});

document.addEventListener("mouseup", () => {
  isDragging = false;
});

/* -------- ENCODE -------- */
function encodeTheme(){
  return btoa(JSON.stringify({
    ...theme,
    preset: currentPreset || "custom"
  }));
}

/* -------- LINKS -------- */
function getLink(){
  return `https://floatrising.com/t.html?id=${productId}&theme=${encodeTheme()}`;
}

window.copyLink = function(){
  navigator.clipboard.writeText(getLink());
  alert("Link copied");
};

window.shareTelegram = function(){
  const url = encodeURIComponent(getLink());
  window.open(`https://t.me/share/url?url=${url}`, "_blank");
};

window.sharePinterest = function(){

  const link = getLink();

  const url = encodeURIComponent(link);
  const media = encodeURIComponent(product.image);
  const desc = encodeURIComponent(
    "🔥 This product is going viral right now — tap to see why"
  );

  window.open(
    `https://pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${desc}`,
    "_blank"
  );
};
</script>

</body>
</html>
