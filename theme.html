<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme Builder</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #111;
  display: flex;
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
  width: 300px;
  height: 100vh;

  position: fixed;
  left: 0;
  top: 0;

  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(16px);

  border-right: 1px solid rgba(255,255,255,0.08);

  padding: 12px;
  box-sizing: border-box;

  transform: translateX(0);
  transition: transform 0.3s ease;

  color: #fff;
  overflow-y: auto;
}

.sidebar.closed {
  transform: translateX(-100%);
}

/* Toggle button */
.toggle-btn {
  position: fixed;
  top: 20px;
  left: 320px;
  z-index: 10000;

  background: #22c55e;
  border: none;
  color: #fff;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;

  transition: left 0.3s ease;
}

.sidebar.closed ~ .toggle-btn {
  left: 20px;
}

/* =========================
   CONTENT
========================= */
.content {
  margin-left: 300px;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;

  transition: margin-left 0.3s ease;
}

.sidebar.closed ~ .content {
  margin-left: 0;
}

#app {
  width: 100%;
  max-width: 420px;
}

/* =========================
   UI
========================= */
input {
  width: 100%;
  margin-bottom: 10px;
}

.btn {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: #22c55e;
  color: #fff;
}

.preset-btn {
  width: 100%;
  margin-bottom: 6px;
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
  color: #fff;
}

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.1);
  margin: 10px 0;
}
</style>
</head>

<body>

<div id="sidebar" class="sidebar closed">

  <h3>🎨 Theme Editor</h3>
<div style="
font-size:11px;
color:#9ca3af;
text-align:center;
margin-top:8px;
">
Use the editor panel to share this card
</div>
  <h4>Presets</h4>
  <button class="preset-btn" onclick="loadPreset('darkGlass')">Dark Glass</button>
  <button class="preset-btn" onclick="loadPreset('minimalWhite')">Minimal White</button>
  <button class="preset-btn" onclick="loadPreset('neonViral')">Neon Viral</button>

  <hr/>

  <h4>Customize</h4>

  <label>Background</label>
  <input type="color" id="bg" />

  <label>Card</label>
  <input type="color" id="card" />

  <label>Text</label>
  <input type="color" id="text" />

  <label>Accent</label>
  <input type="color" id="accent" />

  <label>Radius</label>
  <input type="range" id="radius" min="0" max="40" />

  <hr/>

  <button class="btn" onclick="copyLink()">📋 Copy Link</button>
  <button class="btn" onclick="shareTelegram()">📤 Telegram</button>
  <button class="btn" onclick="sharePinterest()">📌 Pinterest</button>

</div>

<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<div class="content">
  <div id="app"></div>
</div>

<script type="module">
import { renderCard } from '/card.js';

let productId;
let product;

const presets = {
  darkGlass: {
    bg: "#0f172a",
    card: "rgba(255,255,255,0.05)",
    text: "#ffffff",
    accent: "#22c55e",
    radius: 16
  },
  minimalWhite: {
    bg: "#f9fafb",
    card: "#ffffff",
    text: "#111827",
    accent: "#2563eb",
    radius: 12
  },
  neonViral: {
    bg: "#050505",
    card: "#111111",
    text: "#ffffff",
    accent: "#ff00ff",
    radius: 20
  }
};

let theme = {
  bg: "#111111",
  card: "#111827",
  text: "#ffffff",
  accent: "#22c55e",
  radius: 12
};

let currentPreset = null;

/* INIT */
async function init() {
  const params = new URLSearchParams(window.location.search);
  productId = params.get("id");

  const res = await fetch(`/api/get?id=${productId}`);
  product = await res.json();

  bindInputs();
  syncInputs();
  render();
}
init();

/* RENDER */
function render(){
  document.body.style.background = theme.bg;
  document.getElementById("app").innerHTML = renderCard(product, theme);
}

/* SIDEBAR */
window.toggleSidebar = function(){
  document.getElementById("sidebar").classList.toggle("closed");
};

/* PRESETS */
window.loadPreset = function(name){
  theme = { ...presets[name] };
  currentPreset = name;
  syncInputs();
  render();
};

/* INPUTS */
function bindInputs(){
  document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", ()=>{
      theme.bg = document.getElementById("bg").value;
      theme.card = document.getElementById("card").value;
      theme.text = document.getElementById("text").value;
      theme.accent = document.getElementById("accent").value;
      theme.radius = document.getElementById("radius").value;
      render();
    });
  });
}

function syncInputs(){
  document.getElementById("bg").value = theme.bg;
  document.getElementById("card").value = theme.card;
  document.getElementById("text").value = theme.text;
  document.getElementById("accent").value = theme.accent;
  document.getElementById("radius").value = theme.radius;
}

/* ✅ IMPORTANT: ALWAYS GET LATEST THEME */
function getCurrentTheme(){
  theme.bg = document.getElementById("bg").value;
  theme.card = document.getElementById("card").value;
  theme.text = document.getElementById("text").value;
  theme.accent = document.getElementById("accent").value;
  theme.radius = document.getElementById("radius").value;

  return theme;
}

/* ENCODE */
function encodeTheme(){
  return btoa(JSON.stringify({
    ...getCurrentTheme(),
    preset: currentPreset || "custom"
  }));
}

/* LINK */
function getLink(){
  return `https://floatrising.com/t.html?id=${productId}&theme=${encodeTheme()}`;
}

/* COPY */
window.copyLink = async function(){
  try {
    const link = getLink();
    await navigator.clipboard.writeText(link);
    alert("✅ Link copied with current theme!");
  } catch(e){
    alert("⚠️ Copy failed");
  }
};

/* SHARE */
window.shareTelegram = function(){
  const url = encodeURIComponent(getLink());
  window.open(`https://t.me/share/url?url=${url}`, "_blank");
};

window.sharePinterest = function(){
  const url = encodeURIComponent(getLink());
  const media = encodeURIComponent(product.image);
  const desc = encodeURIComponent("🔥 Trending product");

  window.open(
    `https://pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${desc}`,
    "_blank"
  );
};
</script>

</body>
</html>
