<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TagShop – Free AI Video Generator</title>

  <!-- Puter.js (official) -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    body {
      font-family: system-ui, Arial;
      background: #0f0f0f;
      color: #f5f5f5;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    h1, h2 { color: #00e5ff; }
    textarea, input {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1a1a1a;
      color: #fff;
    }
    button {
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: #00e5ff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 14px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
    hr {
      margin: 30px 0;
      border: 1px solid #222;
    }
    .note {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

<h1>🎬 TagShop AI Video Generator</h1>
<p class="note">
Free to try • No API keys • Powered by Puter (User-Pays)
</p>

<hr>

<!-- TEXT TO VIDEO -->
<h2>📝 Text → Video (Wan 2.2)</h2>

<textarea id="textPrompt" rows="4">
A colorful cartoon pigeon talking directly to the camera, comedy style
</textarea>

<button onclick="generateTextVideo()">Generate Text → Video</button>
<div id="textStatus" class="status"></div>

<hr>

<!-- IMAGE TO VIDEO -->
<h2>🖼️ Image → Video (Wan 2.2)</h2>

<textarea id="imagePrompt" rows="4">
A dynamic graffiti art character comes to life and performs a fast rap under a city bridge at night
</textarea>

<input
  id="imageUrl"
  value="https://help-static-aliyun-doc.aliyuncs.com/file-manage-files/zh-CN/20250925/wpimhv/rap.png"
/>

<button onclick="generateImageVideo()">Generate Image → Video</button>
<div id="imageStatus" class="status"></div>

<div id="output"></div>

<script>
/* ---------- TEXT → VIDEO ---------- */
function generateTextVideo() {
  const status = document.getElementById("textStatus");
  const output = document.getElementById("output");
  output.innerHTML = "";

  const start = Date.now();
  const timer = setInterval(() => {
    status.textContent = `Loading (${((Date.now() - start) / 1000).toFixed(1)}s)`;
  }, 100);

  puter.ai.txt2vid(
    document.getElementById("textPrompt").value,
    { model: "Wan-AI/Wan2.2-T2V-A14B" }
  )
  .then(video => {
    clearInterval(timer);
    status.textContent = "Finished ✔";
    output.appendChild(video);
    video.controls = true;
    video.muted = true;
    video.playsInline = true;
    video.addEventListener("loadeddata", () => video.play().catch(()=>{}));
  })
  .catch(err => {
    clearInterval(timer);
    console.error(err);
    status.textContent = err.message || JSON.stringify(err);
  });
}

/* ---------- IMAGE → VIDEO ---------- */
function generateImageVideo() {
  const status = document.getElementById("imageStatus");
  const output = document.getElementById("output");
  output.innerHTML = "";

  const start = Date.now();
  const timer = setInterval(() => {
    status.textContent = `Loading (${((Date.now() - start) / 1000).toFixed(1)}s)`;
  }, 100);

  puter.ai.txt2vid(
    document.getElementById("imagePrompt").value,
    {
      model: "Wan-AI/Wan2.2-I2V-A14B",
      image_url: document.getElementById("imageUrl").value
    }
  )
  .then(video => {
    clearInterval(timer);
    status.textContent = "Finished ✔";
    output.appendChild(video);
    video.controls = true;
    video.muted = true;
    video.playsInline = true;
    video.addEventListener("loadeddata", () => video.play().catch(()=>{}));
  })
  .catch(err => {
    clearInterval(timer);
    console.error(err);
    status.textContent = err.message || JSON.stringify(err);
  });
}
</script>

</body>
</html>
